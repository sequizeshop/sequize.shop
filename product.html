  <link rel="icon" type="image/png" href="https://i.ibb.co/93kQCKxT/20261019-120246.png">
  <link rel="apple-touch-icon" href="https://i.ibb.co/93kQCKxT/20261019-120246.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --primary: #2962ff;
      --primary-hover: #1749d8;
      --primary-light: #edf3ff;
      --black: #202124;
      --gray: #737780;
      --border: #e6eaf0;
      --light: #f6f8fc;
      --danger: #c62828;
      --success: #16803c;
      --radius: 16px;
      --skeleton: #ededed;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      font-family: "Inter", sans-serif;
      color: var(--black);
      background: #ffffff;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    /* NAVBAR */

    .navbar {
      height: 76px;
      min-height: 76px;
      max-height: 76px;
      padding: 0 7%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 20;
      flex-shrink: 0;
      transform: none;
      transition: none;
      box-sizing: border-box;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand img {
      width: 46px;
      height: 46px;
      object-fit: contain;
      display: block;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .nav-icon {
      width: 38px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      color: var(--primary);
      border-radius: 12px;
      transition: background .2s, color .2s;
    }

    .nav-icon:hover {
      background: var(--primary-light);
      color: var(--primary-hover);
    }

    /* PAGE */

    .container {
      width: 86%;
      max-width: 1200px;
      margin: 28px auto 70px;
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 28px;
      font-size: 12px;
      color: var(--gray);
    }

    .breadcrumbs a:hover {
      color: var(--primary);
    }

    .breadcrumbs i {
      font-size: 13px;
    }

    /* PRODUCT GRID */

    .product-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
      gap: 48px;
      align-items: start;
    }

    /* GALLERY */

    .gallery {
      min-width: 0;
    }

    .main-image-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--light);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 30px;
      display: block;
    }

    .image-counter {
      position: absolute;
      right: 14px;
      bottom: 14px;
      padding: 8px 11px;
      border-radius: 8px;
      background: rgba(255,255,255,.96);
      color: var(--primary);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 700;
    }

    .gallery-thumbnails {
      display: flex;
      gap: 12px;
      margin-top: 14px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .thumbnail-button {
      width: 76px;
      height: 76px;
      flex: 0 0 76px;
      padding: 6px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 11px;
      overflow: hidden;
      transition: border-color .2s, background .2s;
    }

    .thumbnail-button.active {
      border: 2px solid var(--primary);
      background: var(--primary-light);
    }

    .thumbnail-button img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* PRODUCT INFO */

    .product-info {
      min-width: 0;
    }

    .product-category {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--primary);
      background: var(--primary-light);
      padding: 7px 11px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 14px;
    }

    .product-title {
      font-size: clamp(26px, 3vw, 36px);
      line-height: 1.25;
      letter-spacing: -1.1px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .product-brand {
      margin-top: 12px;
      font-size: 12px;
      color: var(--gray);
    }

    .product-brand strong {
      color: var(--black);
    }

    .rating-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 17px;
      font-size: 12px;
    }

    .rating-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--primary-light);
      color: var(--primary);
      padding: 7px 9px;
      border-radius: 7px;
      font-weight: 800;
    }

    .rating-badge i {
      color: #e09a00;
      font-size: 14px;
    }

    .muted {
      color: var(--gray);
    }

    .product-divider {
      height: 1px;
      background: var(--border);
      margin: 23px 0;
    }

    .price-block {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
    }

    .current-price {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -.7px;
      color: var(--primary);
    }

    .original-price {
      font-size: 15px;
      color: #888;
      text-decoration: line-through;
    }

    .discount-badge {
      padding: 6px 8px;
      border-radius: 7px;
      background: #eaf7ee;
      color: var(--success);
      font-size: 11px;
      font-weight: 800;
    }

    .tax-note {
      margin-top: 8px;
      color: var(--gray);
      font-size: 11px;
      line-height: 1.7;
    }

    .stock-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 19px;
      font-size: 12px;
      font-weight: 700;
      color: var(--success);
    }

    .stock-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }

    .stock-line.out-of-stock {
      color: var(--danger);
    }

    .stock-line.out-of-stock .stock-dot {
      background: var(--danger);
    }

    .product-description {
      margin-top: 21px;
      font-size: 13px;
      color: #555b65;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    /* QUANTITY */

    .purchase-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 11px;
    }

    .quantity-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    .quantity-control {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      border: 1px solid var(--border);
      padding: 6px;
      border-radius: 10px;
      background: #fff;
    }

    .quantity-control button {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 7px;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: background .2s;
    }

    .quantity-control button:hover:not(:disabled) {
      background: #dce7ff;
    }

    .quantity-value {
      min-width: 20px;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
    }

    /* BUTTONS */

    .purchase-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 50px;
      gap: 10px;
      margin-top: 18px;
    }

    .purchase-button {
      min-height: 49px;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      font-weight: 800;
      transition: background .2s, color .2s, border-color .2s;
    }

    .add-cart-button {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .add-cart-button:hover:not(:disabled) {
      background: var(--primary-light);
    }

    .add-cart-button i,
    .buy-now-button i {
      font-size: 18px;
      flex-shrink: 0;
    }

    .buy-now-button {
      background: var(--primary);
      color: #fff;
      border: 1px solid var(--primary);
    }

    .buy-now-button:hover:not(:disabled) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .wishlist-button {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--primary);
      font-size: 21px;
      padding: 0;
    }

    .wishlist-button:hover {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    .wishlist-button.active {
      color: var(--danger);
      border-color: #f2caca;
      background: #fff5f5;
    }

    .share-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 0;
      background: transparent;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      margin-top: 17px;
      padding: 5px 0;
    }

    .share-button:hover {
      color: var(--primary-hover);
    }

    .share-button i {
      font-size: 17px;
    }

    /* SERVICE CARDS */

    .service-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 25px;
    }

    .service-card {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 14px;
      background: var(--light);
      border: 1px solid #edf0f5;
      border-radius: 11px;
      min-width: 0;
    }

    .service-card > i {
      font-size: 22px;
      flex-shrink: 0;
      color: var(--primary);
    }

    .service-card strong {
      display: block;
      font-size: 11px;
      line-height: 1.5;
    }

    .service-card span {
      display: block;
      margin-top: 4px;
      font-size: 10px;
      color: var(--gray);
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    /* DETAILS */

    .details-section {
      margin-top: 70px;
    }

    .section-heading {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -.7px;
      margin-bottom: 23px;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .detail-row {
      display: grid;
      grid-template-columns: minmax(110px, .8fr) minmax(0, 1.2fr);
      gap: 12px;
      padding: 17px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      line-height: 1.7;
    }

    .detail-row:nth-child(odd) {
      border-right: 1px solid var(--border);
    }

    .detail-row span {
      color: var(--gray);
    }

    .detail-row strong {
      overflow-wrap: anywhere;
    }

    /* REVIEWS */

    .reviews-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 23px;
    }

    .reviews-header .section-heading {
      margin: 0;
    }

    .review-summary {
      font-size: 12px;
      color: var(--gray);
    }

    .reviews-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .review-card {
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 19px;
      min-width: 0;
    }

    .review-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .reviewer-name {
      font-size: 12px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .review-date {
      font-size: 10px;
      color: var(--gray);
      margin-top: 5px;
    }

    .review-stars {
      color: #e09a00;
      font-size: 12px;
      white-space: nowrap;
    }

    .review-comment {
      margin-top: 13px;
      font-size: 12px;
      line-height: 1.8;
      color: #555b65;
      overflow-wrap: anywhere;
    }

    .empty-reviews {
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 13px;
      color: var(--gray);
      font-size: 12px;
      text-align: center;
    }

    /* RELATED PRODUCTS */

    .related-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .related-card {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 13px;
      overflow: hidden;
      background: #fff;
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }

    .related-card:hover {
      transform: translateY(-3px);
      border-color: #cbd8ff;
      box-shadow: 0 8px 25px rgba(41,98,255,.09);
    }

    .related-image {
      aspect-ratio: 1 / 1;
      padding: 15px;
      background: var(--light);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .related-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .related-info {
      padding: 14px;
    }

    .related-title {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.6;
      height: 38px;
      overflow: hidden;
    }

    .related-price {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 800;
      color: var(--primary);
    }

    .related-rating {
      margin-top: 7px;
      color: var(--gray);
      font-size: 10px;
    }

    /* SKELETON */

    .skeleton {
      position: relative;
      overflow: hidden;
      background: var(--skeleton);
      border-radius: 7px;
    }

    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.8),
        transparent
      );
      animation: shimmer 1.35s infinite;
    }

    @keyframes shimmer {
      100% {
        transform: translateX(100%);
      }
    }

    .skeleton-main-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius);
    }

    .skeleton-thumb-row {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }

    .skeleton-thumb {
      width: 76px;
      height: 76px;
      flex: 0 0 76px;
      border-radius: 11px;
    }

    .skeleton-line {
      height: 13px;
      margin-bottom: 14px;
    }

    .skeleton-line.small {
      width: 35%;
    }

    .skeleton-line.medium {
      width: 60%;
    }

    .skeleton-line.large {
      width: 90%;
      height: 22px;
    }

    .skeleton-line.price {
      width: 48%;
      height: 30px;
      margin-top: 22px;
    }

    .skeleton-description {
      height: 80px;
      margin-top: 20px;
    }

    .skeleton-buttons {
      height: 49px;
      margin-top: 20px;
    }

    .skeleton-related {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .skeleton-product-card {
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 12px;
    }

    .skeleton-product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      margin-bottom: 15px;
    }

    .skeleton-product-title {
      width: 85%;
      height: 12px;
      margin-bottom: 12px;
    }

    .skeleton-product-price {
      width: 50%;
      height: 15px;
    }

    /* STATUS AND TOAST */

    .status {
      padding: 50px 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-align: center;
      color: var(--gray);
      font-size: 13px;
      line-height: 1.8;
    }

    .status > i {
      font-size: 45px;
      display: block;
      margin-bottom: 15px;
      color: var(--primary);
    }

    .status h2 {
      color: var(--black);
      margin-bottom: 8px;
    }

    .status button,
    .status a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      padding: 12px 18px;
      border: 1px solid var(--primary);
      border-radius: 9px;
      background: var(--primary);
      color: white;
      font-size: 12px;
      font-weight: 700;
      transition: background .2s;
    }

    .status button:hover,
    .status a:hover {
      background: var(--primary-hover);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translate(-50%, 15px);
      padding: 13px 18px;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      z-index: 100;
      text-align: center;
      max-width: calc(100% - 30px);
      box-shadow: 0 6px 20px rgba(41,98,255,.2);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* FOOTER */

    .footer {
      border-top: 1px solid var(--border);
      padding: 25px 7%;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      color: #888;
      font-size: 11px;
    }

    @media (max-width: 950px) {
      .product-layout {
        grid-template-columns: 1fr 1fr;
        gap: 25px;
      }

      .purchase-buttons {
        grid-template-columns: 1fr 1fr 45px;
      }

      .purchase-button {
        padding: 11px 9px;
      }

      .wishlist-button {
        grid-column: auto;
        min-height: 49px;
      }

      .related-grid,
      .skeleton-related {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .navbar {
        height: 66px;
        min-height: 66px;
        max-height: 66px;
        padding: 0 5%;
        margin: 0;
        transition: none;
        transform: none;
      }

      .brand img {
        width: 40px;
        height: 40px;
      }

      .nav-actions {
        gap: 12px;
      }

      .nav-icon {
        width: 36px;
        height: 40px;
        font-size: 24px;
      }

      .container {
        width: 90%;
        margin-top: 22px;
      }

      .product-layout {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .main-image-wrap {
        max-height: 480px;
      }

      .main-image {
        padding: 22px;
      }

      .product-title {
        font-size: 27px;
      }

      .details-section {
        margin-top: 48px;
      }

      .details-grid {
        grid-template-columns: 1fr;
      }

      .detail-row:nth-child(odd) {
        border-right: 0;
      }

      .reviews-grid {
        grid-template-columns: 1fr;
      }

      .related-grid,
      .skeleton-related {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .service-grid {
        gap: 8px;
      }

      .service-card {
        padding: 11px;
      }

      .section-heading {
        font-size: 21px;
      }

      .footer {
        padding: 22px 5%;
      }
    }

    @media (max-width: 380px) {
      .purchase-buttons {
        grid-template-columns: 1fr 1fr 42px;
        gap: 7px;
      }

      .purchase-button {
        font-size: 11px;
        padding: 10px 6px;
      }

      .wishlist-button {
        grid-column: auto;
      }

      .service-grid {
        grid-template-columns: 1fr;
      }

      .detail-row {
        grid-template-columns: 100px minmax(0, 1fr);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .skeleton::after {
        animation: none;
      }

      .related-card,
      .toast,
      .nav-icon,
      .purchase-button {
        transition: none;
      }
    }
  </style>
</head>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    /*
      Product API returns price in INR.
      originalPriceUSD is retained for the existing cart API,
      because cart.html converts USD to INR for display.
    */

    const USD_TO_INR = 85;
    const PRODUCT_ID_PATTERN = /^[A-Za-z0-9]{40}$/;
    const SITE_URL = "https://shopingweb-zeta.vercel.app";
    const DEFAULT_IMAGE =
      "https://i.ibb.co/93kQCKxT/20261019-120246.png";

    const productArea = document.getElementById("productArea");
    const detailsSection = document.getElementById("detailsSection");
    const reviewsSection = document.getElementById("reviewsSection");
    const relatedSection = document.getElementById("relatedSection");
    const toast = document.getElementById("toast");

    const params = new URLSearchParams(window.location.search);
    const productId = String(params.get("id") || "").trim();

    let product = null;
    let selectedImageIndex = 0;
    let quantity = 1;
    let busy = false;
    let toastTimer = null;

    /* FIREBASE WISHLIST STATE */

    let wishlistItems = [];
    let wishlistLoaded = false;
    let wishlistBusy = false;

    document.getElementById("year").textContent =
      new Date().getFullYear();

    /* HELPERS */

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function formatPrice(price) {
      const inrPrice = Number(price) || 0;

      return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(inrPrice);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2400);
    }

    function getDiscountedPrice(item) {
      const price = Number(item.price) || 0;
      const discount = Math.max(
        0,
        Math.min(100, Number(item.discountPercentage) || 0)
      );

      return price * (1 - discount / 100);
    }

    function safeImage(url) {
      try {
        const parsed = new URL(url, window.location.origin);

        if (
          parsed.protocol !== "https:" &&
          parsed.origin !== window.location.origin
        ) {
          return "";
        }

        return parsed.href;
      } catch {
        return "";
      }
    }

    function updateMeta(selector, content) {
      const element = document.querySelector(selector);

      if (element) {
        element.setAttribute("content", String(content || ""));
      }
    }

    function updateProductMetadata(item) {
      const title = `${item.title} — Shoppy`;
      const description = String(
        item.description || `Explore ${item.title} on Shoppy.`
      ).slice(0, 300);

      const image = safeImage(item.thumbnail) || DEFAULT_IMAGE;
      const canonical =
        `${SITE_URL}/product.html?id=${encodeURIComponent(item.id)}`;
      const pageUrl = window.location.href;

      document.title = title;

      updateMeta('meta[name="description"]', description);
      updateMeta("#ogTitle", title);
      updateMeta("#ogDescription", description);
      updateMeta("#ogUrl", pageUrl);
      updateMeta("#ogImage", image);
      updateMeta("#ogImageAlt", item.title);
      updateMeta("#twitterTitle", title);
      updateMeta("#twitterDescription", description);
      updateMeta("#twitterImage", image);

      const canonicalElement = document.getElementById("canonicalUrl");

      if (canonicalElement) {
        canonicalElement.href = canonical;
      }
    }

    /* API */

    async function fetchJSON(url, options = {}) {
      const response = await fetch(url, {
        credentials: "same-origin",
        cache: "no-store",
        ...options,
        headers: {
          Accept: "application/json",
          ...(options.headers || {})
        }
      });

      const text = await response.text();
      let data;

      try {
        data = JSON.parse(text);
      } catch {
        throw new Error("Server returned an invalid response.");
      }

      if (!response.ok || data.success !== true) {
        const error = new Error(
          data.message || "Request failed."
        );

        error.status = response.status;
        throw error;
      }

      return data;
    }

    /* LOAD PRODUCT */

    async function loadProduct() {
      if (!PRODUCT_ID_PATTERN.test(productId)) {
        showProductError(
          "Invalid product link. Please open a valid product."
        );
        return;
      }

      try {
        const data = await fetchJSON(
          `/api/product?id=${encodeURIComponent(productId)}`
        );

        if (
          !data.product ||
          String(data.product.id) !== productId
        ) {
          throw new Error("Product not found.");
        }

        product = data.product;

        product.title = String(product.title || "Product");
        product.description = String(product.description || "");
        product.category = String(product.category || "Products");
        product.brand = String(product.brand || "");
        product.thumbnail = String(product.thumbnail || "");
        product.availabilityStatus = String(
          product.availabilityStatus || ""
        );

        product.images = Array.isArray(product.images)
          ? product.images
          : [];

        product.reviews = Array.isArray(product.reviews)
          ? product.reviews
          : [];

        product.tags = Array.isArray(product.tags)
          ? product.tags
          : [];

        updateProductMetadata(product);

        document.getElementById("breadcrumbCategory").textContent =
          product.category || "Products";

        document.getElementById("breadcrumbTitle").textContent =
          product.title;

        renderProduct();

        loadWishlistState();
        loadDetails();
        loadReviews();
        loadRelatedProducts();

      } catch (error) {
        console.error("Product loading error:", error);

        showProductError(
          error.message || "Unable to load this product."
        );
      }
    }

    function showProductError(message) {
      productArea.setAttribute("aria-busy", "false");

      productArea.innerHTML = `
        <div class="status">
          <i class="ph ph-warning-circle"></i>
          <h2>Unable to load product</h2>
          <p>${escapeHTML(message)}</p>
          <button type="button" onclick="window.location.reload()">
            Try Again
          </button>
          <br>
          <a href="/home.html">Back to Shopping</a>
        </div>
      `;

      detailsSection.hidden = true;
      reviewsSection.hidden = true;
      relatedSection.hidden = true;
    }

    /* PRODUCT GALLERY */

    function getProductImages(item) {
      const allImages = [
        item.thumbnail,
        ...(Array.isArray(item.images) ? item.images : [])
      ]
        .filter(Boolean)
        .map(safeImage)
        .filter(Boolean);

      return [...new Set(allImages)];
    }

    function renderGallery() {
      const images = getProductImages(product);

      selectedImageIndex = Math.min(
        selectedImageIndex,
        Math.max(0, images.length - 1)
      );

      const currentImage = images[selectedImageIndex] || "";

      return `
        <div class="gallery">
          <div class="main-image-wrap">
            ${
              currentImage
                ? `
                  <img
                    id="mainProductImage"
                    class="main-image"
                    src="${escapeHTML(currentImage)}"
                    alt="${escapeHTML(product.title)}"
                    onerror="this.onerror=null;this.src='https://placehold.co/600x600/f6f6f6/777?text=Product';"
                  >
                `
                : `
                  <img
                    class="main-image"
                    src="https://placehold.co/600x600/f6f6f6/777?text=Product"
                    alt="${escapeHTML(product.title)}"
                  >
                `
            }

            <span class="image-counter">
              ${images.length ? selectedImageIndex + 1 : 1}
              /
              ${Math.max(1, images.length)}
            </span>
          </div>

          <div class="gallery-thumbnails">
            ${
              images.map((image, index) => `
                <button
                  type="button"
                  class="thumbnail-button ${index === selectedImageIndex ? "active" : ""}"
                  data-image-index="${index}"
                  aria-label="View product image ${index + 1}"
                  aria-pressed="${index === selectedImageIndex}"
                >
                  <img
                    src="${escapeHTML(image)}"
                    alt=""
                    loading="lazy"
                  >
                </button>
              `).join("")
            }
          </div>
        </div>
      `;
    }

    function renderProduct() {
      const discountedPrice = getDiscountedPrice(product);

      const discount = Math.max(
        0,
        Number(product.discountPercentage) || 0
      );

      const inStock =
        Number(product.stock) > 0 &&
        product.availabilityStatus.toLowerCase() !== "out of stock";

      productArea.innerHTML = `
        <div class="product-layout">

          ${renderGallery()}

          <div class="product-info">

            <div class="product-category">
              <i class="ph ph-tag"></i>
              ${escapeHTML(product.category || "Product")}
            </div>

            <h1 class="product-title">
              ${escapeHTML(product.title)}
            </h1>

            <p class="product-brand">
              Brand:
              <strong>${escapeHTML(product.brand || "Generic")}</strong>
            </p>

            <div class="rating-row">
              <span class="rating-badge">
                <i class="ph-fill ph-star"></i>
                ${(Number(product.rating) || 0).toFixed(1)}
              </span>

              <span class="muted">
                ${product.reviews.length} customer reviews
              </span>
            </div>

            <div class="product-divider"></div>

            <div class="price-block">
              <span class="current-price">
                ${formatPrice(discountedPrice)}
              </span>

              ${
                discount > 0
                  ? `
                    <span class="original-price">
                      ${formatPrice(product.price)}
                    </span>

                    <span class="discount-badge">
                      ${discount.toFixed(0)}% OFF
                    </span>
                  `
                  : ""
              }
            </div>

            <p class="tax-note">
              Price displayed in INR. Final payable amount should be verified at checkout.
            </p>

            <div class="stock-line ${inStock ? "" : "out-of-stock"}">
              <span class="stock-dot"></span>

              ${
                inStock
                  ? `${Number(product.stock)} units available`
                  : "Currently unavailable"
              }
            </div>

            <p class="product-description">
              ${escapeHTML(product.description || "No description available.")}
            </p>

            <div class="quantity-row">
              <div>
                <label class="purchase-label" for="quantityValue">
                  Quantity
                </label>

                <div class="quantity-control">
                  <button
                    id="decreaseQuantity"
                    type="button"
                    aria-label="Decrease quantity"
                    ${!inStock ? "disabled" : ""}
                  >−</button>

                  <span id="quantityValue" class="quantity-value">1</span>

                  <button
                    id="increaseQuantity"
                    type="button"
                    aria-label="Increase quantity"
                    ${!inStock ? "disabled" : ""}
                  >+</button>
                </div>
              </div>
            </div>

            <div class="purchase-buttons">
              <button
                id="addCartButton"
                class="purchase-button add-cart-button"
                type="button"
                aria-label="Add to cart"
                title="Add to cart"
                ${!inStock ? "disabled" : ""}
              >
                <i class="ph ph-shopping-cart-simple" aria-hidden="true"></i>
                Add to Cart
              </button>

              <button
                id="buyNowButton"
                class="purchase-button buy-now-button"
                type="button"
                ${!inStock ? "disabled" : ""}
              >
                Buy Now
                <i class="ph ph-arrow-right" aria-hidden="true"></i>
              </button>

              <button
                id="wishlistButton"
                class="purchase-button wishlist-button"
                type="button"
                aria-label="Add to wishlist"
                aria-pressed="false"
                title="Add to wishlist"
              >
                <i class="ph ph-heart" aria-hidden="true"></i>
              </button>
            </div>

            <button
              id="shareButton"
              class="share-button"
              type="button"
            >
              <i class="ph ph-share-network" aria-hidden="true"></i>
              Share Product
            </button>

            <div class="service-grid">

              <div class="service-card">
                <i class="ph ph-truck"></i>
                <div>
                  <strong>Shipping Information</strong>
                  <span>
                    ${escapeHTML(product.shippingInformation || "See checkout for delivery details.")}
                  </span>
                </div>
              </div>

              <div class="service-card">
                <i class="ph ph-shield-check"></i>
                <div>
                  <strong>Warranty</strong>
                  <span>
                    ${escapeHTML(product.warrantyInformation || "Check product warranty details.")}
                  </span>
                </div>
              </div>

              <div class="service-card">
                <i class="ph ph-arrow-u-up-left"></i>
                <div>
                  <strong>Return Policy</strong>
                  <span>
                    ${escapeHTML(product.returnPolicy || "Check return eligibility at checkout.")}
                  </span>
                </div>
              </div>

              <div class="service-card">
                <i class="ph ph-lock-key"></i>
                <div>
                  <strong>Secure Shopping</strong>
                  <span>Keep your account details private.</span>
                </div>
              </div>

            </div>

          </div>
        </div>
      `;

      productArea.setAttribute("aria-busy", "false");

      bindGalleryEvents();
      bindProductActions();
      syncWishlistButton();
    }

    function bindGalleryEvents() {
      productArea.querySelectorAll("[data-image-index]").forEach(button => {
        button.addEventListener("click", () => {
          selectedImageIndex = Number(button.dataset.imageIndex);
          renderProduct();
        });
      });
    }

    /* QUANTITY AND BUTTONS */

    function bindProductActions() {
      const quantityValue = document.getElementById("quantityValue");
      const decreaseButton = document.getElementById("decreaseQuantity");
      const increaseButton = document.getElementById("increaseQuantity");
      const addCartButton = document.getElementById("addCartButton");
      const buyNowButton = document.getElementById("buyNowButton");
      const wishlistButton = document.getElementById("wishlistButton");
      const shareButton = document.getElementById("shareButton");

      const maxQuantity = Math.min(
        99,
        Math.max(1, Number(product.stock) || 1)
      );

      decreaseButton.addEventListener("click", () => {
        quantity = Math.max(1, quantity - 1);
        quantityValue.textContent = String(quantity);
        updateQuantityButtons();
      });

      increaseButton.addEventListener("click", () => {
        quantity = Math.min(maxQuantity, quantity + 1);
        quantityValue.textContent = String(quantity);
        updateQuantityButtons();
      });

      function updateQuantityButtons() {
        decreaseButton.disabled = quantity <= 1 || busy;
        increaseButton.disabled = quantity >= maxQuantity || busy;
      }

      addCartButton.addEventListener("click", async () => {
        await addProductToCart(false);
      });

      buyNowButton.addEventListener("click", async () => {
        await addProductToCart(true);
      });

      wishlistButton.addEventListener("click", () => {
        toggleWishlist();
      });

      shareButton.addEventListener("click", async () => {
        await shareProduct();
      });

      updateQuantityButtons();
    }

    /* CART API */

    async function addProductToCart(buyNow) {
      if (!product || busy) return;

      busy = true;

      const addButton = document.getElementById("addCartButton");
      const buyButton = document.getElementById("buyNowButton");

      if (!addButton || !buyButton) {
        busy = false;
        return;
      }

      addButton.disabled = true;
      buyButton.disabled = true;

      addButton.innerHTML =
        '<i class="ph ph-spinner" aria-hidden="true"></i>';

      addButton.setAttribute("aria-label", "Adding to cart");
      addButton.title = "Adding to cart";

      try {
        /*
          Keep the existing cart price convention:
          cart.html converts USD to INR for display.
        */

        const cartPrice =
          product.originalPriceUSD != null
            ? Number(product.originalPriceUSD) || 0
            : (Number(product.price) || 0) / USD_TO_INR;

        await fetchJSON("/api/cart", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            id: product.id,
            title: product.title,
            price: cartPrice,
            thumbnail: product.thumbnail,
            category: product.category,
            quantity
          })
        });

        /*
          Preserve the existing local cart cache.
          Wishlist data is not stored in localStorage.
        */

        try {
          const cached = JSON.parse(
            localStorage.getItem("shoppy_cart") || "[]"
          );

          const localCart = Array.isArray(cached) ? cached : [];

          const existing = localCart.find(
            item => String(item.id) === String(product.id)
          );

          if (existing) {
            existing.quantity =
              (Number(existing.quantity) || 1) + quantity;

            existing.price = cartPrice;
            existing.title = product.title;
            existing.thumbnail = product.thumbnail;
            existing.category = product.category;
          } else {
            localCart.push({
              id: product.id,
              title: product.title,
              price: cartPrice,
              thumbnail: product.thumbnail,
              category: product.category,
              quantity
            });
          }

          localStorage.setItem(
            "shoppy_cart",
            JSON.stringify(localCart)
          );
        } catch (error) {
          console.warn(
            "Local cart cache could not be updated:",
            error
          );
        }

        if (buyNow) {
          window.location.href = "/cart.html";
          return;
        }

        showToast("Product added to cart!");

        addButton.innerHTML =
          '<i class="ph ph-check" aria-hidden="true"></i>';

        addButton.setAttribute("aria-label", "Added to cart");
        addButton.title = "Added to cart";

      } catch (error) {
        console.error("Add to cart error:", error);

        if (error.status === 401) {
          const returnTo =
            window.location.pathname + window.location.search;

          window.location.href =
            "/login.html?returnTo=" + encodeURIComponent(returnTo);

          return;
        }

        showToast(
          error.message || "Unable to add product to cart."
        );

        addButton.innerHTML =
          '<i class="ph ph-shopping-cart-simple" aria-hidden="true"></i>';

        addButton.setAttribute("aria-label", "Add to cart");
        addButton.title = "Add to cart";

      } finally {
        busy = false;

        const currentAddButton =
          document.getElementById("addCartButton");

        const currentBuyButton =
          document.getElementById("buyNowButton");

        if (currentAddButton && currentBuyButton && product) {
          const unavailable = Number(product.stock) <= 0;

          currentAddButton.disabled = unavailable;
          currentBuyButton.disabled = unavailable;

          if (
            currentAddButton.getAttribute("aria-label") === "Adding to cart"
          ) {
            currentAddButton.innerHTML =
              '<i class="ph ph-shopping-cart-simple" aria-hidden="true"></i>';

            currentAddButton.setAttribute("aria-label", "Add to cart");
            currentAddButton.title = "Add to cart";
          }

          const decreaseButton =
            document.getElementById("decreaseQuantity");

          const increaseButton =
            document.getElementById("increaseQuantity");

          if (decreaseButton) {
            decreaseButton.disabled =
              quantity <= 1 || unavailable;
          }

          if (increaseButton) {
            const maxQuantity = Math.min(
              99,
              Math.max(1, Number(product.stock) || 1)
            );

            increaseButton.disabled =
              quantity >= maxQuantity || unavailable;
          }
        }
      }
    }

    /* FIREBASE WISHLIST */

    async function loadWishlistState() {
      try {
        const data = await fetchJSON("/api/wishlist");

        wishlistItems = Array.isArray(data.items)
          ? data.items
          : [];

        wishlistLoaded = true;

      } catch (error) {
        wishlistItems = [];
        wishlistLoaded = false;

        if (error.status !== 401) {
          console.warn(
            "Firebase wishlist could not be loaded:",
            error
          );
        }

      } finally {
        syncWishlistButton();
      }
    }

    function syncWishlistButton() {
      if (!product) return;

      const button = document.getElementById("wishlistButton");

      if (!button) return;

      const exists = wishlistItems.some(
        item => String(item.id) === String(product.id)
      );

      button.classList.toggle("active", exists);
      button.setAttribute("aria-pressed", String(exists));

      button.setAttribute(
        "aria-label",
        exists ? "Remove from wishlist" : "Add to wishlist"
      );

      button.title = exists ? "Remove from wishlist" : "Add to wishlist";

      button.innerHTML = exists
        ? '<i class="ph-fill ph-heart" aria-hidden="true"></i>'
        : '<i class="ph ph-heart" aria-hidden="true"></i>';

      button.disabled = wishlistBusy;
    }

    async function toggleWishlist() {
      if (!product || wishlistBusy) return;

      wishlistBusy = true;
      syncWishlistButton();

      const exists = wishlistItems.some(
        item => String(item.id) === String(product.id)
      );

      try {
        /*
          POST   = add product to Firebase wishlist
          DELETE = remove product from Firebase wishlist
        */

        const data = await fetchJSON("/api/wishlist", {
          method: exists ? "DELETE" : "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            id: product.id
          })
        });

        wishlistItems = Array.isArray(data.items)
          ? data.items
          : [];

        wishlistLoaded = true;

        syncWishlistButton();

        showToast(
          exists
            ? "Removed from wishlist"
            : "Added to wishlist"
        );

      } catch (error) {
        console.error("Firebase wishlist error:", error);

        if (error.status === 401) {
          const returnTo =
            window.location.pathname + window.location.search;

          window.location.href =
            "/login.html?returnTo=" + encodeURIComponent(returnTo);

          return;
        }

        showToast(
          error.message ||
          "Could not update wishlist. Please try again."
        );

      } finally {
        wishlistBusy = false;
        syncWishlistButton();
      }
    }

    /* SHARE */

    async function shareProduct() {
      if (!product) return;

      const shareData = {
        title: product.title,
        text: `${product.title} — ${product.description || "Check out this product"} on Shoppy!`,
        url: window.location.href
      };

      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(window.location.href);
          showToast("Product link copied!");
        } else {
          window.prompt(
            "Copy this product link:",
            window.location.href
          );
        }
      } catch (error) {
        if (error.name !== "AbortError") {
          showToast("Unable to share product.");
        }
      }
    }

    /* PRODUCT DETAILS */

    function loadDetails() {
      const dimensions = product.dimensions || {};

      const rows = [
        ["Brand", product.brand || "Generic"],
        ["Category", product.category || "—"],
        ["SKU", product.sku || "—"],
        [
          "Availability",
          product.availabilityStatus || "Check availability"
        ],
        [
          "Stock",
          `${Number(product.stock) || 0} units`
        ],
        [
          "Minimum Order",
          `${Number(product.minimumOrderQuantity) || 1} unit(s)`
        ],
        [
          "Weight",
          product.weight == null ? "—" : `${product.weight} g`
        ],
        [
          "Dimensions",
          dimensions.width != null
            ? `${dimensions.width} × ${dimensions.height} × ${dimensions.depth} cm`
            : "—"
        ],
        [
          "Warranty",
          product.warrantyInformation || "Not specified"
        ],
        [
          "Shipping",
          product.shippingInformation || "Not specified"
        ],
        [
          "Returns",
          product.returnPolicy || "Not specified"
        ],
        [
          "Tags",
          Array.isArray(product.tags) && product.tags.length
            ? product.tags.join(", ")
            : "—"
        ]
      ];

      detailsSection.innerHTML = `
        <h2 class="section-heading">Product Information</h2>

        <div class="details-grid">
          ${rows.map(([label, value]) => `
            <div class="detail-row">
              <span>${escapeHTML(label)}</span>
              <strong>${escapeHTML(value)}</strong>
            </div>
          `).join("")}
        </div>
      `;

      detailsSection.setAttribute("aria-busy", "false");
    }

    /* CUSTOMER REVIEWS */

    function loadReviews() {
      const reviews = Array.isArray(product.reviews)
        ? product.reviews
        : [];

      reviewsSection.innerHTML = `
        <div class="reviews-header">
          <h2 class="section-heading">Customer Reviews</h2>

          <span class="review-summary">
            ${reviews.length} review${reviews.length === 1 ? "" : "s"}
          </span>
        </div>

        ${
          reviews.length
            ? `
              <div class="reviews-grid">
                ${reviews.map(review => `
                  <article class="review-card">
                    <div class="review-top">
                      <div>
                        <div class="reviewer-name">
                          ${escapeHTML(review.reviewerName || "Customer")}
                        </div>

                        <div class="review-date">
                          ${
                            review.date
                              ? escapeHTML(
                                  new Date(review.date).toLocaleDateString(
                                    "en-IN",
                                    {
                                      day: "numeric",
                                      month: "short",
                                      year: "numeric"
                                    }
                                  )
                                )
                              : "Verified review data"
                          }
                        </div>
                      </div>

                      <div
                        class="review-stars"
                        aria-label="${Number(review.rating) || 0} out of 5 stars"
                      >
                        ${"★".repeat(Math.max(
                          0,
                          Math.min(
                            5,
                            Math.round(Number(review.rating) || 0)
                          )
                        ))}
                        ${"☆".repeat(5 - Math.max(
                          0,
                          Math.min(
                            5,
                            Math.round(Number(review.rating) || 0)
                          )
                        ))}
                      </div>
                    </div>

                    <p class="review-comment">
                      ${escapeHTML(review.comment || "No comment provided.")}
                    </p>
                  </article>
                `).join("")}
              </div>
            `
            : `
              <div class="empty-reviews">
                No customer reviews are available for this product yet.
              </div>
            `
        }
      `;

      reviewsSection.setAttribute("aria-busy", "false");
    }

    /* RELATED PRODUCTS */

    async function loadRelatedProducts() {
      try {
        const relatedParams = new URLSearchParams({
          category: product.category || ""
        });

        const data = await fetchJSON(
          `/api/products?${relatedParams.toString()}`
        );

        const products = (
          Array.isArray(data.products) ? data.products : []
        )
          .filter(
            item => String(item.id) !== String(product.id)
          )
          .slice(0, 4);

        relatedSection.innerHTML = `
          <h2 class="section-heading">You May Also Like</h2>

          ${
            products.length
              ? `
                <div class="related-grid">
                  ${products.map(item => `
                    <a
                      class="related-card"
                      href="/product.html?id=${encodeURIComponent(item.id)}"
                    >
                      <div class="related-image">
                        <img
                          src="${escapeHTML(
                            safeImage(item.thumbnail) ||
                            "https://placehold.co/300x300/f6f6f6/777?text=Product"
                          )}"
                          alt="${escapeHTML(item.title)}"
                          loading="lazy"
                        >
                      </div>

                      <div class="related-info">
                        <h3 class="related-title">
                          ${escapeHTML(item.title)}
                        </h3>

                        <div class="related-price">
                          ${formatPrice(getDiscountedPrice(item))}
                        </div>

                        <div class="related-rating">
                          <i class="ph-fill ph-star" style="color:#e09a00"></i>
                          ${(Number(item.rating) || 0).toFixed(1)}
                        </div>
                      </div>
                    </a>
                  `).join("")}
                </div>
              `
              : `
                <div class="empty-reviews">
                  No related products found.
                </div>
              `
          }
        `;

      } catch (error) {
        console.error("Related products error:", error);

        relatedSection.innerHTML = `
          <h2 class="section-heading">You May Also Like</h2>
          <div class="empty-reviews">
            Related products could not be loaded.
          </div>
        `;

      } finally {
        relatedSection.setAttribute("aria-busy", "false");
      }
    }

    /* INITIALIZE */

    loadProduct();
  </script>

</body>
</html>
