  <style>
    :root {
      /* Shoppy design tokens */
      --primary: #2962FF;
      --primary-hover: #0059D7;
      --primary-soft: #EDF2FF;
      --primary-selected: #F8FAFF;
      --background: #FFFFFF;
      --surface: #FFFFFF;
      --surface-secondary: #F5F5F2;
      --text-primary: #1E1F1C;
      --text-secondary: #666960;
      --text-muted: #969991;
      --border: #E5E7EB;
      --divider: #E5E7EB;
      --success: #15803D;
      --success-bg: #ECFDF3;
      --error: #DC2626;
      --disabled-bg: #E5E7EB;
      --disabled-text: #969991;
      --star: #E09A00;

      --font-body: "DM Sans", sans-serif;
      --font-heading: "Manrope", sans-serif;

      --radius-sm: 5px;
      --radius-md: 9px;
      --radius-lg: 12px;

      --header-h: 64px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      min-height: 100vh;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.7;
      color: var(--text-primary);
      background: var(--background);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    button:disabled {
      background: var(--disabled-bg);
      color: var(--disabled-text);
      border-color: var(--disabled-bg);
      cursor: not-allowed;
    }

    /* HEADER */

    .topbar {
      position: sticky;
      top: 0 !important;
      margin-top: 0 !important;
      transform: none;
      z-index: 100;
      width: 100%;
      height: var(--header-h);
      min-height: var(--header-h);
      padding: 0 max(2%, calc((100% - 1440px) / 2));
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--background);
      border-bottom: 1px solid var(--border);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: var(--radius-md);
      font-size: 24px;
      color: var(--text-primary);
      background: transparent;
    }

    .nav-icon:hover {
      background: var(--surface-secondary);
    }

    .brand {
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 800;
      line-height: 1.4;
      letter-spacing: -0.7px;
      color: var(--primary);
    }

    /* PAGE */

    .container {
      width: min(1440px, 96%);
      max-width: 1440px;
      margin: 34px auto 65px;
      background: transparent;
    }

    /* PRODUCT LAYOUT */

    .product-layout {
      display: grid;
      grid-template-columns: minmax(0, 0.35fr) minmax(0, 0.65fr);
      column-gap: 32px;
      row-gap: 0;
      align-items: start;
      width: 100%;
      min-width: 0;
    }

    .admin-discount-bar {
      margin: 14px 0 22px;
      padding: 10px 14px;
      border: 1px solid #D8E4FF;
      border-radius: var(--radius-md);
      background: #F5F8FF;
      color: #1747B8;
      font-size: 13px;
      font-weight: 600;
    }
    .admin-discount-bar[hidden] { display: none; }

    /* GALLERY */

    .gallery {
      min-width: 0;
      width: 100%;
      max-width: none;
      justify-self: stretch;
    }

    .main-image-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: none;
      border-radius: var(--radius-md);
      background: var(--surface-secondary);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 18px;
      display: block;
    }

    .wishlist-overlay {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 22px;
      line-height: 1;
      transition: background .2s, color .2s, transform .2s;
    }

    .wishlist-overlay:hover:not(:disabled) { transform: scale(1.04); }
    .wishlist-overlay.active {
      background: var(--primary);
      color: #fff;
    }
    .wishlist-overlay:disabled { opacity: .75; }

    .image-counter {
      position: absolute;
      right: 12px;
      bottom: 12px;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--surface);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .gallery-thumbnails {
      display: flex;
      gap: 12px;
      margin-top: 15px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .thumbnail-button {
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      padding: 6px;
      background: var(--surface-secondary);
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .thumbnail-button.active {
      border: 1px solid var(--primary);
      background: var(--primary-selected);
    }

    .thumbnail-button img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* PRODUCT INFO */

    .product-info {
      grid-column: 2;
      grid-row: 1 / span 2;
      min-width: 0;
      width: 100%;
      position: sticky;
      top: calc(var(--header-h) + 25px);
      align-self: start;
    }

    .product-category {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 8px;
    }

    .product-title {
      font-family: var(--font-heading);
      font-size: clamp(27px, 4vw, 36px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -1.2px;
      color: var(--text-primary);
      overflow-wrap: anywhere;
    }

    .product-brand {
      margin-top: 8px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .product-brand strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .rating-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      font-size: 13px;
    }

    .rating-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--surface-secondary);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      font-weight: 700;
    }

    .rating-badge i {
      color: var(--star);
      font-size: 14px;
    }

    .muted {
      color: var(--text-secondary);
    }

    .product-divider { display: none; }

    .price-block {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
    }

    .current-price {
      font-family: var(--font-heading);
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -.7px;
      color: var(--text-primary);
    }

    .original-price {
      font-size: 15px;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .discount-badge {
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      background: var(--success-bg);
      color: var(--success);
      font-size: 12px;
      font-weight: 700;
    }

    .tax-note {
      margin-top: 8px;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .stock-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      font-size: 13px;
      font-weight: 600;
      color: var(--success);
    }

    .stock-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }

    .stock-line.out-of-stock {
      color: var(--error);
    }

    .stock-line.out-of-stock .stock-dot {
      background: var(--error);
    }

    .product-description {
      margin-top: 18px;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    /* QUANTITY */

    .purchase-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .quantity-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .quantity-control {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--border);
      padding: 5px;
      border-radius: var(--radius-lg);
    }

    .quantity-control button {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: var(--radius-md);
      background: var(--surface-secondary);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .quantity-control button:hover:not(:disabled) {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .quantity-value {
      min-width: 24px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
    }

    /* BUTTONS (text only) */

    .purchase-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .purchase-button {
      min-height: 48px;
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 700;
      transition: background .2s, color .2s, border-color .2s;
    }

    .add-cart-button {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid var(--primary-soft);
    }

    .add-cart-button:hover:not(:disabled) {
      background: var(--primary-soft);
      border-color: var(--primary);
    }

    .buy-now-button {
      background: var(--primary);
      color: #fff;
      border: 1px solid var(--primary);
    }

    .buy-now-button:hover:not(:disabled) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .wishlist-button {
      grid-column: 1 / -1;
      background: var(--surface);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .wishlist-button:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
    }

    .wishlist-button.active {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--primary-selected);
    }

    .share-button {
      display: inline-flex;
      align-items: center;
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      margin-top: 16px;
      padding: 0;
    }

    .share-button:hover {
      color: var(--primary);
    }

    /* SHIPPING & POLICIES: starts immediately below the gallery */

    .service-grid {
      grid-column: 1;
      grid-row: 2;
      width: 100%;
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-content: start;
      padding-top: 0;
    }

    .service-grid .section-heading {
      grid-column: 1 / -1;
      margin: 0 0 2px;
      font-size: 19px;
      letter-spacing: -.4px;
    }

    .service-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 7px;
      padding: 13px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      min-width: 0;
      min-height: 94px;
    }

    .service-card > i {
      font-size: 23px;
      flex-shrink: 0;
      color: var(--primary);
      line-height: 1;
    }

    .service-card strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
    }

    .service-card span { display: none; }

    /* SECTIONS */

    .details-section {
      margin-top: 27px;
      padding-top: 0;
      border-top: 0;
    }

    .section-heading {
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.7px;
      margin-bottom: 18px;
    }

    /* PRODUCT INFORMATION TABLE */

    .details-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      overflow: hidden;
    }

    .detail-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      min-width: 0;
      padding: 15px 18px;
      border-bottom: 1px solid var(--divider);
      font-size: 14px;
      line-height: 1.4;
    }

    /* Vertical divider separates the two desktop columns. */
    .detail-row:nth-child(odd) {
      border-right: 1px solid var(--divider);
      padding-right: 20px;
    }

    .detail-row:nth-child(even) {
      padding-left: 20px;
    }

    .detail-row:nth-last-child(-n + 2) { border-bottom: 0; }

    .detail-label {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
    }

    .detail-label > span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-label i {
      width: 20px;
      flex: 0 0 20px;
      color: var(--primary);
      font-size: 19px;
    }

    .detail-row strong {
      display: block;
      min-width: 0;
      color: var(--text-primary);
      font-weight: 600;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* REVIEWS (divider list) */

    .reviews-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 18px;
    }

    .reviews-header .section-heading {
      margin: 0;
    }

    .review-summary {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .reviews-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 58px;
    }

    .review-card {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      min-width: 0;
    }

    .review-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .reviewer-name {
      font-size: 14px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .review-date {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .review-stars {
      color: var(--star);
      font-size: 13px;
      white-space: nowrap;
    }

    .review-comment {
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-secondary);
      overflow-wrap: anywhere;
    }

    .empty-reviews {
      padding: 24px 0;
      color: var(--text-secondary);
      font-size: 14px;
      text-align: center;
    }

    /* RELATED PRODUCTS */

    .related-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .related-card {
      min-width: 0;
      display: block;
    }

    .related-image {
      aspect-ratio: 1 / 1;
      padding: 15px;
      background: var(--surface-secondary);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .related-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .related-info {
      padding: 12px 0 0;
    }

    .related-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
      height: 42px;
      overflow: hidden;
    }

    .related-card:hover .related-title {
      color: var(--primary);
    }

    .related-price {
      margin-top: 8px;
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 800;
    }

    .related-rating {
      margin-top: 2px;
      color: var(--text-secondary);
      font-size: 12px;
    }

    /* EXPLORE MORE: match the Home page product cards */
    .related-grid.product-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: stretch;
      gap: 24px 18px;
    }
    .related-card.product-card {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: transparent;
      cursor: pointer;
    }
    .related-card .product-image {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-md);
      background: var(--surface-secondary);
      transition: background .2s;
    }
    .related-card:hover .product-image { background: var(--primary-selected); }
    .related-card .product-image img { display:block; width:100%; height:100%; object-fit:contain; }
    .related-card .product-info { min-width:0; flex:1; display:flex; flex-direction:column; padding:12px 0 0; position:static; }
    .related-card .product-category { color:var(--text-muted); font-size:12px; font-weight:600; text-transform:capitalize; margin:0; letter-spacing:0; }
    .related-card .product-title { min-height:42px; margin:2px 0 0; color:var(--text-primary); font-family:var(--font-heading); font-size:14px; font-weight:700; line-height:1.5; letter-spacing:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .related-card:hover .product-title { color:var(--primary); }
    .related-card .product-description { min-height:42px; margin:4px 0 0; color:var(--text-secondary); font-size:13px; line-height:1.6; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .related-card .product-rating { display:flex; align-items:center; gap:5px; margin-top:8px; color:var(--text-secondary); font-size:13px; }
    .related-card .product-rating i { color:var(--star); font-size:14px; }
    .related-card .product-bottom { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:auto; padding-top:12px; }
    .related-card .product-price { min-width:0; color:var(--text-primary); font-family:var(--font-heading); font-size:16px; font-weight:800; letter-spacing:-.35px; overflow-wrap:anywhere; }
    .related-card .product-original-price { margin-right:5px; color:var(--text-muted); font-size:12px; font-weight:500; text-decoration:line-through; }
    .related-card .discount { align-self:flex-start; padding:2px 8px; border-radius:var(--radius-sm); background:var(--success-bg); color:var(--success); font-size:12px; font-weight:700; }
    .related-card .product-image { flex-direction:column; }
    .related-card .product-image img { flex:1; min-height:0; }

    /* SKELETON */

    .skeleton {
      position: relative;
      overflow: hidden;
      background: var(--surface-secondary);
      border-radius: var(--radius-sm);
    }

    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.8), transparent);
      animation: shimmer 1.35s infinite;
    }

    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }

    .skeleton-main-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-md);
    }

    .skeleton-thumb-row {
      display: flex;
      gap: 12px;
      margin-top: 15px;
    }

    .skeleton-thumb {
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      border-radius: var(--radius-md);
    }

    .skeleton-line { height: 13px; margin-bottom: 14px; }
    .skeleton-line.small { width: 35%; }
    .skeleton-line.medium { width: 60%; }
    .skeleton-line.large { width: 90%; height: 24px; }
    .skeleton-line.price { width: 48%; height: 30px; margin-top: 24px; }
    .skeleton-description { height: 80px; margin-top: 18px; }
    .skeleton-buttons { height: 48px; margin-top: 18px; border-radius: var(--radius-lg); }

    .skeleton-related {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .skeleton-product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      margin-bottom: 12px;
      border-radius: var(--radius-md);
    }

    .skeleton-product-title { width: 85%; height: 12px; margin-bottom: 10px; }
    .skeleton-product-price { width: 50%; height: 15px; }

    /* STATUS AND TOAST */

    .status {
      padding: 50px 0;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.7;
    }

    .status > i {
      font-size: 45px;
      display: block;
      margin-bottom: 15px;
      color: var(--text-muted);
    }

    .status h2 {
      font-family: var(--font-heading);
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .status button,
    .status a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
      padding: 12px 24px;
      border: 0;
      border-radius: var(--radius-lg);
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    .status button:hover,
    .status a:hover {
      background: var(--primary-hover);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translate(-50%, 15px);
      padding: 12px 18px;
      border-radius: var(--radius-lg);
      background: var(--text-primary);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      z-index: 100;
      text-align: center;
      max-width: calc(100% - 30px);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* FOOTER */

    .footer {
      border-top: 1px solid var(--divider);
      padding: 24px 5%;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      color: var(--text-muted);
      font-size: 12px;
    }

    /* RESPONSIVE */

    .desktop-recommendations { display: block; }

    @media (max-width: 760px) {
      .topbar { padding-left: 3%; padding-right: 3%; }
      .container {
        width: 90%;
        max-width: none;
        margin-top: 25px;
      }

      .product-layout {
        grid-template-columns: minmax(0, 1fr);
        column-gap: 0;
        row-gap: 20px;
      }

      .gallery { grid-column: 1; grid-row: 1; }
      .product-info { position: static; grid-column: 1; grid-row: 2; }
      .service-grid {
        grid-column: 1;
        grid-row: 3;
        max-width: none;
        margin-top: 12px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .product-title {
        font-size: 29px;
      }

      .gallery { max-width: none; }
      .main-image-wrap { aspect-ratio: 1 / 1; max-height: none; }
      .main-image {
        padding: 22px;
      }

      .details-section {
        margin-top: 24px;
        padding-top: 24px;
      }

      .details-grid { grid-template-columns: minmax(0, 1fr); }
      .reviews-grid {
        grid-template-columns: minmax(0, 1fr);
        column-gap: 0;
        row-gap: 12px;
      }
      .detail-row,
      .detail-row:nth-child(odd),
      .detail-row:nth-child(even) {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 10px;
        padding: 13px 12px;
        border-right: 0;
        border-bottom: 1px solid var(--divider);
      }
      .detail-row:last-child { border-bottom: 0; }

      .related-grid,
      .related-grid.product-grid,
      .skeleton-related {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px 12px;
      }

      .section-heading {
        font-size: 21px;
      }
    }

    @media (max-width: 380px) {
      .purchase-buttons {
        grid-template-columns: 1fr;
      }

      .detail-row,
      .detail-row:nth-child(odd),
      .detail-row:nth-child(even) {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 7px;
        padding-left: 10px;
        padding-right: 10px;
      }
      .detail-label { gap: 5px; }
      .detail-label i { width: 17px; flex-basis: 17px; font-size: 17px; }
      .detail-row { font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .skeleton::after { animation: none; }
      .toast, .purchase-button { transition: none; }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="topbar">

          <div class="skeleton skeleton-line price"></div>
          <div class="skeleton skeleton-line medium"></div>

        <div class="detail-row">
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line"></div>
        </div>
        <div class="detail-row">
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line"></div>
        </div>
        <div class="detail-row">
          <div class="skeleton skeleton-line"></div>

        </div>

    <!-- REVIEWS -->

    <section class="details-section" id="reviewsSection" aria-busy="true">
      <div class="reviews-header">
        <h2 class="section-heading">Customer Reviews</h2>
        <span class="skeleton skeleton-line" style="width:80px"></span>
      </div>

      <div class="reviews-grid">
        <div class="skeleton" style="height:110px"></div>
        <div class="skeleton" style="height:110px"></div>

    <!-- DESKTOP ONLY: CATEGORY-BASED RECOMMENDATIONS -->

    <section class="details-section desktop-recommendations" id="youMayAlsoLikeSection" aria-busy="true">
      <h2 class="section-heading">You May Also Like</h2>
      <div class="related-grid product-grid" id="youMayAlsoLikeGrid" aria-live="polite"></div>

    <!-- EXPLORE MORE PRODUCTS -->

    <section class="details-section" id="relatedSection" aria-busy="true">
      <h2 class="section-heading">Explore More</h2>
      <p style="color:var(--text-secondary);margin:-8px 0 22px;">You may also like these products.</p>
      <div class="related-grid product-grid" id="relatedProductGrid" aria-live="polite">
        <div class="skeleton-related">
          <div><div class="skeleton skeleton-product-image"></div><div class="skeleton skeleton-product-title"></div><div class="skeleton skeleton-product-price"></div></div>
          <div><div class="skeleton skeleton-product-image"></div><div class="skeleton skeleton-product-title"></div><div class="skeleton skeleton-product-price"></div></div>
          <div><div class="skeleton skeleton-product-image"></div><div class="skeleton skeleton-product-title"></div><div class="skeleton skeleton-product-price"></div></div>
          <div><div class="skeleton skeleton-product-image"></div><div class="skeleton skeleton-product-title"></div><div class="skeleton skeleton-product-price"></div></div>

  </main>

  <footer class="footer">
    <span>© <span id="year"></span> Shoppy</span>
    <span>Your shopping, all in one place.</span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    /*
      Product API returns price in INR.
      originalPriceUSD is retained for the existing cart API,
      because cart.html converts USD to INR for display.
    */

    const USD_TO_INR = 85;
    const PRODUCT_ID_PATTERN = /^[A-Za-z0-9]{40}$/;
    const SITE_URL = "https://shopingweb-zeta.vercel.app";
    const DEFAULT_IMAGE =
      "https://i.ibb.co/93kQCKxT/20261019-120246.png";

    const productArea = document.getElementById("productArea");
    const detailsSection = document.getElementById("detailsSection");
    const reviewsSection = document.getElementById("reviewsSection");
    const relatedSection = document.getElementById("relatedSection");
    const toast = document.getElementById("toast");

    const params = new URLSearchParams(window.location.search);
    const productId = String(params.get("id") || "").trim();

    let product = null;
    let selectedImageIndex = 0;
    let quantity = 1;
    let busy = false;
    let toastTimer = null;

    /* FIREBASE WISHLIST STATE */

    let wishlistItems = [];
    let wishlistLoaded = false;
    let wishlistBusy = false;
    let adminDiscountPercent = 0;

    document.getElementById("year").textContent =
      new Date().getFullYear();

    /* HELPERS */

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function formatPrice(price) {
      /*
        Product API prices are already INR.
        Do not multiply them by USD_TO_INR again.
      */
      const inrPrice = Number(price) || 0;

      return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(inrPrice);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2400);
    }

    function getDiscountPercent(item) {
      const productDiscount = Math.max(0, Math.min(100, Number(item && item.discountPercentage) || 0));
      return adminDiscountPercent > 0 ? adminDiscountPercent : productDiscount;
    }

    function getDiscountedPrice(item) {
      const price = Math.max(0, Number(item && item.price) || 0);
      return price * (1 - getDiscountPercent(item) / 100);
    }

    function safeImage(url) {
      try {
        const parsed = new URL(url, window.location.origin);

        if (
          parsed.protocol !== "https:" &&
          parsed.origin !== window.location.origin
        ) {
          return "";
        }

        return parsed.href;
      } catch {
        return "";
      }
    }

    function updateMeta(selector, content) {
      const element = document.querySelector(selector);

      if (element) {
        element.setAttribute("content", String(content || ""));
      }
    }

    function updateProductMetadata(item) {
      const title = `${item.title} — Shoppy`;
      const priceText = formatPrice(Number(item.price) || 0);
      const descriptionParts = [
        item.description || `Explore ${item.title} on Shoppy.`,
        `Category: ${item.category || "Products"}.`,
        `Price: ${priceText}.`,
        item.brand ? `Brand: ${item.brand}.` : ""
      ].filter(Boolean);
      const description = descriptionParts.join(" ").slice(0, 300);

      const image = safeImage(item.thumbnail) ||
        safeImage(Array.isArray(item.images) ? item.images[0] : "") ||
        DEFAULT_IMAGE;
      const canonical =
        `${SITE_URL}/product.html?id=${encodeURIComponent(item.id)}`;
      const pageUrl = window.location.href;

      document.title = title;

      updateMeta('meta[name="description"]', description);
      updateMeta("#ogTitle", title);
      updateMeta("#ogDescription", description);
      updateMeta("#ogUrl", pageUrl);
      updateMeta("#ogImage", image);
      updateMeta("#ogImageAlt", item.title);
      updateMeta('meta[property="og:image:width"]', "1200");
      updateMeta('meta[property="og:image:height"]', "630");
      updateMeta("#twitterTitle", title);
      updateMeta("#twitterDescription", description);
      updateMeta("#twitterImage", image);

      const canonicalElement = document.getElementById("canonicalUrl");

      if (canonicalElement) {
        canonicalElement.href = canonical;
      }
    }

    /* API */

    async function fetchJSON(url, options = {}) {
      const response = await fetch(url, {
        credentials: "same-origin",
        cache: "no-store",
        ...options,
        headers: {
          Accept: "application/json",
          ...(options.headers || {})
        }
      });

      const text = await response.text();
      let data;

      try {
        data = JSON.parse(text);
      } catch {
        throw new Error("Server returned an invalid response.");
      }

      if (!response.ok || data.success !== true) {
        const error = new Error(
          data.message || "Request failed."
        );

        error.status = response.status;
        throw error;
      }

      return data;
    }

    /* ADMIN-MANAGED OFFERS: show once in the top bar, never on every product card. */
    async function loadAdminDiscountBar() {
      const bar = document.getElementById("adminDiscountBar");
      if (!bar) return;
      try {
        let email = "";
        try {
          const cached = JSON.parse(localStorage.getItem("shoppy_profile_cache_v1") || "null");
          if (cached && cached.user && cached.user.email && Number(cached.expiresAt) > Date.now()) {
            email = String(cached.user.email).trim().toLowerCase();
          }
        } catch (_) {}
        if (!email) {
          try {
            const profileResponse = await fetch("/api/profile", { credentials: "same-origin", headers: { Accept: "application/json" }, cache: "no-store" });
            const profileData = await profileResponse.json().catch(() => ({}));
            if (profileResponse.ok && profileData.success && profileData.user && profileData.user.email) {
              email = String(profileData.user.email).trim().toLowerCase();
            }
          } catch (_) {}
        }
        const endpoint = "https://apisequizeshoplite.vercel.app/api/admin/discounts" + (email ? "?email=" + encodeURIComponent(email) : "");
        const response = await fetch(endpoint, { headers: { Accept: "application/json" }, cache: "no-store" });
        const data = await response.json().catch(() => ({}));
        const offers = response.ok && data.success && Array.isArray(data.discounts)
          ? data.discounts.map(x => Number(x && x.percent)).filter(x => Number.isFinite(x) && x > 0 && x <= 100)
          : [];
        const unique = [...new Set(offers)].sort((a, b) => b - a);
        if (!unique.length) { bar.hidden = true; bar.textContent = ""; return; }
        adminDiscountPercent = unique[0];
        bar.textContent = `Offer available: ${unique.map(x => `${Number(x.toFixed(2)).toString()}%`).join(" · ")}`;
        bar.hidden = false;
        if (product) {
          renderProduct();
          loadDetails();
          loadRelatedProducts();
        }
      } catch (error) {
        bar.hidden = true;
        console.warn("Admin discounts unavailable:", error);
      }
    }

    /* LOAD PRODUCT */

    async function loadProduct() {
      if (!PRODUCT_ID_PATTERN.test(productId)) {
        showProductError(
          "Invalid product link. Please open a valid product."
        );
        return;
      }

      try {
        const data = await fetchJSON(
          `/api/product?id=${encodeURIComponent(productId)}`
        );

        if (
          !data.product ||
          String(data.product.id) !== productId
        ) {
          throw new Error("Product not found.");
        }

        product = data.product;

        // Normalize optional API fields.
        product.title = String(product.title || "Product");
        product.description = String(product.description || "");
        product.category = String(product.category || "Products");
        product.brand = String(product.brand || "");
        product.thumbnail = String(product.thumbnail || "");
        product.availabilityStatus = String(
          product.availabilityStatus || ""
        );

        product.images = Array.isArray(product.images)
          ? product.images
          : [];

        product.reviews = Array.isArray(product.reviews)
          ? product.reviews
          : [];

        product.tags = Array.isArray(product.tags)
          ? product.tags
          : [];

        updateProductMetadata(product);

        renderProduct();

        // Wishlist is loaded from Firebase, not localStorage.
        loadWishlistState();

        loadDetails();
        loadReviews();
        loadRelatedProducts();

      } catch (error) {
        console.error("Product loading error:", error);

        showProductError(
          error.message || "Unable to load this product."
        );
      }
    }

    function showProductError(message) {
      productArea.setAttribute("aria-busy", "false");

      productArea.innerHTML = `
        <div class="status">
          <i class="ph ph-warning-circle"></i>
          <h2>Unable to load product</h2>
          <p>${escapeHTML(message)}</p>
          <button type="button" onclick="window.location.reload()">
            Try Again
          </button>
          <br>
          <a href="/home.html">Back to Shopping</a>
        </div>
      `;

      detailsSection.hidden = true;
      reviewsSection.hidden = true;
      relatedSection.hidden = true;
    }

    /* PRODUCT GALLERY */

    function getProductImages(item) {
      const allImages = [
        item.thumbnail,
        ...(Array.isArray(item.images) ? item.images : [])
      ]
        .filter(Boolean)
        .map(safeImage)
        .filter(Boolean);

      return [...new Set(allImages)];
    }

    function renderGallery() {
      const images = getProductImages(product);

      selectedImageIndex = Math.min(
        selectedImageIndex,
        Math.max(0, images.length - 1)
      );

      const currentImage = images[selectedImageIndex] || "";

      return `
        <div class="gallery">
          <div class="main-image-wrap">
            ${
              currentImage
                ? `
                  <img
                    id="mainProductImage"
                    class="main-image"
                    src="${escapeHTML(currentImage)}"
                    alt="${escapeHTML(product.title)}"
                    onerror="this.onerror=null;this.src='https://placehold.co/600x600/f5f5f2/969991?text=Product';"
                  >
                `
                : `
                  <img
                    class="main-image"
                    src="https://placehold.co/600x600/f5f5f2/969991?text=Product"
                    alt="${escapeHTML(product.title)}"
                  >
                `
            }

            <button
              id="wishlistButton"
              class="wishlist-overlay"
              type="button"
              aria-label="Add to wishlist"
              aria-pressed="false"
              title="Add to wishlist"
            ><i class="ph ph-heart" aria-hidden="true"></i></button>

            <span class="image-counter">
              ${images.length ? selectedImageIndex + 1 : 1}
              /
              ${Math.max(1, images.length)}
            </span>
          </div>

          <div class="gallery-thumbnails">
            ${
              images.map((image, index) => `
                <button
                  type="button"
                  class="thumbnail-button ${index === selectedImageIndex ? "active" : ""}"
                  data-image-index="${index}"
                  aria-label="View product image ${index + 1}"
                  aria-pressed="${index === selectedImageIndex}"
                >
                  <img
                    src="${escapeHTML(image)}"
                    alt=""
                    loading="lazy"
                  >
                </button>
              `).join("")
            }
          </div>


        </div>
      `;
    }

    function renderShippingPolicies() {
      return `
        <section class="service-grid" aria-labelledby="shippingPoliciesHeading">
            <h2 class="section-heading" id="shippingPoliciesHeading">Shipping &amp; Policies</h2>

            <div class="service-card">
              <i class="ph-fill ph-truck"></i>
              <div>
                <strong>Shipping Information</strong>
              </div>
            </div>

            <div class="service-card">
              <i class="ph-fill ph-shield-check"></i>
              <div>
                <strong>Warranty</strong>
              </div>
            </div>

            <div class="service-card">
              <i class="ph-fill ph-arrow-u-up-left"></i>
              <div>
                <strong>Return Policy</strong>
              </div>
            </div>

            <div class="service-card">
              <i class="ph-fill ph-lock-key"></i>
              <div>
                <strong>Secure Shopping</strong>
              </div>
            </div>
        </section>
      `;
    }

    function renderProduct() {
      const listedPrice = Math.max(0, Number(product.price) || 0);
      const discountPercent = getDiscountPercent(product);
      const displayedPrice = getDiscountedPrice(product);

      const inStock =
        Number(product.stock) > 0 &&
        product.availabilityStatus.toLowerCase() !== "out of stock";

      productArea.innerHTML = `
        <div class="product-layout">

          ${renderGallery()}

          <div class="product-info">

            <div class="product-category">
              ${escapeHTML(product.category || "Product")}
            </div>

            <h1 class="product-title">
              ${escapeHTML(product.title)}
            </h1>

            <div class="price-block">
              <span class="current-price">
                ${formatPrice(displayedPrice)}
              </span>
              ${discountPercent > 0 ? `
                <span class="original-price">${formatPrice(listedPrice)}</span>
                <span class="discount-badge">${Number(discountPercent.toFixed(2)).toString()}% OFF</span>
              ` : ""}
            </div>

            <div class="rating-row">
              <span class="rating-badge">
                <i class="ph-fill ph-star"></i>
                ${(Number(product.rating) || 0).toFixed(1)}
              </span>
              <span class="muted">${product.reviews.length} customer reviews</span>
            </div>

            <p class="product-brand">
              Brand: <strong>${escapeHTML(product.brand || "Generic")}</strong>
            </p>

            <p class="tax-note">
              Price displayed in INR. Final payable amount should be verified at checkout.
            </p>

            <div class="stock-line ${inStock ? "" : "out-of-stock"}">
              <span class="stock-dot"></span>

              ${
                inStock
                  ? `${Number(product.stock)} units available`
                  : "Currently unavailable"
              }
            </div>

            <p class="product-description">
              ${escapeHTML(product.description || "No description available.")}
            </p>

            <div class="quantity-row">
              <div>
                <label class="purchase-label" for="quantityValue">
                  Quantity
                </label>

                <div class="quantity-control">
                  <button
                    id="decreaseQuantity"
                    type="button"
                    aria-label="Decrease quantity"
                    ${!inStock ? "disabled" : ""}
                  >−</button>

                  <span id="quantityValue" class="quantity-value">1</span>

                  <button
                    id="increaseQuantity"
                    type="button"
                    aria-label="Increase quantity"
                    ${!inStock ? "disabled" : ""}
                  >+</button>
                </div>
              </div>
            </div>

            <div class="purchase-buttons">
              <button
                id="addCartButton"
                class="purchase-button add-cart-button"
                type="button"
                ${!inStock ? "disabled" : ""}
              >Add to Cart</button>

              <button
                id="buyNowButton"
                class="purchase-button buy-now-button"
                type="button"
                ${!inStock ? "disabled" : ""}
              >Buy Now</button>

            </div>

            <button
              id="shareButton"
              class="share-button"
              type="button"
            >Share Product</button>

          </div>

          ${renderShippingPolicies()}
        </div>
      `;

      productArea.setAttribute("aria-busy", "false");

      bindGalleryEvents();
      bindProductActions();
      syncWishlistButton();
    }

    function bindGalleryEvents() {
      productArea.querySelectorAll("[data-image-index]").forEach(button => {
        button.addEventListener("click", () => {
          selectedImageIndex = Number(button.dataset.imageIndex);
          renderProduct();
        });
      });
    }

    /* QUANTITY AND BUTTONS */

    function bindProductActions() {
      const quantityValue = document.getElementById("quantityValue");
      const decreaseButton = document.getElementById("decreaseQuantity");
      const increaseButton = document.getElementById("increaseQuantity");
      const addCartButton = document.getElementById("addCartButton");
      const buyNowButton = document.getElementById("buyNowButton");
      const wishlistButton = document.getElementById("wishlistButton");
      const shareButton = document.getElementById("shareButton");

      const maxQuantity = Math.min(
        99,
        Math.max(1, Number(product.stock) || 1)
      );

      decreaseButton.addEventListener("click", () => {
        quantity = Math.max(1, quantity - 1);
        quantityValue.textContent = String(quantity);
        updateQuantityButtons();
      });

      increaseButton.addEventListener("click", () => {
        quantity = Math.min(maxQuantity, quantity + 1);
        quantityValue.textContent = String(quantity);
        updateQuantityButtons();
      });

      function updateQuantityButtons() {
        decreaseButton.disabled = quantity <= 1 || busy;
        increaseButton.disabled = quantity >= maxQuantity || busy;
      }

      addCartButton.addEventListener("click", async () => {
        await addProductToCart(false);
      });

      buyNowButton.addEventListener("click", async () => {
        await addProductToCart(true);
      });

      wishlistButton.addEventListener("click", () => {
        toggleWishlist();
      });

      shareButton.addEventListener("click", async () => {
        await shareProduct();
      });

      updateQuantityButtons();
    }

    /* CART API */

    async function addProductToCart(buyNow) {
      if (!product || busy) return;

      busy = true;

      const addButton = document.getElementById("addCartButton");
      const buyButton = document.getElementById("buyNowButton");

      if (!addButton || !buyButton) {
        busy = false;
        return;
      }

      addButton.disabled = true;
      buyButton.disabled = true;

      addButton.textContent = "Adding...";

      try {
        /*
          Keep the existing cart price convention:
          cart.html converts USD to INR for display.
        */

        const cartPrice =
          product.originalPriceUSD != null
            ? Number(product.originalPriceUSD) || 0
            : (Number(product.price) || 0) / USD_TO_INR;

        await fetchJSON("/api/cart", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            id: product.id,
            title: product.title,
            price: cartPrice,
            thumbnail: product.thumbnail,
            category: product.category,
            quantity
          })
        });

        /*
          Preserve the existing local cart cache.
          Wishlist data is not stored in localStorage.
        */

        try {
          const cached = JSON.parse(
            localStorage.getItem("shoppy_cart") || "[]"
          );

          const localCart = Array.isArray(cached) ? cached : [];

          const existing = localCart.find(
            item => String(item.id) === String(product.id)
          );

          if (existing) {
            existing.quantity =
              (Number(existing.quantity) || 1) + quantity;

            existing.price = cartPrice;
            existing.title = product.title;
            existing.thumbnail = product.thumbnail;
            existing.category = product.category;
          } else {
            localCart.push({
              id: product.id,
              title: product.title,
              price: cartPrice,
              thumbnail: product.thumbnail,
              category: product.category,
              quantity
            });
          }

          localStorage.setItem(
            "shoppy_cart",
            JSON.stringify(localCart)
          );
        } catch (error) {
          console.warn(
            "Local cart cache could not be updated:",
            error
          );
        }

        if (buyNow) {
          window.location.href = "/cart.html";
          return;
        }

        showToast("Product added to cart!");

        addButton.textContent = "Added to Cart";

      } catch (error) {
        console.error("Add to cart error:", error);

        if (error.status === 401) {
          const returnTo =
            window.location.pathname + window.location.search;

          window.location.href =
            "/login.html?returnTo=" + encodeURIComponent(returnTo);

          return;
        }

        showToast(
          error.message || "Unable to add product to cart."
        );

        addButton.textContent = "Add to Cart";

      } finally {
        busy = false;

        const currentAddButton =
          document.getElementById("addCartButton");

        const currentBuyButton =
          document.getElementById("buyNowButton");

        if (currentAddButton && currentBuyButton && product) {
          const unavailable = Number(product.stock) <= 0;

          currentAddButton.disabled = unavailable;
          currentBuyButton.disabled = unavailable;

          if (currentAddButton.textContent.includes("Adding")) {
            currentAddButton.textContent = "Add to Cart";
          }

          const decreaseButton =
            document.getElementById("decreaseQuantity");

          const increaseButton =
            document.getElementById("increaseQuantity");

          if (decreaseButton) {
            decreaseButton.disabled =
              quantity <= 1 || unavailable;
          }

          if (increaseButton) {
            const maxQuantity = Math.min(
              99,
              Math.max(1, Number(product.stock) || 1)
            );

            increaseButton.disabled =
              quantity >= maxQuantity || unavailable;
          }
        }
      }
    }

    /* FIREBASE WISHLIST */

    async function loadWishlistState() {
      try {
        const data = await fetchJSON("/api/wishlist");

        wishlistItems = Array.isArray(data.items)
          ? data.items
          : [];

        wishlistLoaded = true;

      } catch (error) {
        /*
          A logged-out visitor can still view the product page.
          The wishlist button will ask them to log in when clicked.
        */

        wishlistItems = [];
        wishlistLoaded = false;

        if (error.status !== 401) {
          console.warn(
            "Firebase wishlist could not be loaded:",
            error
          );
        }

      } finally {
        syncWishlistButton();
      }
    }

    function syncWishlistButton() {
      if (!product) return;

      const button = document.getElementById("wishlistButton");

      if (!button) return;

      const exists = wishlistItems.some(
        item => String(item.id) === String(product.id)
      );

      button.classList.toggle("active", exists);
      button.setAttribute("aria-pressed", String(exists));

      const label = exists ? "Remove from wishlist" : "Add to wishlist";
      button.setAttribute("aria-label", label);
      button.setAttribute("title", label);
      button.innerHTML = `<i class="${exists ? "ph-fill" : "ph"} ph-heart" aria-hidden="true"></i>`;
      button.disabled = wishlistBusy;
    }

    async function toggleWishlist() {
      if (!product || wishlistBusy) return;

      wishlistBusy = true;
      syncWishlistButton();

      const exists = wishlistItems.some(
        item => String(item.id) === String(product.id)
      );

      try {
        /*
          POST   = add product to Firebase wishlist
          DELETE = remove product from Firebase wishlist
        */

        const data = await fetchJSON("/api/wishlist", {
          method: exists ? "DELETE" : "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            id: product.id
          })
        });

        wishlistItems = Array.isArray(data.items)
          ? data.items
          : [];

        wishlistLoaded = true;

        syncWishlistButton();

        showToast(
          exists
            ? "Removed from wishlist"
            : "Added to wishlist"
        );

      } catch (error) {
        console.error("Firebase wishlist error:", error);

        if (error.status === 401) {
          const returnTo =
            window.location.pathname + window.location.search;

          window.location.href =
            "/login.html?returnTo=" + encodeURIComponent(returnTo);

          return;
        }

        showToast(
          error.message ||
          "Could not update wishlist. Please try again."
        );

      } finally {
        wishlistBusy = false;
        syncWishlistButton();
      }
    }

    /* SHARE */

    async function shareProduct() {
      if (!product) return;

      const shareData = {
        title: product.title,
        text: `${product.title} — ${product.description || "Check out this product"} on Shoppy!`,
        url: window.location.href
      };

      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(window.location.href);
          showToast("Product link copied!");
        } else {
          window.prompt(
            "Copy this product link:",
            window.location.href
          );
        }
      } catch (error) {
        if (error.name !== "AbortError") {
          showToast("Unable to share product.");
        }
      }
    }

    /* PRODUCT DETAILS */

    function loadDetails() {
      const dimensions = product.dimensions || {};
      const rows = [];
      const addRow = (label, value, icon) => {
        if (value === undefined || value === null || String(value).trim() === "" || String(value) === "—") return;
        if (Array.isArray(value)) value = value.join(", ");
        if (typeof value === "object") value = Object.entries(value).map(([k, v]) => `${humanizeKey(k)}: ${typeof v === "object" ? JSON.stringify(v) : v}`).join(" · ");
        rows.push({ label, value: String(value), icon });
      };

      addRow("Brand", product.brand || "Generic", "ph-tag");
      addRow("Category", product.category, "ph-squares-four");
      addRow("SKU", product.sku, "ph-barcode");
      addRow("Availability", product.availabilityStatus, "ph-check-circle");
      addRow("Stock", Number.isFinite(Number(product.stock)) ? `${Number(product.stock)} units` : null, "ph-package");
      addRow("Minimum Order", product.minimumOrderQuantity != null ? `${Number(product.minimumOrderQuantity) || 1} unit(s)` : null, "ph-shopping-bag");
      addRow("Weight", product.weight != null ? `${product.weight} g` : null, "ph-scales");
      if (dimensions.width != null || dimensions.height != null || dimensions.depth != null) {
        addRow("Dimensions", [dimensions.width, dimensions.height, dimensions.depth].filter(v => v != null).join(" × ") + " cm", "ph-ruler");
      }
      addRow("Warranty", product.warrantyInformation, "ph-shield-check");
      addRow("Shipping", product.shippingInformation, "ph-truck");
      addRow("Returns", product.returnPolicy, "ph-arrow-u-up-left");

      // Product-specific specifications are shown only when supplied by the product API.
      const specs = [product.specifications, product.attributes, product.features, product.details]
        .filter(value => value && typeof value === "object");
      const ignored = new Set(["id", "title", "name", "price", "originalPriceUSD", "discountPercentage", "thumbnail", "images", "reviews", "description", "brand", "category", "stock", "rating", "tags", "dimensions", "weight", "warrantyInformation", "shippingInformation", "returnPolicy", "availabilityStatus", "minimumOrderQuantity", "sku"]);
      for (const key of Object.keys(product)) {
        if (ignored.has(key) || product[key] == null || product[key] === "" || typeof product[key] === "object") continue;
        if (/^(processor|cpu|display|displaySize|screenSize|ram|memory|storage|battery|camera|operatingSystem|os|connectivity|color|colour|material|model|resolution|refreshRate|graphics|gpu|network|sim|waterResistance|compatibility|capacity)$/i.test(key)) {
          addRow(humanizeKey(key), product[key], iconForDetail(key));
        }
      }
      for (const group of specs) {
        if (Array.isArray(group)) {
          for (const item of group) {
            if (!item || typeof item !== "object") continue;
            const key = item.name || item.label || item.key || item.title;
            const value = item.value ?? item.text ?? item.description;
            if (key && value != null && value !== "") addRow(humanizeKey(key), value, iconForDetail(key));
          }
        } else {
          for (const [key, value] of Object.entries(group)) {
            if (value == null || value === "" || ignored.has(key)) continue;
            addRow(humanizeKey(key), value, iconForDetail(key));
          }
        }
      }
      if (Array.isArray(product.tags) && product.tags.length) addRow("Tags", product.tags.join(", "), "ph-hash");

      // Keep the table clean if the API has duplicate spec fields.
      const seen = new Set();
      const uniqueRows = rows.filter(row => {
        const key = row.label.toLowerCase();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });

      detailsSection.innerHTML = `
        <h2 class="section-heading">Product Information</h2>
        <div class="details-grid">
          ${uniqueRows.map(row => `
            <div class="detail-row">
              <span class="detail-label"><i class="ph-fill ${escapeHTML(row.icon)}" aria-hidden="true"></i><span>${escapeHTML(row.label)}</span></span>
              <strong>${escapeHTML(row.value)}</strong>
            </div>
          `).join("")}
        </div>
      `;
      detailsSection.setAttribute("aria-busy", "false");
    }

    function humanizeKey(key) {
      return String(key).replace(/([a-z0-9])([A-Z])/g, "$1 $2").replace(/[_-]+/g, " ").replace(/^./, char => char.toUpperCase());
    }

    function iconForDetail(key) {
      const value = String(key).toLowerCase();
      if (/brand|manufacturer/.test(value)) return "ph-tag";
      if (/processor|cpu|gpu|graphics/.test(value)) return "ph-cpu";
      if (/display|screen|resolution|refresh/.test(value)) return "ph-device-mobile";
      if (/ram|memory|storage|capacity/.test(value)) return "ph-memory";
      if (/battery/.test(value)) return "ph-battery-charging";
      if (/camera/.test(value)) return "ph-camera";
      if (/operating|system|os/.test(value)) return "ph-gear";
      if (/color|colour/.test(value)) return "ph-palette";
      if (/weight|scale/.test(value)) return "ph-scales";
      if (/dimension|size|length|width|height/.test(value)) return "ph-ruler";
      if (/warranty|secure|protection/.test(value)) return "ph-shield-check";
      if (/shipping|delivery/.test(value)) return "ph-truck";
      if (/return/.test(value)) return "ph-arrow-u-up-left";
      if (/stock|quantity|package/.test(value)) return "ph-package";
      if (/sku|barcode|model/.test(value)) return "ph-barcode";
      if (/connectivity|network|sim|wireless/.test(value)) return "ph-wifi-high";
      return "ph-info";
    }

        /* CUSTOMER REVIEWS */

    function loadReviews() {
      const reviews = Array.isArray(product.reviews)
        ? product.reviews
        : [];

      reviewsSection.innerHTML = `
        <div class="reviews-header">
          <h2 class="section-heading">Customer Reviews</h2>

          <span class="review-summary">
            ${reviews.length} review${reviews.length === 1 ? "" : "s"}
          </span>
        </div>

        ${
          reviews.length
            ? `
              <div class="reviews-grid">
                ${reviews.map(review => `
                  <article class="review-card">
                    <div class="review-top">
                      <div>
                        <div class="reviewer-name">
                          ${escapeHTML(review.reviewerName || "Customer")}
                        </div>

                        <div class="review-date">
                          ${
                            review.date
                              ? escapeHTML(
                                  new Date(review.date).toLocaleDateString(
                                    "en-IN",
                                    {
                                      day: "numeric",
                                      month: "short",
                                      year: "numeric"
                                    }
                                  )
                                )
                              : "Verified review data"
                          }
                        </div>
                      </div>

                      <div
                        class="review-stars"
                        aria-label="${Number(review.rating) || 0} out of 5 stars"
                      >
                        ${"★".repeat(Math.max(
                          0,
                          Math.min(
                            5,
                            Math.round(Number(review.rating) || 0)
                          )
                        ))}
                        ${"☆".repeat(5 - Math.max(
                          0,
                          Math.min(
                            5,
                            Math.round(Number(review.rating) || 0)
                          )
                        ))}
                      </div>
                    </div>

                    <p class="review-comment">
                      ${escapeHTML(review.comment || "No comment provided.")}
                    </p>
                  </article>
                `).join("")}
              </div>
            `
            : `
              <div class="empty-reviews">
                No customer reviews are available for this product yet.
              </div>
            `
        }
      `;

      reviewsSection.setAttribute("aria-busy", "false");
    }

    /* Shared product cards; prices stay at listed price. Admin offers are shown only in the top bar. */
    function renderRecommendationCards(products) {
      return products.map(item => {
        const id = String(item.id || "");
        const image = safeImage(item.thumbnail) || safeImage(Array.isArray(item.images) ? item.images[0] : "") || "https://placehold.co/400x400/f5f5f2/969991?text=Product";
        const rating = Number(item.rating) || 0;
        return `
          <article class="related-card product-card" data-product-id="${escapeHTML(id)}" tabindex="0" aria-label="View details for ${escapeHTML(item.title || "Product")}">
            <div class="product-image"><img src="${escapeHTML(image)}" alt="${escapeHTML(item.title || "Product")}" loading="lazy"></div>
            <div class="product-info">
              <div class="product-category">${escapeHTML(item.category || "Other").replace(/-/g, " ")}</div>
              <h3 class="product-title">${escapeHTML(item.title || "Product")}</h3>
              <p class="product-description">${escapeHTML(item.description || "")}</p>
              <div class="product-rating"><i class="ph-fill ph-star" aria-hidden="true"></i><span>${rating ? rating.toFixed(1) : "No rating"}</span></div>
              <div class="product-bottom">
                <span class="product-price">${formatPrice(getDiscountedPrice(item))}${getDiscountPercent(item) > 0 ? ` <span class="product-original-price">${formatPrice(item.price)}</span>` : ""}</span>
                ${getDiscountPercent(item) > 0 ? `<span class="discount">${Number(getDiscountPercent(item).toFixed(2)).toString()}% OFF</span>` : ""}
              </div>
            </div>
          </article>`;
      }).join("");
    }

    function bindRecommendationCards(root) {
      root.querySelectorAll(".related-card[data-product-id]").forEach(card => {
        const openProduct = () => {
          const id = String(card.dataset.productId || "");
          if (id) window.location.href = `/product.html?id=${encodeURIComponent(id)}`;
        };
        card.addEventListener("click", event => {
          if (!event.target.closest("button")) openProduct();
        });
        card.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); openProduct(); }
        });
      });
    }

    async function loadRelatedProducts() {
      const grid = document.getElementById("relatedProductGrid");
      const likeGrid = document.getElementById("youMayAlsoLikeGrid");
      try {
        const data = await fetchJSON("/api/products");
        const all = (Array.isArray(data.products) ? data.products : [])
          .filter(item => String(item.id) !== String(product.id));
        const category = String(product.category || "").toLowerCase();
        const sameCategory = all.filter(item => String(item.category || "").toLowerCase() === category);
        const otherProducts = all.filter(item => String(item.category || "").toLowerCase() !== category);
        const shuffledSame = sameCategory.slice().sort(() => Math.random() - 0.5).slice(0, 20);
        const shuffledOther = otherProducts.slice().sort(() => Math.random() - 0.5).slice(0, 100);

        if (likeGrid) {
          likeGrid.innerHTML = shuffledSame.length
            ? renderRecommendationCards(shuffledSame)
            : `<div class="empty-reviews">No more products in this category yet.</div>`;
          bindRecommendationCards(likeGrid);
          document.getElementById("youMayAlsoLikeSection").setAttribute("aria-busy", "false");
        }
        if (grid) {
          grid.className = "related-grid product-grid";
          grid.innerHTML = shuffledOther.length
            ? renderRecommendationCards(shuffledOther)
            : `<div class="empty-reviews">No more products found.</div>`;
          bindRecommendationCards(grid);
        }
      } catch (error) {
        console.error("Recommendation products error:", error);
        if (grid) grid.innerHTML = `<div class="empty-reviews">More products could not be loaded. Please refresh and try again.</div>`;
        if (likeGrid) likeGrid.innerHTML = `<div class="empty-reviews">Recommendations could not be loaded.</div>`;
      } finally {
        if (relatedSection) relatedSection.setAttribute("aria-busy", "false");
      }
    }

    /* INITIALIZE */

    loadAdminDiscountBar();
    loadProduct();
  </script>
