<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>Payment — Shoppy</title>

  <link rel="icon" type="image/png"
    href="https://i.ibb.co/93kQCKxT/202610.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet"
    href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">

  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

  <link rel="stylesheet" href="/global.css">

  <style>
    main {
      width: min(1050px, 90%);
      max-width: 1050px;
      margin: 34px auto 65px;
    }

    .page-heading {
      margin-bottom: 28px;
    }

    .page-heading h1 {
      font-family: "Manrope", sans-serif;
      font-size: clamp(27px, 4vw, 36px);
      font-weight: 800;
      letter-spacing: -1.2px;
      margin: 0 0 8px;
    }

    .page-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .checkout-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(300px, .8fr);
      gap: 32px;
      align-items: start;
    }

    .checkout-section {
      padding: 0;
      margin: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 19px;
    }

    .section-heading h2 {
      font-family: "Manrope", sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.4px;
      margin: 0;
    }

    .section-number {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin-right: 7px;
    }

    .section-divider {
      height: 1px;
      background: var(--line);
      margin: 27px 0;
    }

    .address-list {
      display: grid;
      gap: 11px;
    }

    .address-option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }

    .address-option:hover {
      border-color: #b9c8fa;
    }

    .address-option:has(input:checked) {
      border-color: var(--blue);
      background: #f8faff;
    }

    .address-option input {
      accent-color: var(--blue);
      margin-top: 4px;
      flex-shrink: 0;
    }

    .address-content {
      flex: 1;
      min-width: 0;
    }

    .address-name {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .address-text {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .address-phone {
      display: block;
      margin-top: 5px;
      color: var(--ink);
      font-size: 12px;
    }

    .address-tag {
      display: inline-block;
      padding: 5px 8px;
      margin-top: 8px;
      border-radius: 5px;
      background: #edf2ff;
      color: var(--blue);
      font-size: 10px;
      font-weight: 800;
    }

    .payment-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px;
      border: 1px solid var(--blue);
      background: #f8faff;
      border-radius: 12px;
    }

    .payment-method-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .payment-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      background: #edf2ff;
      border-radius: 10px;
      color: var(--blue);
      font-size: 23px;
      flex-shrink: 0;
    }

    .payment-method-title {
      display: block;
      font-size: 13px;
      font-weight: 800;
    }

    .payment-method-description {
      margin-top: 5px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.6;
    }

    .secure-badge {
      color: var(--green);
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .product-list {
      display: grid;
    }

    .product-item {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      padding: 15px 0;
      border-bottom: 1px solid var(--line);
    }

    .product-item:first-child {
      padding-top: 0;
    }

    .product-item:last-child {
      border-bottom: 0;
    }

    .product-image-wrap {
      position: relative;
      flex-shrink: 0;
      width: 76px;
      height: 88px;
      overflow: hidden;
      border-radius: 9px;
      background: #f5f5f2;
    }

    .product-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    .product-details {
      flex: 1;
      min-width: 0;
    }

    .product-name {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .product-meta {
      color: var(--muted);
      font-size: 11px;
      margin-top: 5px;
    }

    .product-pricing {
      text-align: right;
      flex-shrink: 0;
      padding-left: 5px;
    }

    .product-final-price {
      display: block;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .summary-heading {
      margin-bottom: 20px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin: 15px 0;
      font-size: 13px;
      color: #666960;
    }

    .price-row strong {
      color: var(--ink);
      font-weight: 700;
      text-align: right;
      white-space: nowrap;
    }

    .total-row {
      padding-top: 18px;
      margin-top: 18px;
      border-top: 1px solid var(--line);
      align-items: center;
      color: var(--ink);
      font-size: 15px;
      font-weight: 800;
    }

    .total-row strong {
      font-family: "Manrope", sans-serif;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -.7px;
    }

    .order-reference {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.7;
      overflow-wrap: anywhere;
      text-align: center;
      margin-top: 12px;
    }

    .payment-footnote {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.8;
      text-align: center;
      margin-top: 15px;
    }

    .orders-link {
      display: block;
      margin-top: 17px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
    }

    .orders-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 760px) {
      main {
        width: 90%;
        margin-top: 25px;
      }

      .checkout-layout {
        grid-template-columns: minmax(0, 1fr);
        gap: 30px;
      }

      .summary-column {
        order: -1;
      }

      .section-divider {
        margin: 24px 0;
      }

      .product-image-wrap {
        width: 70px;
        height: 82px;
      }

      .page-heading h1 {
        font-size: 29px;
      }
    }

    @media (min-width: 761px) {
      .summary-column {
        position: sticky;
        top: calc(var(--header-h) + 25px);
      }
    }

    @media (max-width: 380px) {
      .product-image-wrap {
        width: 60px;
        height: 74px;
      }

      .product-name {
        font-size: 12px;
      }

      .product-final-price {
        font-size: 12px;
      }

      .product-pricing {
        padding-left: 0;
      }
    }

    .topbar {
      width: 100% !important;
      height: 64px !important;
      min-height: 64px !important;
      padding: 0 max(5%, calc((100% - 1050px) / 2)) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      background: #fff !important;
      border-bottom: 1px solid #E5E7EB !important;
      box-shadow: none !important;
    }

    .payment-back {
      display: flex !important;
      width: 40px !important;
      height: 40px !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 8px !important;
      border: 0 !important;
      border-radius: 9px !important;
      background: transparent !important;
      color: #1E1F1C !important;
      font-size: 24px !important;
      line-height: 1 !important;
      box-shadow: none !important;
      text-decoration: none !important;
      border-bottom: 0 !important;
      outline-offset: 2px !important;
      position: relative !important;
    }

    .payment-back::before,
    .payment-back::after,
    .payment-back i::before,
    .payment-back i::after {
      content: none !important;
      display: none !important;
    }

    .payment-back i {
      display: block !important;
      border: 0 !important;
      text-decoration: none !important;
      box-shadow: none !important;
      background: none !important;
    }

    .topbar .payment-back,
    .topbar .payment-back:visited,
    .topbar .payment-back:hover,
    .topbar .payment-back:active {
      border: 0 !important;
      border-bottom: 0 !important;
      text-decoration: none !important;
      background-image: none !important;
      box-shadow: none !important;
    }

    .payment-back:hover {
      background: #F5F5F2 !important;
    }

    .discount-row {
      display: none !important;
    }

    @media (min-width: 761px) {
      main {
        width: min(1050px, 90%) !important;
        max-width: 1050px !important;
        margin-left: auto !important;
        margin-right: auto !important;
      }
    }

    .topbar .brand {
      margin-left: auto !important;
      font-family: "Manrope", sans-serif !important;
      font-size: 22px !important;
      font-weight: 800 !important;
      line-height: 1.4 !important;
      letter-spacing: -.7px !important;
      color: #2962FF !important;
    }
  </style>
</head>

<body>

  <header class="topbar">
    <a href="javascript:history.back()"
       class="payment-back nav-icon"
       aria-label="Go back"
       title="Go back">
      <i class="ph ph-arrow-left" aria-hidden="true"></i>
    </a>

    <a href="/home.html" class="brand" aria-label="Shoppy home">
      Shoppy.
    </a>
  </header>
