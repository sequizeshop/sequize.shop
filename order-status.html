<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <meta name="theme-color" content="#ffffff">

  <title>Order Status — Shoppy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --black: #111111;
      --white: #ffffff;

      --gray: #737373;
      --light-gray: #f7f7f7;
      --border: #e9e9e9;

      --green: #159447;
      --green-dark: #117b37;
      --green-bg: #e7f8ec;

      --red: #dc3545;
      --red-bg: #fff0f1;

      --orange: #df9419;
      --orange-bg: #fff6e5;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;

      min-height: 100vh;
      min-height: 100dvh;

      background: var(--white);
      color: var(--black);

      font-family: "Inter", sans-serif;

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button,
    a {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      width: 100%;
      height: 76px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 7%;

      background: #ffffff;

      border-bottom: 1px solid var(--border);
    }

    .brand {
      color: var(--black);

      font-size: 25px;
      font-weight: 800;

      letter-spacing: -1.2px;
      line-height: 1;
    }

    /* =========================
       FULL SCREEN MAIN
    ========================= */

    .main {
      min-height: calc(100vh - 76px);
      min-height: calc(100dvh - 76px);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 42px 24px;
    }

    .status-content {
      width: 100%;
      max-width: 460px;

      margin: auto;

      text-align: center;
    }

    /* =========================
       STATUS ICON
    ========================= */

    .icon-area {
      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 30px;
    }

    .status-icon {
      width: 94px;
      height: 94px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: #ffffff;

      opacity: 0;
      transform: scale(0.65);

      animation:
        iconAppear 0.55s
        cubic-bezier(0.18, 0.89, 0.32, 1.28)
        forwards;
    }

    .status-icon svg {
      width: 44px;
      height: 44px;

      fill: none;

      stroke: currentColor;
      stroke-width: 3.5;

      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .status-icon.success {
      background: var(--green);

      box-shadow:
        0 0 0 9px rgba(21, 148, 71, 0.08);
    }

    .status-icon.failed {
      background: var(--red);

      box-shadow:
        0 0 0 9px rgba(220, 53, 69, 0.07);
    }

    .status-icon.pending {
      background: var(--black);

      box-shadow:
        0 0 0 9px rgba(17, 17, 17, 0.06);
    }

    .spinner {
      width: 38px;
      height: 38px;

      border: 3px solid rgba(255, 255, 255, 0.28);
      border-top-color: #ffffff;

      border-radius: 50%;

      animation: spin 0.75s linear infinite;
    }

    /* =========================
       HEADINGS
    ========================= */

    .status-title {
      margin: 0 0 14px;

      color: var(--black);

      font-size: clamp(24px, 5vw, 31px);
      font-weight: 800;

      line-height: 1.25;
      letter-spacing: -1.15px;
    }

    .status-description {
      max-width: 360px;

      margin: 0 auto;

      color: var(--gray);

      font-size: 14px;
      font-weight: 400;

      line-height: 1.85;
    }

    /* =========================
       SAVINGS BOX
    ========================= */

    .saving-box {
      display: none;

      width: 100%;

      margin-top: 30px;
      padding: 21px 18px;

      background: var(--green-bg);

      border: 1px solid #d4efdc;
      border-radius: 25px;

      color: var(--green-dark);

      animation: slideUp 0.45s ease both;
    }

    .saving-box.visible {
      display: block;
    }

    .saving-title {
      margin-bottom: 7px;

      font-size: 19px;
      font-weight: 800;

      line-height: 1.4;
      letter-spacing: -0.45px;
    }

    .saving-subtitle {
      color: #388354;

      font-size: 12px;
      line-height: 1.7;
    }

    /* =========================
       ORDER ID
    ========================= */

    .order-info {
      display: none;

      margin-top: 25px;
      padding: 13px 15px;

      background: var(--light-gray);

      border: 1px solid var(--border);
      border-radius: 10px;

      text-align: left;
    }

    .order-info.visible {
      display: block;
    }

    .order-label {
      margin-bottom: 6px;

      color: var(--gray);

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .order-id {
      color: var(--black);

      font-size: 12px;
      font-weight: 600;

      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    /* =========================
       REDIRECT COUNTDOWN
    ========================= */

    .redirect-area {
      margin-top: 27px;
    }

    .redirect-text {
      color: var(--gray);

      font-size: 12px;
      line-height: 1.8;
    }

    .redirect-text strong {
      color: var(--black);
      font-weight: 700;
    }

    .progress {
      width: 100%;
      height: 3px;

      margin-top: 14px;

      overflow: hidden;

      background: #eeeeee;
      border-radius: 99px;
    }

    .progress-bar {
      width: 0;
      height: 100%;

      background: var(--black);

      border-radius: 99px;

      transition: width 0.12s linear;
    }

    /* =========================
       BUTTONS
    ========================= */

    .actions {
      display: flex;
      flex-direction: column;

      gap: 11px;

      width: 100%;

      margin-top: 27px;
    }

    .button {
      width: 100%;
      min-height: 47px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 12px 20px;

      border: 1px solid var(--black);
      border-radius: 10px;

      font-size: 13px;
      font-weight: 600;

      line-height: 1.4;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .button:active {
      transform: scale(0.985);
    }

    .button-primary {
      color: #ffffff;
      background: var(--black);
    }

    .button-primary:hover {
      background: #292929;
      border-color: #292929;
    }

    .button-secondary {
      color: var(--black);
      background: #ffffff;
    }

    .button-secondary:hover {
      background: var(--light-gray);
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      margin-top: 27px;

      color: #999999;

      font-size: 10px;
      font-weight: 500;

      letter-spacing: 0.1px;
    }

    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes iconAppear {
      0% {
        opacity: 0;
        transform: scale(0.65);
      }

      70% {
        opacity: 1;
        transform: scale(1.08);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
      .header {
        height: 64px;
        padding: 0 20px;
      }

      .brand {
        font-size: 23px;
      }

      .main {
        min-height: calc(100vh - 64px);
        min-height: calc(100dvh - 64px);

        padding: 32px 23px;
      }

      .status-content {
        max-width: 390px;
      }

      .icon-area {
        margin-bottom: 27px;
      }

      .status-icon {
        width: 84px;
        height: 84px;
      }

      .status-icon svg {
        width: 40px;
        height: 40px;
      }

      .status-title {
        font-size: 26px;
      }

      .status-description {
        font-size: 13px;
      }

      .saving-box {
        margin-top: 25px;
        padding: 19px 15px;

        border-radius: 25px;
      }

      .saving-title {
        font-size: 17px;
      }

      .redirect-area {
        margin-top: 24px;
      }

      .actions {
        margin-top: 24px;
      }
    }

    @media (max-height: 650px) {
      .main {
        padding-top: 25px;
        padding-bottom: 25px;
      }

      .icon-area {
        margin-bottom: 20px;
      }

      .status-icon {
        width: 76px;
        height: 76px;
      }

      .status-icon svg {
        width: 36px;
        height: 36px;
      }

      .saving-box {
        margin-top: 18px;
        padding: 15px;
      }

      .redirect-area {
        margin-top: 19px;
      }

      .actions {
        margin-top: 19px;
      }

      .footer {
        margin-top: 19px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER: only text, no logo icon -->

  <header class="header">
    <a href="/" class="brand" aria-label="Shoppy Home">
      Shoppy
    </a>
  </header>


  <!-- FULL SCREEN STATUS CONTENT -->

  <main class="main">

    <section class="status-content">

      <div class="icon-area">

        <div
          id="statusIcon"
          class="status-icon pending"
          aria-hidden="true"
        >
          <div class="spinner"></div>
        </div>

      </div>


      <h1
        id="statusTitle"
        class="status-title"
        aria-live="polite"
      >
        PAYMENT PROCESSING
      </h1>


      <p
        id="statusDescription"
        class="status-description"
      >
        Please wait while we securely verify your payment.
        Please do not make another payment.
      </p>


      <!-- SUCCESS SAVINGS BOX -->

      <div id="savingBox" class="saving-box">

        <div class="saving-title">
          You saved 15% of money
        </div>

        <div class="saving-subtitle">
          Thank you for shopping with Shoppy.
        </div>

      </div>


      <!-- ORDER ID -->

      <div id="orderInfo" class="order-info">

        <div class="order-label">
          Order ID
        </div>

        <div id="orderIdText" class="order-id"></div>

      </div>


      <!-- REDIRECT -->

      <div class="redirect-area">

        <div class="redirect-text">
          <span id="redirectLabel">
            Checking your payment securely...
          </span>
        </div>

        <div class="progress">
          <div
            id="progressBar"
            class="progress-bar"
          ></div>
        </div>

      </div>


      <!-- BUTTONS -->

      <div class="actions">

        <a
          id="ordersButton"
          class="button button-primary"
          href="/orders.html"
        >
          View My Orders
        </a>

        <a
          class="button button-secondary"
          href="/"
        >
          Continue Shopping
        </a>

      </div>


      <div class="footer">
        Secure payment verification
      </div>

    </section>

  </main>


  <script>
    (() => {
      "use strict";

      const params = new URLSearchParams(location.search);

      const orderId = params.get("orderId") || "";

      const ORDERS_URL = "/orders.html";

      const statusIcon = document.getElementById("statusIcon");
      const statusTitle = document.getElementById("statusTitle");

      const statusDescription =
        document.getElementById("statusDescription");

      const savingBox = document.getElementById("savingBox");

      const orderInfo = document.getElementById("orderInfo");
      const orderIdText = document.getElementById("orderIdText");

      const redirectLabel =
        document.getElementById("redirectLabel");

      const progressBar = document.getElementById("progressBar");

      const ordersButton = document.getElementById("ordersButton");

      let checking = false;
      let stopped = false;
      let redirectTimer = null;
      let pollingTimer = null;

      if (orderId) {
        orderInfo.classList.add("visible");

        orderIdText.textContent = orderId;

        ordersButton.href =
          ORDERS_URL +
          "?orderId=" +
          encodeURIComponent(orderId);
      }


      /* =========================
         ICONS
      ========================= */

      function setIcon(type) {
        statusIcon.className = "status-icon " + type;

        if (type === "success") {
          statusIcon.innerHTML = `
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M10 25 L20 35 L39 14"></path>
            </svg>
          `;
        } else if (type === "failed") {
          statusIcon.innerHTML = `
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M14 14 L34 34"></path>
              <path d="M34 14 L14 34"></path>
            </svg>
          `;
        } else {
          statusIcon.innerHTML = `
            <div class="spinner"></div>
          `;
        }
      }


      /* =========================
         STATUS UI
      ========================= */

      function showPending(message) {
        setIcon("pending");

        statusTitle.textContent = "PAYMENT PROCESSING";

        statusDescription.textContent =
          message ||
          "Your payment is being verified. Please do not pay again.";

        savingBox.classList.remove("visible");

        redirectLabel.textContent =
          "Checking your payment securely...";

        progressBar.style.width = "0%";
      }


      function showSuccess() {
        setIcon("success");

        statusTitle.textContent =
          "ORDER PLACED SUCCESSFULLY";

        statusDescription.textContent =
          "Your payment has been verified successfully. Your order is confirmed.";

        savingBox.classList.add("visible");
      }


      function showFailure() {
        setIcon("failed");

        statusTitle.textContent = "ORDER FAILED";

        statusDescription.textContent =
          "Your payment could not be completed. Please check My Orders for the latest status before trying again.";

        savingBox.classList.remove("visible");
      }


      /* =========================
         REDIRECT COUNTDOWN
      ========================= */

      function startRedirectCountdown() {
        if (redirectTimer) return;

        const duration = 5000;
        const deadline = Date.now() + duration;

        function update() {
          const remaining = Math.max(
            0,
            deadline - Date.now()
          );

          const seconds = Math.ceil(remaining / 1000);

          redirectLabel.textContent =
            "Redirecting to My Orders in " +
            seconds +
            (seconds === 1 ? " second..." : " seconds...");

          const percent =
            ((duration - remaining) / duration) * 100;

          progressBar.style.width = percent + "%";

          if (remaining <= 0) {
            clearInterval(redirectTimer);
            redirectTimer = null;

            location.replace(
              orderId
                ? ORDERS_URL +
                  "?orderId=" +
                  encodeURIComponent(orderId)
                : ORDERS_URL
            );
          }
        }

        update();

        redirectTimer = setInterval(update, 100);
      }


      /* =========================
         PAYMENT VERIFICATION
      ========================= */

      async function verifyPayment() {
        if (!orderId || checking || stopped) {
          return;
        }

        checking = true;

        try {
          const response = await fetch(
            "/api/checkout/order",
            {
              method: "POST",

              credentials: "same-origin",

              headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
              },

              body: JSON.stringify({
                action: "verify-payment",
                orderId: orderId
              })
            }
          );

          if (!response.ok) {
            showPending(
              "Your payment is still being checked. Please wait while we verify it."
            );

            return;
          }

          const data = await response.json();

          const status = String(
            data.paymentStatus || data.status || ""
          ).toUpperCase();


          /* SUCCESS */

          if (status === "PAID") {
            stopped = true;

            if (pollingTimer) {
              clearInterval(pollingTimer);
            }

            showSuccess();

            startRedirectCountdown();

            return;
          }


          /* DEFINITE FAILURE */

          if (
            status === "FAILED" ||
            status === "EXPIRED" ||
            status === "TERMINATED"
          ) {
            stopped = true;

            if (pollingTimer) {
              clearInterval(pollingTimer);
            }

            showFailure();

            startRedirectCountdown();

            return;
          }


          /* STILL PENDING */

          showPending(
            "Your payment has not been confirmed yet. We are checking its status securely."
          );

        } catch (error) {
          showPending(
            "We could not confirm your payment yet. Please do not make another payment while verification is in progress."
          );

        } finally {
          checking = false;
        }
      }


      /* =========================
         START
      ========================= */

      if (!orderId) {
        showPending(
          "Order details were not found. Open My Orders to check your latest order status."
        );

        redirectLabel.textContent =
          "You can open My Orders using the button below.";

        return;
      }

      showPending();

      verifyPayment();

      pollingTimer = setInterval(() => {
        if (stopped) {
          clearInterval(pollingTimer);
          return;
        }

        verifyPayment();
      }, 2000);

    })();
  </script>

</body>
</html>
