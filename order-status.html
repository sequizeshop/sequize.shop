<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>Order Status — Shoppy</title>

  <link rel="icon" type="image/png"
    href="https://i.ibb.co/93kQCKxT/202610.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet"
    href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">

  <style>
    :root {
      --ink: #20221f;
      --muted: #797c74;
      --line: #e8e9e3;
      --blue: #1748d1;
      --blue-dark: #1038aa;
      --green: #15803d;
      --red: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      height: 72px;
      padding: 0 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .bag-link {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      font-size: 26px;
      text-decoration: none;
      color: var(--ink);
    }

    .brand {
      color: var(--blue);
      font-family: "Manrope", sans-serif;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -1px;
      text-decoration: none;
    }

    main {
      width: min(500px, 90%);
      margin: 65px auto;
      text-align: center;
    }

    .status-icon {
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      margin: 0 auto 24px;
      border-radius: 50%;
      font-size: 39px;
    }

    .status-icon.pending {
      color: var(--blue);
      background: #edf2ff;
      animation: pulse 1.6s ease-in-out infinite;
    }

    .status-icon.success {
      color: var(--green);
      background: #dcfce7;
    }

    .status-icon.failed {
      color: var(--red);
      background: #fee2e2;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    h1 {
      font-family: "Manrope", sans-serif;
      font-size: clamp(27px, 5vw, 34px);
      letter-spacing: -1px;
      margin: 0 0 13px;
    }

    .description {
      max-width: 380px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 21px;
      padding: 9px 13px;
      background: #edf2ff;
      color: var(--blue);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
    }

    .status-pill.success {
      background: #dcfce7;
      color: #166534;
    }

    .status-pill.failed {
      background: #fee2e2;
      color: #991b1b;
    }

    .order-reference {
      margin-top: 27px;
      padding: 16px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    .order-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 8px;
    }

    .order-id {
      font-size: 12px;
      font-weight: 700;
      overflow-wrap: anywhere;
      line-height: 1.7;
    }

    .actions {
      display: grid;
      gap: 11px;
      margin-top: 25px;
    }

    .button {
      min-height: 49px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 10px;
      padding: 13px 18px;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      border: 1px solid var(--line);
      cursor: pointer;
    }

    .button.primary {
      color: #ffffff;
      background: var(--blue);
      border-color: var(--blue);
    }

    .button.primary:hover {
      background: var(--blue-dark);
    }

    .button.secondary {
      color: var(--ink);
      background: #ffffff;
    }

    .footnote {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.8;
      margin-top: 22px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      .topbar {
        height: 64px;
      }

      main {
        margin-top: 48px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <a href="/" class="bag-link" aria-label="Continue shopping">
      <i class="ph ph-bag-simple"></i>
    </a>

    <a href="/" class="brand">Shoppy.</a>
  </header>

  <main>

    <div id="statusIcon" class="status-icon pending">
      <i class="ph ph-hourglass-medium"></i>
    </div>

    <h1 id="statusTitle">Checking your payment</h1>

    <p id="statusDescription" class="description">
      Please wait while we verify your payment with the server.
    </p>

    <div id="statusPill" class="status-pill">
      <i class="ph ph-circle-notch"></i>
      <span id="statusLabel">VERIFYING PAYMENT</span>
    </div>

    <div class="order-reference">
      <div class="order-label">Order reference</div>
      <div id="orderId" class="order-id">Loading...</div>
    </div>

    <div class="actions">

      <a id="ordersButton"
         href="/orders.html"
         class="button primary">
        <i class="ph ph-package"></i>
        View my order
      </a>

      <button id="retryButton"
              class="button secondary"
              type="button">
        <i class="ph ph-arrow-clockwise"></i>
        Check payment again
      </button>

      <a href="/" class="button secondary">
        <i class="ph ph-house"></i>
        Continue shopping
      </a>

    </div>

    <p id="footnote" class="footnote">
      Do not make another payment while your current payment is being verified.
    </p>

  </main>

  <script>
    "use strict";

    const API_URL = "/api/checkout/order";
    const POLL_INTERVAL = 2000;
    const MAX_RETRIES = 60;

    const params = new URLSearchParams(window.location.search);
    const orderId = params.get("orderId");

    const $ = (id) => document.getElementById(id);

    let isVerifying = false;
    let isFinal = false;
    let retryCount = 0;
    let timer = null;

    function setPending(title, description, label = "PAYMENT PENDING") {
      $("statusIcon").className = "status-icon pending";

      $("statusIcon").innerHTML =
        '<i class="ph ph-hourglass-medium"></i>';

      $("statusTitle").textContent = title;
      $("statusDescription").textContent = description;

      $("statusPill").className = "status-pill";
      $("statusPill").innerHTML = `
        <i class="ph ph-circle-notch"></i>
        <span id="statusLabel">${label}</span>
      `;

      $("retryButton").classList.remove("hidden");

      $("footnote").textContent =
        "Payment status is being checked securely. If money was deducted, " +
        "do not immediately attempt another payment.";
    }

    function setSuccess() {
      isFinal = true;

      clearTimeout(timer);

      $("statusIcon").className = "status-icon success";

      $("statusIcon").innerHTML =
        '<i class="ph ph-check-circle"></i>';

      $("statusTitle").textContent = "Payment successful!";

      $("statusDescription").textContent =
        "Your payment has been confirmed. Thank you for shopping with Shoppy.";

      $("statusPill").className = "status-pill success";

      $("statusPill").innerHTML =
        '<i class="ph ph-check-circle"></i>' +
        '<span>PAYMENT SUCCESSFUL</span>';

      $("retryButton").classList.add("hidden");

      $("ordersButton").innerHTML =
        '<i class="ph ph-package"></i> View your order';

      $("footnote").textContent =
        "Your payment has been verified by the server. You can now view your order.";

      // Keep the result visible. No automatic redirect.
    }

    function setFailed(status) {
      isFinal = true;

      clearTimeout(timer);

      $("statusIcon").className = "status-icon failed";

      $("statusIcon").innerHTML =
        '<i class="ph ph-x-circle"></i>';

      $("statusTitle").textContent = "Payment not completed";

      if (status === "EXPIRED") {
        $("statusDescription").textContent =
          "This payment session has expired. Please check your order.";
      } else if (status === "TERMINATED") {
        $("statusDescription").textContent =
          "This payment session was terminated. Please check your order.";
      } else {
        $("statusDescription").textContent =
          "The payment provider reported that the payment failed. Please check your order before trying again.";
      }

      $("statusPill").className = "status-pill failed";

      $("statusPill").innerHTML = `
        <i class="ph ph-x-circle"></i>
        <span>${status}</span>
      `;

      $("retryButton").classList.add("hidden");

      $("ordersButton").innerHTML =
        '<i class="ph ph-package"></i> Check your order';

      $("footnote").textContent =
        "If money was deducted from your account, check the order before trying again. " +
        "A failed payment should not be paid again until you confirm the current order status.";
    }

    async function verifyPayment() {
      if (isVerifying || isFinal) return;

      if (!orderId) {
        isFinal = true;

        $("statusIcon").className = "status-icon failed";

        $("statusIcon").innerHTML =
          '<i class="ph ph-warning-circle"></i>';

        $("statusTitle").textContent = "Order ID missing";

        $("statusDescription").textContent =
          "We could not identify this order. Please open My Orders to find your order.";

        $("statusPill").className = "status-pill failed";

        $("statusPill").innerHTML =
          '<i class="ph ph-warning-circle"></i>' +
          '<span>ORDER NOT IDENTIFIED</span>';

        $("orderId").textContent = "Not available";
        $("retryButton").classList.add("hidden");

        return;
      }

      isVerifying = true;

      $("retryButton").disabled = true;
      $("retryButton").textContent = "Checking payment...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          credentials: "same-origin",
          cache: "no-store",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "verify-payment",
            orderId
          })
        });

        const raw = await response.text();

        let data = {};

        try {
          data = raw ? JSON.parse(raw) : {};
        } catch {
          throw new Error("Invalid response from the payment server.");
        }

        if (!response.ok || data.success === false) {
          throw new Error(
            data.message ||
            data.error ||
            `Verification failed (${response.status})`
          );
        }

        /*
         * Preserve the existing API's response format:
         * data.paymentStatus || data.status
         */
        const status = String(
          data.paymentStatus ||
          data.payment_status ||
          data.order?.paymentStatus ||
          data.order?.payment_status ||
          data.status ||
          ""
        ).toUpperCase();

        if (
          status === "PAID" ||
          status === "SUCCESS" ||
          status === "SUCCESSFUL" ||
          status === "COMPLETED"
        ) {
          setSuccess();
          return;
        }

        if (
          status === "FAILED" ||
          status === "EXPIRED" ||
          status === "TERMINATED"
        ) {
          setFailed(status);
          return;
        }

        retryCount++;

        setPending(
          "Payment is being verified",
          "Cashfree has not yet returned a final confirmed result. We will check again automatically.",
          status || "PAYMENT PENDING"
        );

        if (retryCount < MAX_RETRIES) {
          timer = setTimeout(verifyPayment, POLL_INTERVAL);
        } else {
          setPending(
            "Payment confirmation is taking longer",
            "We could not confirm the final result yet. You can retry the check or view your order.",
            "AWAITING CONFIRMATION"
          );

          $("footnote").textContent =
            "Automatic checks have paused. Please retry or check My Orders. " +
            "A pending result does not mean the payment failed.";
        }

      } catch (error) {
        console.error("Payment verification error:", error);

        retryCount++;

        setPending(
          "Unable to confirm payment yet",
          "The verification service could not confirm the result. Your payment may still be processing.",
          "RETRYING VERIFICATION"
        );

        if (retryCount < MAX_RETRIES) {
          timer = setTimeout(verifyPayment, POLL_INTERVAL);
        } else {
          $("statusDescription").textContent =
            "Automatic checks have paused. Tap Check payment again to retry, or view your order.";

          $("footnote").textContent =
            "A verification error does not mean payment failed. Check your order before attempting another payment.";
        }

      } finally {
        isVerifying = false;

        $("retryButton").disabled = false;

        $("retryButton").innerHTML =
          '<i class="ph ph-arrow-clockwise"></i> Check payment again';
      }
    }

    $("retryButton").addEventListener("click", () => {
      if (isFinal || isVerifying) return;

      clearTimeout(timer);
      retryCount = 0;

      verifyPayment();
    });

    $("orderId").textContent = orderId || "Not available";

    $("ordersButton").href = orderId
      ? `/orders.html?orderId=${encodeURIComponent(orderId)}`
      : "/orders.html";

    verifyPayment();
  </script>

</body>
</html>
