  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">

  <link rel="stylesheet" href="/global.css">

  <style>
    :root {
      --ink: #20221f;
      --muted: #797c74;
      --line: #e8e9e3;
      --paper: #ffffff;
      --blue: #1748d1;
      --blue-dark: #1038aa;
      --blue-light: #f1f5ff;
      --green: #15803d;
      --red: #dc2626;
      --header-h: 60px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 125px;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: var(--ink);
      font-family: "DM Sans", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }

    [hidden] {
      display: none !important;
    }

    /* =====================================
       STICKY TOP TOOLBAR
    ===================================== */

    .navbar {
      position: sticky;
      position: -webkit-sticky;
      top: 0;
      z-index: 1000;

      width: 100%;
      height: var(--header-h);
      min-height: var(--header-h);
      max-height: var(--header-h);

      display: flex;
      align-items: center;
      justify-content: space-between;

      margin: 0;
      padding: 0 20px;
      gap: 12px;

      background: #ffffff;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      box-shadow: none;

      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      min-width: 0;
      flex-shrink: 0;
      height: 100%;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      height: 100%;

      margin: 0;
      padding: 0;

      color: var(--blue);
      font-family: "Manrope", Arial, sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      white-space: nowrap;
    }

    .brand:hover {
      color: var(--blue-dark);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      gap: 12px;
      flex-shrink: 0;
    }

    .nav-icon {
      position: relative;

      width: 42px;
      height: 42px;
      flex-shrink: 0;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      margin: 0;
      padding: 0;

      border: 0;
      border-radius: 10px;

      background: transparent;
      color: #343a46;

      font-size: 25px;
      line-height: 1;

      transition:
        background .18s,
        color .18s;
    }

    .nav-icon:hover {
      background: var(--blue-light);
      color: var(--blue);
    }

    .nav-icon i {
      display: block;
      line-height: 1;
    }

    .cart-count {
      position: absolute;
      top: 0;
      right: 0;

      min-width: 18px;
      height: 18px;
      padding: 0 4px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 2px solid #ffffff;
      border-radius: 20px;

      background: var(--blue);
      color: #ffffff;

      font-size: 10px;
      font-weight: 800;
      line-height: 1;
    }

    /* =====================================
       SEARCH BAR BELOW TOOLBAR
    ===================================== */

    .search-bar-wrap {
      position: relative;
      z-index: 10;

      width: 100%;
      margin: 0;
      padding: 12px 20px;

      background: #ffffff;
      border-bottom: 1px solid var(--line);
    }

    .search {
      width: 100%;
      max-width: none;
      height: 44px;
      margin: 0;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 0 14px;

      border: 1px solid #e1e4dc;
      border-radius: 10px;

      background: #ffffff;

      transition:
        border-color .18s,
        box-shadow .18s;
    }

    .search:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(23, 72, 209, .08);
    }

    .search > i {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 19px;
    }

    .search input {
      width: 100%;
      min-width: 0;
      height: 100%;
      padding: 0;

      border: 0;
      outline: 0;
      box-shadow: none;

      background: transparent;
      color: var(--ink);
      font-size: 13px;
    }

    .search input:focus {
      outline: 0;
      border: 0;
      box-shadow: none;
    }

    .search input::placeholder {
      color: #92958d;
    }

    /* =====================================
       HERO
    ===================================== */

    .hero-wrap {
      width: 100%;
      margin: 0;
      padding: 28px 20px 0;
    }

    .hero-wrap.search-hidden {
      display: none;
    }

    .hero {
      position: relative;
      overflow: hidden;

      width: 100%;
      max-width: none;
      min-height: 285px;
      margin: 0;
      padding: 40px 5%;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;

      border: 1px solid #e8e9e3;
      border-radius: 14px;

      background:
        radial-gradient(
          circle at 90% 20%,
          rgba(23, 72, 209, .08),
          transparent 35%
        ),
        #fafbf8;
    }

    .hero-copy {
      position: relative;
      z-index: 1;

      max-width: 540px;
      min-width: 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      margin-bottom: 15px;

      color: var(--blue);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .eyebrow i {
      font-size: 16px;
    }

    .hero h1 {
      max-width: 500px;
      margin: 0;

      color: var(--ink);
      font-family: "Manrope", Arial, sans-serif;
      font-size: clamp(30px, 4vw, 43px);
      font-weight: 800;
      line-height: 1.16;
      letter-spacing: -1.5px;
    }

    .hero p {
      max-width: 430px;
      margin: 13px 0 0;

      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    /* Text-only button: no icon */

    .hero-button {
      min-height: 44px;
      margin-top: 22px;
      padding: 12px 20px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 1px solid var(--blue);
      border-radius: 9px;

      background: var(--blue);
      color: #ffffff;

      font-size: 12px;
      font-weight: 700;

      transition:
        background .18s,
        border-color .18s;
    }

    .hero-button:hover {
      background: var(--blue-dark);
      border-color: var(--blue-dark);
    }

    .hero-art {
      width: 195px;
      height: 195px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid #e8e9e3;
      border-radius: 50%;

      background: rgba(255, 255, 255, .85);
    }

    .hero-art img {
      width: 78%;
      height: 78%;
      object-fit: contain;
    }

    /* =====================================
       MAIN CONTAINER - FULL WIDTH
    ===================================== */

    .container {
      width: 100%;
      max-width: none;
      margin: 36px 0 60px;
      padding: 0 20px;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;

      margin-bottom: 17px;
    }

    .section-head h2 {
      margin: 0;

      color: var(--ink);
      font-family: "Manrope", Arial, sans-serif;
      font-size: 21px;
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: -.55px;
    }

    .section-head p {
      margin: 6px 0 0;

      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .product-count {
      padding-bottom: 2px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    /* =====================================
       FULLY ROUNDED CATEGORY BUTTONS
    ===================================== */

    .categories {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;

      margin-bottom: 32px;
    }

    .category-btn {
      min-height: 38px;
      padding: 9px 17px;

      border: 1px solid #e1e4dc;
      border-radius: 999px;

      background: #ffffff;
      color: #55584f;

      font-size: 11px;
      font-weight: 700;
      text-transform: capitalize;

      transition:
        color .18s,
        background .18s,
        border-color .18s;
    }

    .category-btn:hover {
      border-color: var(--blue);
      background: var(--blue-light);
      color: var(--blue);
    }

    .category-btn.active {
      border-color: var(--blue);
      background: var(--blue);
      color: #ffffff;
    }

    /* =====================================
       PRODUCT GRID
    ===================================== */

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: stretch;
      gap: 18px;
    }

    .product-card {
      min-width: 0;
      overflow: hidden;

      display: flex;
      flex-direction: column;

      border: 1px solid var(--line);
      border-radius: 12px;

      background: #ffffff;
      cursor: pointer;

      transition:
        border-color .18s,
        box-shadow .18s,
        transform .18s;
    }

    .product-card:hover {
      border-color: #cbd5f5;
      box-shadow: 0 6px 20px rgba(32, 34, 31, .06);
      transform: translateY(-2px);
    }

    .product-image {
      position: relative;
      overflow: hidden;

      height: 205px;
      padding: 17px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f8f9f6;
      border-bottom: 1px solid #f0f1ed;
    }

    .product-image img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
      opacity: 1;

      transition: opacity .2s;
    }

    .product-image img.is-loading {
      opacity: 0;
    }

    .discount {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1;

      padding: 5px 7px;

      border-radius: 6px;
      background: var(--blue);
      color: #ffffff;

      font-size: 10px;
      font-weight: 800;
    }

    .product-info {
      min-width: 0;
      flex: 1;

      display: flex;
      flex-direction: column;

      padding: 14px;
    }

    .product-category {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .4px;
      text-transform: capitalize;
    }

    .product-title {
      min-height: 42px;
      margin: 7px 0 0;

      color: var(--ink);
      font-family: "Manrope", Arial, sans-serif;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.5;

      overflow-wrap: anywhere;
    }

    .product-description {
      min-height: 51px;
      margin: 6px 0 0;

      color: var(--muted);
      font-size: 11px;
      line-height: 1.65;

      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    .product-rating {
      display: flex;
      align-items: center;
      gap: 5px;

      margin-top: 10px;

      color: #53564f;
      font-size: 11px;
    }

    .product-rating i {
      color: #e7a500;
      font-size: 14px;
    }

    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;

      margin-top: auto;
      padding-top: 13px;
    }

    .product-price {
      min-width: 0;

      color: var(--ink);
      font-family: "Manrope", Arial, sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.35px;

      overflow-wrap: anywhere;
    }

    /* =====================================
       ADD TO CART - ICON ONLY
    ===================================== */

    .add-button {
      width: 38px;
      min-width: 38px;
      height: 36px;
      min-height: 36px;
      flex-shrink: 0;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 0;

      border: 1px solid var(--blue);
      border-radius: 9px;

      background: var(--blue);
      color: #ffffff;

      font-size: 19px;
      line-height: 1;

      transition:
        background .18s,
        border-color .18s;
    }

    .add-button:hover {
      background: var(--blue-dark);
      border-color: var(--blue-dark);
    }

    .add-button.added {
      background: #eaf7ef;
      border-color: #c7ead3;
      color: var(--green);
    }

    .add-button.added:hover {
      background: #d9f1e2;
      border-color: #b4e1c4;
    }

    .add-button:disabled {
      opacity: .65;
      cursor: wait;
    }

    /* =====================================
       SKELETON LOADING
    ===================================== */

    .skeleton {
      position: relative;
      overflow: hidden;
      border-radius: 7px;
      background: #edf0e9;
    }

    .skeleton::after {
      content: "";

      position: absolute;
      inset: 0;

      transform: translateX(-100%);

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, .8),
        transparent
      );

      animation: shimmer 1.35s infinite;
    }

    @keyframes shimmer {
      100% {
        transform: translateX(100%);
      }
    }

    .skeleton-card {
      cursor: default;
      pointer-events: none;
    }

    .skeleton-card:hover {
      transform: none;
      box-shadow: none;
    }

    .skeleton-image {
      height: 205px;
      border-radius: 0;
    }

    .skeleton-line {
      height: 10px;
      margin-top: 12px;
    }

    .skeleton-line.short {
      width: 35%;
    }

    .skeleton-line.medium {
      width: 65%;
    }

    .skeleton-line.long {
      width: 95%;
    }

    .skeleton-line.price {
      width: 38%;
      height: 17px;
    }

    .skeleton-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
    }

    .skeleton-circle {
      width: 38px;
      height: 36px;
      border-radius: 9px;
    }

    /* =====================================
       SEARCH RESULTS LIST VIEW
    ===================================== */

    .product-grid.list-view {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-grid.list-view .product-card {
      width: 100%;

      display: flex;
      flex-direction: row;
      align-items: stretch;

      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
    }

    .product-grid.list-view .product-card:hover {
      border-bottom-color: #cbd5f5;
      box-shadow: none;
      transform: none;
    }

    .product-grid.list-view .product-image {
      width: 155px;
      min-width: 155px;
      height: 155px;
      flex-shrink: 0;

      border: 0;
      border-radius: 10px;
    }

    .product-grid.list-view .product-info {
      min-width: 0;
      padding: 12px 15px;
      justify-content: center;
    }

    .product-grid.list-view .product-title,
    .product-grid.list-view .product-description {
      min-height: 0;
    }

    .product-grid.list-view .product-bottom {
      margin-top: 9px;
      padding-top: 0;
    }

    /* =====================================
       LOAD MORE
    ===================================== */

    .load-more-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 30px;
    }

    .load-more-button {
      min-width: 175px;
      min-height: 44px;
      padding: 12px 20px;

      border: 1px solid var(--blue);
      border-radius: 9px;

      background: var(--blue);
      color: #ffffff;

      font-size: 12px;
      font-weight: 700;

      transition:
        background .18s,
        border-color .18s;
    }

    .load-more-button:hover {
      background: var(--blue-dark);
      border-color: var(--blue-dark);
    }

    .load-more-button:disabled {
      opacity: .6;
      cursor: wait;
    }

    /* =====================================
       EMPTY / ERROR STATUS
    ===================================== */

    .status {
      grid-column: 1 / -1;
      width: 100%;
      padding: 35px 20px;

      border: 1px solid var(--line);
      border-radius: 12px;

      color: var(--muted);
      background: #ffffff;

      text-align: center;
      font-size: 13px;
      line-height: 1.8;
    }

    .status button {
      min-height: 40px;
      display: block;

      margin: 14px auto 0;
      padding: 10px 17px;

      border: 1px solid var(--blue);
      border-radius: 9px;

      background: var(--blue);
      color: #ffffff;

      font-size: 12px;
      font-weight: 700;
    }

    .status button:hover {
      background: var(--blue-dark);
    }

    /* =====================================
       TOAST
    ===================================== */

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      z-index: 2000;

      max-width: calc(100% - 32px);
      padding: 13px 18px;

      transform: translate(-50%, 20px);

      border: 1px solid var(--line);
      border-radius: 10px;

      background: #ffffff;
      color: var(--ink);

      box-shadow: 0 8px 30px rgba(20, 30, 55, .10);

      font-size: 12px;
      font-weight: 700;
      text-align: center;

      opacity: 0;
      pointer-events: none;

      transition:
        opacity .2s,
        transform .2s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =====================================
       FOOTER
    ===================================== */

    .footer {
      width: 100%;
      min-height: 65px;

      margin-top: 55px;
      padding: 22px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;

      border-top: 1px solid var(--line);
      background: #ffffff;

      color: var(--muted);
      font-size: 11px;
    }

    /* =====================================
       TABLET
    ===================================== */

    @media (max-width: 1050px) {
      .product-grid:not(.list-view) {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .product-image,
      .skeleton-image {
        height: 190px;
      }

      .hero-art {
        width: 180px;
        height: 180px;
      }
    }

    /* =====================================
       MOBILE
       Exactly 2 products per row
    ===================================== */

    @media (max-width: 700px) {
      :root {
        --header-h: 56px;
      }

      .navbar {
        height: var(--header-h);
        min-height: var(--header-h);
        max-height: var(--header-h);

        padding: 0 12px;
        gap: 8px;
      }

      .header-left {
        height: 100%;
        gap: 0;
      }

      .brand {
        height: 100%;
        font-size: 22px;
        letter-spacing: -.8px;
      }

      .nav-actions {
        height: 100%;
        gap: 5px;
      }

      .nav-icon {
        width: 38px;
        height: 38px;
        font-size: 24px;
      }

      .cart-count {
        top: 0;
        right: 0;
      }

      .search-bar-wrap {
        padding: 10px 12px;
      }

      .search {
        height: 42px;
        gap: 8px;
        padding: 0 12px;
      }

      .search > i {
        font-size: 18px;
      }

      .search input {
        font-size: 12px;
      }

      .hero-wrap {
        padding: 20px 12px 0;
      }

      .hero {
        min-height: 230px;
        padding: 25px 21px;
        gap: 12px;
        border-radius: 12px;
      }

      .eyebrow {
        margin-bottom: 11px;
        font-size: 9px;
        letter-spacing: .8px;
      }

      .hero h1 {
        font-size: 29px;
        letter-spacing: -1px;
      }

      .hero p {
        margin-top: 9px;
        font-size: 11px;
      }

      .hero-button {
        min-height: 39px;
        margin-top: 16px;
        padding: 10px 15px;
        font-size: 11px;
      }

      .hero-art {
        width: 100px;
        height: 100px;
      }

      .hero-art img {

      .add-button {

      .product-grid.list-view .product-card {

      }

      .product-grid.list-view .product-image {
        width: 105px;
        min-width: 105px;
        height: 130px;
        padding: 8px;
      }

      .product-grid.list-view .product-info {
        padding: 9px 10px;
      }

      .product-grid.list-view .product-title {
        min-height: 0;
        font-size: 12px;
      }

      .product-grid.list-view .product-description {
        min-height: 0;
        font-size: 10px;
        -webkit-line-clamp: 2;
      }

        min-width: 34px;
      }

        font-size: 10px;

    @media (max-width: 360px) {
      .navbar {
        padding: 0 8px;
        gap: 5px;
      }

      .brand {
        font-size: 20px;
      }

      .nav-actions {
        gap: 2px;
      }

      .nav-icon {
        width: 35px;
        height: 36px;
        font-size: 22px;
      }

      .search-bar-wrap {
        padding: 9px 8px;
      }

      .hero-art {
        display: none;
      }

      .hero h1 {
        font-size: 28px;
      }

      .container {
        padding: 0 8px;
      }

      .product-grid:not(.list-view) {
        gap: 9px;
      }

      .product-image,
      .skeleton-image {
        height: 125px;
      }

      .product-info {
        padding: 8px;
      }

      .product-title {
        font-size: 11px;
      }

      .product-description {
        font-size: 9px;
      }

      .product-price {
        font-size: 11px;
      }

      .add-button {
        width: 32px;
        min-width: 32px;
        height: 32px;
        min-height: 32px;
        padding: 0;

      }

      .product-grid.list-view .product-image {

        min-width: 88px;
        height: 120px;

      .product-grid.list-view .product-info {

    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition-duration: .01ms !important;
      }

      .skeleton::after {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!-- HOME TOOLBAR -->
  <header class="navbar">

    <div class="header-left">
      <a href="/home.html" class="brand" aria-label="Shoppy home">
        Shoppy.
      </a>
    </div>

    <nav class="nav-actions" aria-label="Main navigation">

      <a
        class="nav-icon"
        href="/home.html"
        aria-label="Home"
        title="Home"
      >
        <i class="ph ph-house" aria-hidden="true"></i>
      </a>

      <a
        class="nav-icon"
        href="/cart.html"
        aria-label="Cart"
        title="Shopping cart"
      >
        <i class="ph ph-shopping-cart" aria-hidden="true"></i>
        <span class="cart-count" id="cartCount" hidden>0</span>
      </a>

      <a
        class="nav-icon"
        href="/profile.html"
        aria-label="My profile"
        title="My profile"
      >
        <i class="ph ph-user-circle" aria-hidden="true"></i>
      </a>

    </nav>

  </header>

  <!-- SEARCH BAR BELOW TOOLBAR -->
  <div class="search-bar-wrap">
    <form class="search" id="searchForm" role="search">

      <i class="ph ph-magnifying-glass" aria-hidden="true"></i>

      <input
        id="searchInput"
        type="search"
        placeholder="Search products..."
        aria-label="Search products"
        autocomplete="off"
        maxlength="100"
      >

    </form>
  </div>

  <!-- HERO -->
  <section class="hero-wrap" id="heroWrap">

    <div class="hero">

      <div class="hero-copy">

        <div class="eyebrow">
          <i class="ph ph-sparkle" aria-hidden="true"></i>
          Welcome to Shoppy
        </div>

        <h1>Find your next favorite thing.</h1>

        <p>
          Explore everyday essentials, discover new arrivals and find
          products you'll love.
        </p>

        <button class="hero-button" id="shopNow" type="button">
          Explore Products
        </button>

      </div>

      <div class="hero-art" aria-hidden="true">
        <img
          src="https://i.ibb.co/93kQCKxT/20261019-120246.png"
          alt=""
        >
      </div>

    </div>

  </section>

  <!-- PRODUCTS -->
  <main class="container" id="productsSection">

    <div class="section-head" id="categoriesHeading">

      <div>
        <h2>Shop by Category</h2>
        <p>Find what you need, all in one place.</p>
      </div>

    </div>

    <div id="categories" class="categories">

      <button
        class="category-btn active"
        data-category=""
        type="button"
      >
        All Products
      </button>

    </div>

    <div class="section-head">

      <div>
        <h2 id="productsHeading">Popular Products</h2>
        <p id="productsSubtitle">Discover something you'll love.</p>
      </div>

      <span id="productCount" class="product-count"></span>

    </div>

    <div
      id="productGrid"
      class="product-grid"
      aria-live="polite"
      aria-busy="true"
    ></div>

    <div class="load-more-wrap">

      <button
        id="loadMoreButton"
        class="load-more-button"
        type="button"
        hidden
      >
        Load More Products
      </button>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <span>© <span id="year"></span> Shoppy</span>
    <span>Your shopping, all in one place.</span>
  </footer>

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>

  <script>
    "use strict";

    const productGrid = document.getElementById("productGrid");
    const categoriesEl = document.getElementById("categories");
    const categoriesHeading = document.getElementById("categoriesHeading");
    const productCount = document.getElementById("productCount");
    const productsHeading = document.getElementById("productsHeading");
    const productsSubtitle = document.getElementById("productsSubtitle");
    const searchInput = document.getElementById("searchInput");
    const searchForm = document.getElementById("searchForm");
    const heroWrap = document.getElementById("heroWrap");
    const loadMoreButton = document.getElementById("loadMoreButton");
    const toast = document.getElementById("toast");
    const actualCartCount = document.getElementById("cartCount");

    const PAGE_SIZE = 24;
    const CART_STORAGE_KEY = "shoppy_cart";
    const PRODUCT_ID_PATTERN = /^[A-Za-z0-9]{40}$/;

    let currentCategory = "";
    let currentSearch = "";
    let allProducts = [];
    let displayedCount = 0;
    let toastTimer = null;
    let requestController = null;
    let requestNumber = 0;
    let cartProductIds = new Set();
    let cartIsLoaded = false;

    document.getElementById("year").textContent =
      new Date().getFullYear();

    function isValidProductId(id) {
      return typeof id === "string" &&
        PRODUCT_ID_PATTERN.test(id);
    }

    function normalizeProductId(id) {
      const value = String(id ?? "");
      return isValidProductId(value) ? value : "";
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function formatPrice(price) {
      return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 2
      }).format(Number(price) || 0);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2400);
    }

    function readCart() {
      try {
        const stored = JSON.parse(
          localStorage.getItem(CART_STORAGE_KEY) || "[]"
        );

        return Array.isArray(stored) ? stored : [];
      } catch (error) {
        return [];
      }
    }

    function writeCart(items) {
      try {
        localStorage.setItem(
          CART_STORAGE_KEY,
          JSON.stringify(items)
        );
      } catch (error) {
        console.warn("Could not update local cart cache:", error);
      }
    }

    function updateLocalCartItem(item) {
      const id = normalizeProductId(item.id);

      if (!id) return;

      const cart = readCart();

      const index = cart.findIndex(entry =>
        normalizeProductId(entry.id) === id
      );

      const normalizedItem = { ...item, id };

      if (index >= 0) {
        cart[index] = {
          ...cart[index],
          ...normalizedItem
        };
      } else {
        cart.push(normalizedItem);
      }

      writeCart(cart);
    }

    function updateCartBadge(items) {
      const total = items.reduce(
        (sum, item) =>
          sum + Math.max(1, Number(item.quantity) || 1),
        0
      );

      actualCartCount.textContent =
        total > 99 ? "99+" : String(total);

      actualCartCount.hidden = total <= 0;
    }

    /*
     * Add to Cart uses an icon only.
     * No text is combined with the icon.
     */
    function updateCartButton(button, product) {
      const id = normalizeProductId(product.id);
      const isAdded = Boolean(id) && cartProductIds.has(id);

      button.classList.toggle("added", isAdded);

      button.innerHTML = isAdded
        ? '<i class="ph ph-check" aria-hidden="true"></i>'
        : '<i class="ph ph-shopping-cart" aria-hidden="true"></i>';

      button.setAttribute(
        "aria-label",
        isAdded
          ? `${product.title} is in your cart`
          : `Add ${product.title} to cart`
      );

      button.title = isAdded
        ? "Already in cart"
        : "Add to cart";
    }

    function refreshVisibleCartButtons() {
      productGrid.querySelectorAll(".add-button").forEach(button => {
        const buttonId =
          normalizeProductId(button.dataset.productId);

        if (!buttonId) return;

        const product = allProducts.find(item =>
          normalizeProductId(item.id) === buttonId
        );

        if (product) {
          updateCartButton(button, product);
        }
      });
    }

    async function loadCart() {
      try {
        const response = await fetch("/api/cart", {
          method: "GET",
          headers: {
            Accept: "application/json"
          },
          credentials: "same-origin",
          cache: "no-store"
        });

        const data = await response.json().catch(() => ({}));

        if (response.status === 401) {
          cartIsLoaded = false;
          cartProductIds = new Set();
          actualCartCount.hidden = true;

          refreshVisibleCartButtons();

          return false;
        }

        if (!response.ok || data.success !== true) {
          throw new Error(
            data.message || "Could not load cart."
          );
        }

        const items = Array.isArray(data.items)
          ? data.items
          : [];

        const validItems = items.filter(item =>
          isValidProductId(String(item.id))
        );

        cartProductIds = new Set(
          validItems.map(item => String(item.id))
        );

        writeCart(validItems);
        updateCartBadge(validItems);

        cartIsLoaded = true;

        refreshVisibleCartButtons();

        return true;

      } catch (error) {
        console.error("Cart loading error:", error);
        return false;
      }
    }

    async function addToCart(product, button) {
      if (button.disabled) return;

      const productId = normalizeProductId(product.id);

      if (!productId) {
        showToast(
          "Invalid product ID. Please refresh the page."
        );
        return;
      }

      if (!cartIsLoaded) {
        button.disabled = true;

        const loaded = await loadCart();

        button.disabled = false;

        if (!loaded) {
          showToast("Please login to save your cart.");
          window.location.href = "/login.html";
          return;
        }
      }

      if (cartProductIds.has(productId)) {
        updateCartButton(button, product);
        showToast("This product is already in your cart.");
        return;
      }

      button.disabled = true;

      try {
        const response = await fetch("/api/cart", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            Accept: "application/json"
          },

          credentials: "same-origin",

          body: JSON.stringify({
            id: productId,
            title: product.title,

            price: Number(
              product.originalPriceUSD ??
              product.price / 85
            ) || 0,

            thumbnail:
              product.thumbnail ||
              product.images?.[0] ||
              "",

            category: product.category || "other",
            quantity: 1
          })
        });

        const data = await response.json().catch(() => ({}));

        if (response.status === 401) {
          showToast("Please login to save your cart.");
          window.location.href = "/login.html";
          return;
        }

        if (!response.ok || data.success !== true) {
          throw new Error(
            data.message || "Product could not be added."
          );
        }

        const savedItem = data.item || {
          id: productId,
          title: product.title,

          price: Number(
            product.originalPriceUSD ??
            product.price / 85
          ) || 0,

          thumbnail:
            product.thumbnail ||
            product.images?.[0] ||
            "",

          category: product.category || "other",
          quantity: 1
        };

        const savedId = normalizeProductId(savedItem.id);

        if (!savedId || savedId !== productId) {
          throw new Error(
            "Server returned an invalid product ID."
          );
        }

        cartProductIds.add(productId);

        updateLocalCartItem({
          ...savedItem,
          id: productId
        });

        updateCartBadge(readCart());
        updateCartButton(button, product);

        showToast("Product added to cart!");

      } catch (error) {
        console.error("Add to cart error:", error);

        showToast(
          error.message ||
          "Cart save nahi hua. Dobara try karein."
        );

      } finally {
        button.disabled = false;
      }
    }

    function renderSkeletons(count = 8) {
      productGrid.setAttribute("aria-busy", "true");

      productGrid.innerHTML = Array.from(
        { length: count },
        () => `
          <article
            class="product-card skeleton-card"
            aria-hidden="true"
          >
            <div class="skeleton skeleton-image"></div>

            <div class="product-info">
              <div class="skeleton skeleton-line short"></div>
              <div class="skeleton skeleton-line long"></div>
              <div class="skeleton skeleton-line medium"></div>
              <div class="skeleton skeleton-line long"></div>
              <div class="skeleton skeleton-line medium"></div>

              <div class="skeleton-row">
                <div class="skeleton skeleton-line price"></div>
                <div class="skeleton skeleton-circle"></div>
              </div>
            </div>
          </article>
        `
      ).join("");
    }

    function showError(message) {
      productGrid.setAttribute("aria-busy", "false");
      productCount.textContent = "";
      loadMoreButton.hidden = true;

      productGrid.innerHTML = `
        <div class="status">
          ${escapeHTML(message)}

          <button type="button" id="retryButton">
            Try Again
          </button>
        </div>
      `;

      document
        .getElementById("retryButton")
        .addEventListener("click", loadProducts);
    }

    function createProductCard(product) {
      const id = normalizeProductId(product.id);

      if (!id) {
        console.error(
          "Skipping product with invalid 40-character ID:",
          product
        );

        return "";
      }

      const image =
        product.thumbnail ||
        product.images?.[0] ||
        "";

      const title = escapeHTML(product.title);
      const description = escapeHTML(product.description);
      const category = escapeHTML(product.category || "Other");

      const discount =
        Number(product.discountPercentage) || 0;

      const rating = Number(product.rating) || 0;
      const isAdded = cartProductIds.has(id);

      return `
        <article
          class="product-card"
          data-product-id="${id}"
          tabindex="0"
          aria-label="View details for ${title}"
        >
          <div class="product-image">

            ${
              discount > 0
                ? `
                  <span class="discount">
                    -${Math.round(discount)}%
                  </span>
                `
                : ""
            }

            <img
              class="is-loading"
              src="${escapeHTML(image)}"
              alt="${title}"
              loading="lazy"
              data-product-image
            >

          </div>

          <div class="product-info">

            <div class="product-category">
              ${category.replace(/-/g, " ")}
            </div>

            <h3 class="product-title">
              ${title}
            </h3>

            <p class="product-description">
              ${description}
            </p>

            <div class="product-rating">
              <i class="ph-fill ph-star" aria-hidden="true"></i>

              <span>
                ${rating ? rating.toFixed(1) : "No rating"}
              </span>
            </div>

            <div class="product-bottom">

              <span class="product-price">
                ${formatPrice(product.price)}
              </span>

              <button
                class="add-button ${isAdded ? "added" : ""}"
                type="button"
                aria-label="${
                  isAdded
                    ? `${title} is in your cart`
                    : `Add ${title} to cart`
                }"
                data-product-id="${id}"
                title="${
                  isAdded ? "Already in cart" : "Add to cart"
                }"
              >${
                isAdded
                  ? '<i class="ph ph-check" aria-hidden="true"></i>'
                  : '<i class="ph ph-shopping-cart" aria-hidden="true"></i>'
              }</button>

            </div>

          </div>
        </article>
      `;
    }

    function attachImageHandlers(container) {
      container
        .querySelectorAll("[data-product-image]")
        .forEach(img => {

          const finishLoading = () => {
            img.classList.remove("is-loading");
          };

          img.addEventListener(
            "load",
            finishLoading,
            { once: true }
          );

          img.addEventListener("error", () => {
            img.onerror = null;

            img.src =
              "https://placehold.co/400x400/f6f6f6/777?text=Product";

            finishLoading();

          }, { once: true });

          if (img.complete) {
            if (img.naturalWidth > 0) {
              finishLoading();
            } else {
              img.dispatchEvent(new Event("error"));
            }
          }
        });
    }

    function attachCartHandlers(container) {
      container.querySelectorAll(".add-button").forEach(button => {

        if (
          button.dataset.cartHandlerAttached === "true"
        ) {
          return;
        }

        button.dataset.cartHandlerAttached = "true";

        button.addEventListener("click", async event => {
          event.stopPropagation();

          const buttonId =
            normalizeProductId(button.dataset.productId);

          if (!buttonId) {
            showToast(
              "Invalid product ID. Please refresh the page."
            );

            return;
          }

          const product = allProducts.find(item =>
            normalizeProductId(item.id) === buttonId
          );

          if (product) {
            await addToCart(product, button);
          }
        });
      });
    }

    function updateProductCount() {
      const total = allProducts.length;
      const shown = Math.min(displayedCount, total);

      productCount.textContent =
        `${total} product${total === 1 ? "" : "s"}` +
        (shown < total ? ` · Showing ${shown}` : "");

      loadMoreButton.hidden =
        shown >= total || total === 0;

      loadMoreButton.disabled = false;

      loadMoreButton.textContent =
        "Load More Products";
    }

    function renderNextBatch() {
      const start = displayedCount;

      const end = Math.min(
        start + PAGE_SIZE,
        allProducts.length
      );

      if (start >= end) {
        updateProductCount();
        return;
      }

      productGrid.insertAdjacentHTML(
        "beforeend",
        allProducts
          .slice(start, end)
          .map(createProductCard)
          .join("")
      );

      displayedCount = end;

      attachCartHandlers(productGrid);
      attachImageHandlers(productGrid);

      updateProductCount();
    }

    function renderProducts(products) {
      allProducts = products;
      displayedCount = 0;

      productGrid.setAttribute("aria-busy", "false");
      productGrid.innerHTML = "";

      if (!products.length) {
        productCount.textContent = "";
        loadMoreButton.hidden = true;

        productGrid.innerHTML = `
          <div class="status">
            No products found. Try another search or category.
          </div>
        `;

        return;
      }

      renderNextBatch();
    }

    function renderCategories(products) {
      const categories = [
        ...new Set(
          products
            .map(product => product.category)
            .filter(Boolean)
        )
      ].sort();

      categoriesEl.innerHTML = `
        <button
          class="category-btn ${
            currentCategory ? "" : "active"
          }"
          data-category=""
          type="button"
        >
          All Products
        </button>

        ${categories.map(category => `
          <button
            class="category-btn ${
              currentCategory === category ? "active" : ""
            }"
            data-category="${escapeHTML(category)}"
            type="button"
          >
            ${escapeHTML(category.replace(/-/g, " "))}
          </button>
        `).join("")}
      `;

      categoriesEl
        .querySelectorAll(".category-btn")
        .forEach(button => {

          button.addEventListener("click", () => {
            currentCategory =
              button.dataset.category || "";

            currentSearch = "";
            searchInput.value = "";

            loadProducts();
          });
        });
    }

    function updatePageLayout() {
      const searching = Boolean(currentSearch);

      heroWrap.classList.toggle(
        "search-hidden",
        searching
      );

      productGrid.classList.toggle(
        "list-view",
        searching
      );

      categoriesHeading.hidden = searching;
      categoriesEl.hidden = searching;

      if (searching) {
        productsHeading.textContent = "Search Results";

        productsSubtitle.textContent =
          `Products matching "${currentSearch}"`;

      } else if (currentCategory) {
        productsHeading.textContent =
          currentCategory
            .replace(/-/g, " ")
            .replace(/\b\w/g, char => char.toUpperCase());

        productsSubtitle.textContent =
          "Explore products in this category.";

      } else {
        productsHeading.textContent = "Popular Products";

        productsSubtitle.textContent =
          "Discover something you'll love.";
      }
    }

    async function loadProducts() {
      if (requestController) {
        requestController.abort();
      }

      requestController = new AbortController();

      const signal = requestController.signal;
      const thisRequest = ++requestNumber;

      updatePageLayout();

      renderSkeletons(8);

      productCount.textContent = "";
      loadMoreButton.hidden = true;

      const params = new URLSearchParams();

      if (currentSearch) {
        params.set("search", currentSearch);
      }

      if (currentCategory) {
        params.set("category", currentCategory);
      }

      try {
        const response = await fetch(
          `/api/products?${params.toString()}`,
          {
            method: "GET",

            headers: {
              Accept: "application/json"
            },

            credentials: "same-origin",
            cache: "no-store",
            signal
          }
        );

        const contentType =
          response.headers.get("content-type") || "";

        if (!contentType.includes("application/json")) {
          throw new Error(
            `Products API response invalid hai (HTTP ${response.status}).`
          );
        }

        const data = await response.json();

        if (
          signal.aborted ||
          thisRequest !== requestNumber
        ) {
          return;
        }

        if (
          !response.ok ||
          data.success !== true ||
          !Array.isArray(data.products)
        ) {
          throw new Error(
            data.message ||
            `Products load nahi hue (HTTP ${response.status}).`
          );
        }

        if (!currentSearch && !currentCategory) {
          renderCategories(data.products);
        }

        renderProducts(data.products);

      } catch (error) {
        if (
          error.name === "AbortError" ||
          thisRequest !== requestNumber
        ) {
          return;
        }

        console.error("Products loading error:", error);

        showError(
          error.message ||
          "Products load nahi ho paaye. Dobara try karein."
        );
      }
    }

    productGrid.addEventListener("click", event => {
      if (event.target.closest(".add-button")) {
        return;
      }

      const card = event.target.closest(
        ".product-card[data-product-id]"
      );

      if (!card) return;

      const id = normalizeProductId(
        card.dataset.productId
      );

      if (id) {
        window.location.href =
          `/product.html?id=${encodeURIComponent(id)}`;
      }
    });

    productGrid.addEventListener("keydown", event => {
      if (
        event.key !== "Enter" &&
        event.key !== " "
      ) {
        return;
      }

      if (event.target.closest("button")) {
        return;
      }

      const card = event.target.closest(
        ".product-card[data-product-id]"
      );

      if (!card) return;

      event.preventDefault();

      const id = normalizeProductId(
        card.dataset.productId
      );

      if (id) {
        window.location.href =
          `/product.html?id=${encodeURIComponent(id)}`;
      }
    });

    loadMoreButton.addEventListener("click", () => {
      if (displayedCount >= allProducts.length) {
        loadMoreButton.hidden = true;
        return;
      }

      loadMoreButton.disabled = true;
      loadMoreButton.textContent = "Loading...";

      requestAnimationFrame(renderNextBatch);
    });

    searchForm.addEventListener("submit", event => {
      event.preventDefault();

      currentSearch = searchInput.value.trim();
      currentCategory = "";

      loadProducts();
    });

    function clearSearchIfEmpty() {
      if (
        !searchInput.value.trim() &&
        (currentSearch || currentCategory)
      ) {
        currentSearch = "";
        currentCategory = "";

        loadProducts();
      }
    }

    searchInput.addEventListener(
      "search",
      clearSearchIfEmpty
    );

    searchInput.addEventListener(
      "input",
      clearSearchIfEmpty
    );

    document
      .getElementById("shopNow")
      .addEventListener("click", () => {
        document
          .getElementById("productsSection")
          .scrollIntoView({
            behavior: "smooth"
          });
      });

    document.addEventListener(
      "visibilitychange",
      () => {
        if (!document.hidden) {
          loadCart();
        }
      }
    );

    window.addEventListener("pageshow", () => {
      loadCart();
    });

    async function initializeHomePage() {
      await loadCart();
      await loadProducts();
    }

    initializeHomePage();
  </script>

</body>
</html>
