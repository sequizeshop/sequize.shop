<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>Shoppy — Discover Products</title>

  <meta name="description" content="Discover products, explore categories and find your next favorite item at Shoppy.">

  <meta property="og:site_name" content="Shoppy">
  <meta property="og:title" content="Shoppy — Discover Products">
  <meta property="og:description" content="Discover products, explore categories and find your next favorite item at Shoppy.">

  <meta property="og:url" content="https://YOUR-DOMAIN/home.html">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Shoppy — Discover Products">
  <meta name="twitter:description" content="Discover products, explore categories and find your next favorite item at Shoppy.">
  <meta name="twitter:image" content="https://i.ibb.co/93kQCKxT/20261019-120246.png">

  <link rel="icon" type="image/png" href="https://i.ibb.co/93kQCKxT/20261019-120246.png">
  <link rel="apple-touch-icon" href="https://i.ibb.co/93kQCKxT/20261019-120246.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">

  <link rel="stylesheet" href="/global.css">

  <style>
    :root {
      /* Shoppy design tokens */
      --primary: #2962FF;
      --primary-hover: #0059D7;
      --primary-soft: #EDF2FF;
      --primary-selected: #F8FAFF;
      --background: #FFFFFF;
      --surface: #FFFFFF;
      --surface-secondary: #F5F5F2;
      --text-primary: #1E1F1C;
      --text-secondary: #666960;
      --text-muted: #969991;
      --border: #E5E7EB;
      --divider: #E5E7EB;
      --success: #15803D;
      --success-bg: #ECFDF3;
      --error: #DC2626;
      --disabled-bg: #E5E7EB;
      --disabled-text: #969991;
      --star: #E09A00;

      --font-body: "DM Sans", sans-serif;
      --font-heading: "Manrope", sans-serif;

      --radius-sm: 5px;
      --radius-md: 9px;
      --radius-lg: 12px;

      --header-h: 64px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.7;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    button:disabled {
      background: var(--disabled-bg);
      border-color: var(--disabled-bg);
      color: var(--disabled-text);
      cursor: not-allowed;
    }

    [hidden] {
      display: none !important;
    }

    /* =====================================
       HEADER
    ===================================== */

    .topbar {
      position: sticky;
      position: -webkit-sticky;
      top: 0;
      z-index: 1000;

      width: 100%;
      height: var(--header-h);
      min-height: var(--header-h);
      margin: 0;
      padding: 0 5%;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      background: var(--background);
      border-bottom: 1px solid var(--border);
      box-shadow: none;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-icon {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text-primary);
      font-size: 24px;
      line-height: 1;
    }

    .nav-icon:hover {
      background: var(--surface-secondary);
    }

    .nav-icon i {
      display: block;
      line-height: 1;
    }

    .cart-count {
      position: absolute;
      top: 0;
      right: 0;

      min-width: 18px;
      height: 18px;
      padding: 0 4px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 2px solid var(--background);
      border-radius: 999px;

      background: var(--primary);
      color: #ffffff;

      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    .brand {
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 800;
      line-height: 1.4;
      letter-spacing: -0.7px;
      color: var(--primary);
      white-space: nowrap;
    }

    /* =====================================
       SEARCH
    ===================================== */

    .search-bar-wrap {
      width: min(1050px, 90%);
      margin: 24px auto 0;
    }

    .search {
      width: 100%;
      height: 48px;
      margin: 0;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 0 15px;

      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);

      transition: border-color .18s, box-shadow .18s;
    }

    .search:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .search > i {
      flex-shrink: 0;
      color: var(--text-muted);
      font-size: 20px;
    }

    .search input {
      width: 100%;
      min-width: 0;
      height: 100%;
      padding: 0;

      border: 0;
      outline: 0;
      box-shadow: none;

      background: transparent;
      color: var(--text-primary);
      font-size: 14px;
    }

    .search input:focus {
      outline: 0;
      border: 0;
      box-shadow: none;
    }

    .search input::placeholder {
      color: var(--text-muted);
    }

    /* =====================================
       HERO
    ===================================== */

    .hero-wrap {
      width: min(1050px, 90%);
      margin: 28px auto 0;
    }

    .hero-wrap.search-hidden {
      display: none;
    }

    .hero {
      position: relative;
      overflow: hidden;

      width: 100%;
      min-height: 260px;
      padding: 34px 5%;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;

      border-radius: var(--radius-lg);
      background: var(--surface-secondary);
    }

    .hero-copy {
      max-width: 540px;
      min-width: 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;

      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .eyebrow i {
      font-size: 16px;
    }

    .hero h1 {
      max-width: 500px;
      margin: 0;

      color: var(--text-primary);
      font-family: var(--font-heading);
      font-size: clamp(27px, 4vw, 36px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -1.2px;
    }

    .hero p {
      max-width: 430px;
      margin: 8px 0 0;

      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.7;
    }

    .hero-button {
      min-height: 48px;
      margin-top: 24px;
      padding: 12px 24px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 1px solid var(--primary);
      border-radius: var(--radius-lg);

      background: var(--primary);
      color: #ffffff;

      font-size: 14px;
      font-weight: 700;

      transition: background .2s, border-color .2s;
    }

    .hero-button:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .hero-art {
      width: 180px;
      height: 180px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: var(--surface);
    }

    .hero-art img {
      width: 78%;
      height: 78%;
      object-fit: contain;
    }

    /* =====================================
       MAIN CONTAINER
    ===================================== */

    .container {
      width: min(1050px, 90%);
      max-width: 1050px;
      margin: 34px auto 65px;
      padding: 0;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .section-head h2 {
      margin: 0;

      color: var(--text-primary);
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: -.7px;
    }

    .section-head p {
      margin: 2px 0 0;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.7;
    }

    .product-count {
      padding-bottom: 2px;
      color: var(--text-secondary);
      font-size: 13px;
      white-space: nowrap;
    }

    /* =====================================
       CATEGORIES
    ===================================== */

    .categories {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 27px;
    }

    .category-btn {
      min-height: 38px;
      padding: 8px 16px;

      border: 1px solid var(--border);
      border-radius: 999px;

      background: var(--surface);
      color: var(--text-secondary);

      font-size: 13px;
      font-weight: 600;
      text-transform: capitalize;

      transition: color .2s, background .2s, border-color .2s;
    }

    .category-btn:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .category-btn.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
    }

    /* =====================================
       PRODUCT GRID (no outer cards)
    ===================================== */

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: stretch;
      gap: 24px 18px;
    }

    .product-card {
      min-width: 0;

      display: flex;
      flex-direction: column;

      background: transparent;
      cursor: pointer;
    }

    .product-image {
      position: relative;
      overflow: hidden;

      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: var(--radius-md);
      background: var(--surface-secondary);

      transition: background .2s;
    }

    .product-card:hover .product-image {
      background: var(--primary-selected);
    }

    .product-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 1;
      transition: opacity .2s;
    }

    .product-image img.is-loading {
      opacity: 0;
    }

    .discount {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1;

      padding: 2px 8px;

      border-radius: var(--radius-sm);
      background: var(--success-bg);
      color: var(--success);

      font-size: 12px;
      font-weight: 700;
    }

    .product-info {
      min-width: 0;
      flex: 1;

      display: flex;
      flex-direction: column;

      padding: 12px 0 0;
    }

    .product-category {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: capitalize;
    }

    .product-title {
      min-height: 42px;
      margin: 2px 0 0;

      color: var(--text-primary);
      font-family: var(--font-heading);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;

      overflow-wrap: anywhere;
    }

    .product-card:hover .product-title {
      color: var(--primary);
    }

    .product-description {
      min-height: 48px;
      margin: 4px 0 0;

      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.6;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    .product-rating {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;

      color: var(--text-secondary);
      font-size: 13px;
    }

    .product-rating i {
      color: var(--star);
      font-size: 14px;
    }

    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;

      margin-top: auto;
      padding-top: 12px;
    }

    .product-price {
      min-width: 0;

      color: var(--text-primary);
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.35px;

      overflow-wrap: anywhere;
    }

    /* =====================================
       ADD TO CART (text only)
    ===================================== */

    .add-button {
      min-width: 56px;
      height: 36px;
      flex-shrink: 0;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 0 14px;

      border: 1px solid var(--primary);
      border-radius: var(--radius-lg);

      background: var(--primary);
      color: #ffffff;

      font-size: 13px;
      font-weight: 700;
      line-height: 1;

      transition: background .2s, border-color .2s;
    }

    .add-button:hover:not(:disabled) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .add-button.added {
      background: var(--success-bg);
      border-color: var(--success-bg);
      color: var(--success);
    }

    .add-button.added:hover:not(:disabled) {
      background: var(--success-bg);
      border-color: var(--success);
    }

    .add-button:disabled {
      cursor: wait;
    }

    /* =====================================
       SKELETON
    ===================================== */

    .skeleton {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-sm);
      background: var(--surface-secondary);
    }

    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.8), transparent);
      animation: shimmer 1.35s infinite;
    }

    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }

    .skeleton-card {
      cursor: default;
      pointer-events: none;
    }

    .skeleton-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-md);
    }

    .skeleton-line {
      height: 10px;
      margin-top: 12px;
    }

    .skeleton-line.short { width: 35%; }
    .skeleton-line.medium { width: 65%; }
    .skeleton-line.long { width: 95%; }
    .skeleton-line.price { width: 38%; height: 17px; }

    .skeleton-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
    }

    .skeleton-circle {
      width: 56px;
      height: 36px;
      border-radius: var(--radius-lg);
    }

    /* =====================================
       SEARCH RESULTS LIST VIEW (dividers)
    ===================================== */

    .product-grid.list-view {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .product-grid.list-view .product-card {
      width: 100%;
      flex-direction: row;
      align-items: stretch;
      gap: 15px;

      padding: 15px 0;
      border-bottom: 1px solid var(--divider);
    }

    .product-grid.list-view .product-card:first-child {
      padding-top: 0;
    }

    .product-grid.list-view .product-card:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .product-grid.list-view .product-image {
      width: 140px;
      min-width: 140px;
      height: 140px;
      aspect-ratio: auto;
      flex-shrink: 0;
    }

    .product-grid.list-view .product-info {
      padding: 0;
      justify-content: center;
    }

    .product-grid.list-view .product-title,
    .product-grid.list-view .product-description {
      min-height: 0;
    }

    .product-grid.list-view .product-bottom {
      margin-top: 8px;
      padding-top: 0;
    }

    /* =====================================
       LOAD MORE
    ===================================== */

    .load-more-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 28px;
    }

    .load-more-button {
      min-width: 190px;
      min-height: 48px;
      padding: 12px 24px;

      border: 1px solid var(--primary);
      border-radius: var(--radius-lg);

      background: var(--primary);
      color: #ffffff;

      font-size: 14px;
      font-weight: 700;

      transition: background .2s, border-color .2s;
    }

    .load-more-button:hover:not(:disabled) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .load-more-button:disabled {
      cursor: wait;
    }

    /* =====================================
       STATUS
    ===================================== */

    .status {
      grid-column: 1 / -1;
      width: 100%;
      padding: 40px 0;

      color: var(--text-secondary);
      background: transparent;

      text-align: center;
      font-size: 14px;
      line-height: 1.7;
    }

    .status button {
      min-height: 48px;
      display: block;

      margin: 18px auto 0;
      padding: 12px 24px;

      border: 1px solid var(--primary);
      border-radius: var(--radius-lg);

      background: var(--primary);
      color: #ffffff;

      font-size: 14px;
      font-weight: 700;
    }

    .status button:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    /* =====================================
       TOAST
    ===================================== */

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      z-index: 2000;

      max-width: calc(100% - 30px);
      padding: 12px 18px;

      transform: translate(-50%, 15px);

      border-radius: var(--radius-lg);

      background: var(--text-primary);
      color: #ffffff;

      font-size: 13px;
      font-weight: 600;
      text-align: center;

      opacity: 0;
      pointer-events: none;

      transition: opacity .2s, transform .2s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =====================================
       FOOTER
    ===================================== */

    .footer {
      width: 100%;
      margin-top: 0;
      padding: 24px 5%;

      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;

      border-top: 1px solid var(--divider);
      background: var(--background);

      color: var(--text-muted);
      font-size: 12px;
    }

    /* =====================================
       RESPONSIVE
    ===================================== */

    @media (max-width: 1050px) {
      .product-grid:not(.list-view) {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .search-bar-wrap,
      .hero-wrap,
      .container {
        width: 90%;
      }

      .search-bar-wrap {
        margin-top: 20px;
      }

      .search {
        height: 44px;
      }

      .hero-wrap {
        margin-top: 25px;
      }

      .hero {
        min-height: 0;
        padding: 26px 22px;
        gap: 12px;
      }

      .hero h1 {
        font-size: 29px;
      }

      .hero-art {
        width: 100px;
        height: 100px;
      }

      .hero-art img {
        width: 84%;
        height: 84%;
      }

      .container {
        margin: 25px auto 65px;
      }

      .section-head h2 {
        font-size: 21px;
      }

      .product-grid:not(.list-view) {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px 12px;
      }

      .product-image {
        padding: 10px;
      }

      .product-title {
        min-height: 40px;
        font-size: 13px;
      }

      .product-description {
        font-size: 12px;
        min-height: 44px;
      }

      .product-price {
        font-size: clamp(13px, 3.6vw, 15px);
      }

      .add-button {
        min-width: 48px;
        padding: 0 10px;
        font-size: 12px;
      }

      .product-grid.list-view .product-image {
        width: 105px;
        min-width: 105px;
        height: 130px;
        padding: 8px;
      }

      .product-grid.list-view .product-description {
        -webkit-line-clamp: 2;
      }
    }

    @media (max-width: 380px) {
      .hero-art {
        display: none;
      }

      .product-grid:not(.list-view) {
        gap: 20px 9px;
      }

      .product-info {
        padding-top: 10px;
      }

      .product-title {
        font-size: 12px;
      }

      .product-grid.list-view .product-image {
        width: 88px;
        min-width: 88px;
        height: 120px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition-duration: .01ms !important;
      }

      .skeleton::after {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="topbar">

    <nav class="nav-actions" aria-label="Main navigation">

      <a
        class="nav-icon"
        href="/home.html"
        aria-label="Home"
        title="Home"
      >
        <i class="ph ph-house" aria-hidden="true"></i>
      </a>

      <a
        class="nav-icon"
        href="/cart.html"
        aria-label="Cart"
        title="Shopping cart"
      >
        <i class="ph ph-shopping-cart" aria-hidden="true"></i>
        <span class="cart-count" id="cartCount" hidden>0</span>
      </a>

      <a
        class="nav-icon"
        href="/profile.html"
        aria-label="My profile"
        title="My profile"
      >
        <i class="ph ph-user-circle" aria-hidden="true"></i>
      </a>

    </nav>

    <a href="/home.html" class="brand" aria-label="Shoppy home">
      Shoppy.
    </a>

  </header>

  <!-- SEARCH BAR -->
  <div class="search-bar-wrap">
    <form class="search" id="searchForm" role="search">

      <i class="ph ph-magnifying-glass" aria-hidden="true"></i>

      <input
        id="searchInput"
        type="search"
        placeholder="Search products..."
        aria-label="Search products"
        autocomplete="off"
        maxlength="100"
      >

    </form>
  </div>

  <!-- HERO -->
  <section class="hero-wrap" id="heroWrap">

    <div class="hero">

      <div class="hero-copy">

        <div class="eyebrow">
          <i class="ph ph-sparkle" aria-hidden="true"></i>
          Welcome to Shoppy
        </div>

        <h1>Find your next favorite thing.</h1>

        <p>
          Explore everyday essentials, discover new arrivals and find
          products you'll love.
        </p>

        <button class="hero-button" id="shopNow" type="button">
          Explore Products
        </button>

      </div>

      <div class="hero-art" aria-hidden="true">
        <img
          src="https://i.ibb.co/93kQCKxT/20261019-120246.png"
          alt=""
        >
      </div>

    </div>

  </section>

  <!-- PRODUCTS -->
  <main class="container" id="productsSection">

    <div class="section-head" id="categoriesHeading">

      <div>
        <h2>Shop by Category</h2>
        <p>Find what you need, all in one place.</p>
      </div>

    </div>

    <div id="categories" class="categories">

      <button
        class="category-btn active"
        data-category=""
        type="button"
      >
        All Products
      </button>

    </div>

    <div class="section-head">

      <div>
        <h2 id="productsHeading">Popular Products</h2>
        <p id="productsSubtitle">Discover something you'll love.</p>
      </div>

      <span id="productCount" class="product-count"></span>

    </div>

    <div
      id="productGrid"
      class="product-grid"
      aria-live="polite"
      aria-busy="true"
    ></div>

    <div class="load-more-wrap">

      <button
        id="loadMoreButton"
        class="load-more-button"
        type="button"
        hidden
      >
        Load More Products
      </button>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <span>© <span id="year"></span> Shoppy</span>
    <span>Your shopping, all in one place.</span>
  </footer>

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>

  <script>
    "use strict";

    const productGrid = document.getElementById("productGrid");
    const categoriesEl = document.getElementById("categories");
    const categoriesHeading = document.getElementById("categoriesHeading");
    const productCount = document.getElementById("productCount");
    const productsHeading = document.getElementById("productsHeading");
    const productsSubtitle = document.getElementById("productsSubtitle");
    const searchInput = document.getElementById("searchInput");
    const searchForm = document.getElementById("searchForm");
    const heroWrap = document.getElementById("heroWrap");
    const loadMoreButton = document.getElementById("loadMoreButton");
    const toast = document.getElementById("toast");
    const actualCartCount = document.getElementById("cartCount");

    const PAGE_SIZE = 24;
    const CART_STORAGE_KEY = "shoppy_cart";
    const PRODUCT_ID_PATTERN = /^[A-Za-z0-9]{40}$/;

    let currentCategory = "";
    let currentSearch = "";
    let allProducts = [];
    let displayedCount = 0;
    let toastTimer = null;
    let requestController = null;
    let requestNumber = 0;
    let cartProductIds = new Set();
    let cartIsLoaded = false;

    document.getElementById("year").textContent =
      new Date().getFullYear();

    function isValidProductId(id) {
      return typeof id === "string" &&
        PRODUCT_ID_PATTERN.test(id);
    }

    function normalizeProductId(id) {
      const value = String(id ?? "");
      return isValidProductId(value) ? value : "";
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function formatPrice(price) {
      return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 2
      }).format(Number(price) || 0);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2400);
    }

    function readCart() {
      try {
        const stored = JSON.parse(
          localStorage.getItem(CART_STORAGE_KEY) || "[]"
        );

        return Array.isArray(stored) ? stored : [];
      } catch (error) {
        return [];
      }
    }

    function writeCart(items) {
      try {
        localStorage.setItem(
          CART_STORAGE_KEY,
          JSON.stringify(items)
        );
      } catch (error) {
        console.warn("Could not update local cart cache:", error);
      }
    }

    function updateLocalCartItem(item) {
      const id = normalizeProductId(item.id);

      if (!id) return;

      const cart = readCart();

      const index = cart.findIndex(entry =>
        normalizeProductId(entry.id) === id
      );

      const normalizedItem = { ...item, id };

      if (index >= 0) {
        cart[index] = {
          ...cart[index],
          ...normalizedItem
        };
      } else {
        cart.push(normalizedItem);
      }

      writeCart(cart);
    }

    function updateCartBadge(items) {
      const total = items.reduce(
        (sum, item) =>
          sum + Math.max(1, Number(item.quantity) || 1),
        0
      );

      actualCartCount.textContent =
        total > 99 ? "99+" : String(total);

      actualCartCount.hidden = total <= 0;
    }

    /*
     * Add to Cart is a text-only button.
     */
    function updateCartButton(button, product) {
      const id = normalizeProductId(product.id);
      const isAdded = Boolean(id) && cartProductIds.has(id);

      button.classList.toggle("added", isAdded);

      button.textContent = isAdded ? "Added" : "Add";

      button.setAttribute(
        "aria-label",
        isAdded
          ? `${product.title} is in your cart`
          : `Add ${product.title} to cart`
      );

      button.title = isAdded
        ? "Already in cart"
        : "Add to cart";
    }

    function refreshVisibleCartButtons() {
      productGrid.querySelectorAll(".add-button").forEach(button => {
        const buttonId =
          normalizeProductId(button.dataset.productId);

        if (!buttonId) return;

        const product = allProducts.find(item =>
          normalizeProductId(item.id) === buttonId
        );

        if (product) {
          updateCartButton(button, product);
        }
      });
    }

    async function loadCart() {
      try {
        const response = await fetch("/api/cart", {
          method: "GET",
          headers: {
            Accept: "application/json"
          },
          credentials: "same-origin",
          cache: "no-store"
        });

        const data = await response.json().catch(() => ({}));

        if (response.status === 401) {
          cartIsLoaded = false;
          cartProductIds = new Set();
          actualCartCount.hidden = true;

          refreshVisibleCartButtons();

          return false;
        }

        if (!response.ok || data.success !== true) {
          throw new Error(
            data.message || "Could not load cart."
          );
        }

        const items = Array.isArray(data.items)
          ? data.items
          : [];

        const validItems = items.filter(item =>
          isValidProductId(String(item.id))
        );

        cartProductIds = new Set(
          validItems.map(item => String(item.id))
        );

        writeCart(validItems);
        updateCartBadge(validItems);

        cartIsLoaded = true;

        refreshVisibleCartButtons();

        return true;

      } catch (error) {
        console.error("Cart loading error:", error);
        return false;
      }
    }

    async function addToCart(product, button) {
      if (button.disabled) return;

      const productId = normalizeProductId(product.id);

      if (!productId) {
        showToast(
          "Invalid product ID. Please refresh the page."
        );
        return;
      }

      if (!cartIsLoaded) {
        button.disabled = true;

        const loaded = await loadCart();

        button.disabled = false;

        if (!loaded) {
          showToast("Please login to save your cart.");
          window.location.href = "/login.html";
          return;
        }
      }

      if (cartProductIds.has(productId)) {
        updateCartButton(button, product);
        showToast("This product is already in your cart.");
        return;
      }

      button.disabled = true;

      try {
        const response = await fetch("/api/cart", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            Accept: "application/json"
          },

          credentials: "same-origin",

          body: JSON.stringify({
            id: productId,
            title: product.title,

            price: Number(
              product.originalPriceUSD ??
              product.price / 85
            ) || 0,

            thumbnail:
              product.thumbnail ||
              product.images?.[0] ||
              "",

            category: product.category || "other",
            quantity: 1
          })
        });

        const data = await response.json().catch(() => ({}));

        if (response.status === 401) {
          showToast("Please login to save your cart.");
          window.location.href = "/login.html";
          return;
        }

        if (!response.ok || data.success !== true) {
          throw new Error(
            data.message || "Product could not be added."
          );
        }

        const savedItem = data.item || {
          id: productId,
          title: product.title,

          price: Number(
            product.originalPriceUSD ??
            product.price / 85
          ) || 0,

          thumbnail:
            product.thumbnail ||
            product.images?.[0] ||
            "",

          category: product.category || "other",
          quantity: 1
        };

        const savedId = normalizeProductId(savedItem.id);

        if (!savedId || savedId !== productId) {
          throw new Error(
            "Server returned an invalid product ID."
          );
        }

        cartProductIds.add(productId);

        updateLocalCartItem({
          ...savedItem,
          id: productId
        });

        updateCartBadge(readCart());
        updateCartButton(button, product);

        showToast("Product added to cart!");

      } catch (error) {
        console.error("Add to cart error:", error);

        showToast(
          error.message ||
          "Cart save nahi hua. Dobara try karein."
        );

      } finally {
        button.disabled = false;
      }
    }

    function renderSkeletons(count = 8) {
      productGrid.setAttribute("aria-busy", "true");

      productGrid.innerHTML = Array.from(
        { length: count },
        () => `
          <article
            class="product-card skeleton-card"
            aria-hidden="true"
          >
            <div class="skeleton skeleton-image"></div>

            <div class="product-info">
              <div class="skeleton skeleton-line short"></div>
              <div class="skeleton skeleton-line long"></div>
              <div class="skeleton skeleton-line medium"></div>
              <div class="skeleton skeleton-line long"></div>
              <div class="skeleton skeleton-line medium"></div>

              <div class="skeleton-row">
                <div class="skeleton skeleton-line price"></div>
                <div class="skeleton skeleton-circle"></div>
              </div>
            </div>
          </article>
        `
      ).join("");
    }

    function showError(message) {
      productGrid.setAttribute("aria-busy", "false");
      productCount.textContent = "";
      loadMoreButton.hidden = true;

      productGrid.innerHTML = `
        <div class="status">
          ${escapeHTML(message)}

          <button type="button" id="retryButton">
            Try Again
          </button>
        </div>
      `;

      document
        .getElementById("retryButton")
        .addEventListener("click", loadProducts);
    }

    function createProductCard(product) {
      const id = normalizeProductId(product.id);

      if (!id) {
        console.error(
          "Skipping product with invalid 40-character ID:",
          product
        );

        return "";
      }

      const image =
        product.thumbnail ||
        product.images?.[0] ||
        "";

      const title = escapeHTML(product.title);
      const description = escapeHTML(product.description);
      const category = escapeHTML(product.category || "Other");

      const discount =
        Number(product.discountPercentage) || 0;

      const rating = Number(product.rating) || 0;
      const isAdded = cartProductIds.has(id);

      return `
        <article
          class="product-card"
          data-product-id="${id}"
          tabindex="0"
          aria-label="View details for ${title}"
        >
          <div class="product-image">

            ${
              discount > 0
                ? `
                  <span class="discount">
                    -${Math.round(discount)}%
                  </span>
                `
                : ""
            }

            <img
              class="is-loading"
              src="${escapeHTML(image)}"
              alt="${title}"
              loading="lazy"
              data-product-image
            >

          </div>

          <div class="product-info">

            <div class="product-category">
              ${category.replace(/-/g, " ")}
            </div>

            <h3 class="product-title">
              ${title}
            </h3>

            <p class="product-description">
              ${description}
            </p>

            <div class="product-rating">
              <i class="ph-fill ph-star" aria-hidden="true"></i>

              <span>
                ${rating ? rating.toFixed(1) : "No rating"}
              </span>
            </div>

            <div class="product-bottom">

              <span class="product-price">
                ${formatPrice(product.price)}
              </span>

              <button
                class="add-button ${isAdded ? "added" : ""}"
                type="button"
                aria-label="${
                  isAdded
                    ? `${title} is in your cart`
                    : `Add ${title} to cart`
                }"
                data-product-id="${id}"
                title="${
                  isAdded ? "Already in cart" : "Add to cart"
                }"
              >${isAdded ? "Added" : "Add"}</button>

            </div>

          </div>
        </article>
      `;
    }

    function attachImageHandlers(container) {
      container
        .querySelectorAll("[data-product-image]")
        .forEach(img => {

          const finishLoading = () => {
            img.classList.remove("is-loading");
          };

          img.addEventListener(
            "load",
            finishLoading,
            { once: true }
          );

          img.addEventListener("error", () => {
            img.onerror = null;

            img.src =
              "https://placehold.co/400x400/f5f5f2/969991?text=Product";

            finishLoading();

          }, { once: true });

          if (img.complete) {
            if (img.naturalWidth > 0) {
              finishLoading();
            } else {
              img.dispatchEvent(new Event("error"));
            }
          }
        });
    }

    function attachCartHandlers(container) {
      container.querySelectorAll(".add-button").forEach(button => {

        if (
          button.dataset.cartHandlerAttached === "true"
        ) {
          return;
        }

        button.dataset.cartHandlerAttached = "true";

        button.addEventListener("click", async event => {
          event.stopPropagation();

          const buttonId =
            normalizeProductId(button.dataset.productId);

          if (!buttonId) {
            showToast(
              "Invalid product ID. Please refresh the page."
            );

            return;
          }

          const product = allProducts.find(item =>
            normalizeProductId(item.id) === buttonId
          );

          if (product) {
            await addToCart(product, button);
          }
        });
      });
    }

    function updateProductCount() {
      const total = allProducts.length;
      const shown = Math.min(displayedCount, total);

      productCount.textContent =
        `${total} product${total === 1 ? "" : "s"}` +
        (shown < total ? ` · Showing ${shown}` : "");

      loadMoreButton.hidden =
        shown >= total || total === 0;

      loadMoreButton.disabled = false;

      loadMoreButton.textContent =
        "Load More Products";
    }

    function renderNextBatch() {
      const start = displayedCount;

      const end = Math.min(
        start + PAGE_SIZE,
        allProducts.length
      );

      if (start >= end) {
        updateProductCount();
        return;
      }

      productGrid.insertAdjacentHTML(
        "beforeend",
        allProducts
          .slice(start, end)
          .map(createProductCard)
          .join("")
      );

      displayedCount = end;

      attachCartHandlers(productGrid);
      attachImageHandlers(productGrid);

      updateProductCount();
    }

    function renderProducts(products) {
      allProducts = products;
      displayedCount = 0;

      productGrid.setAttribute("aria-busy", "false");
      productGrid.innerHTML = "";

      if (!products.length) {
        productCount.textContent = "";
        loadMoreButton.hidden = true;

        productGrid.innerHTML = `
          <div class="status">
            No products found. Try another search or category.
          </div>
        `;

        return;
      }

      renderNextBatch();
    }

    function renderCategories(products) {
      const categories = [
        ...new Set(
          products
            .map(product => product.category)
            .filter(Boolean)
        )
      ].sort();

      categoriesEl.innerHTML = `
        <button
          class="category-btn ${
            currentCategory ? "" : "active"
          }"
          data-category=""
          type="button"
        >
          All Products
        </button>

        ${categories.map(category => `
          <button
            class="category-btn ${
              currentCategory === category ? "active" : ""
            }"
            data-category="${escapeHTML(category)}"
            type="button"
          >
            ${escapeHTML(category.replace(/-/g, " "))}
          </button>
        `).join("")}
      `;

      categoriesEl
        .querySelectorAll(".category-btn")
        .forEach(button => {

          button.addEventListener("click", () => {
            currentCategory =
              button.dataset.category || "";

            currentSearch = "";
            searchInput.value = "";

            loadProducts();
          });
        });
    }

    function updatePageLayout() {
      const searching = Boolean(currentSearch);

      heroWrap.classList.toggle(
        "search-hidden",
        searching
      );

      productGrid.classList.toggle(
        "list-view",
        searching
      );

      categoriesHeading.hidden = searching;
      categoriesEl.hidden = searching;

      if (searching) {
        productsHeading.textContent = "Search Results";

        productsSubtitle.textContent =
          `Products matching "${currentSearch}"`;

      } else if (currentCategory) {
        productsHeading.textContent =
          currentCategory
            .replace(/-/g, " ")
            .replace(/\b\w/g, char => char.toUpperCase());

        productsSubtitle.textContent =
          "Explore products in this category.";

      } else {
        productsHeading.textContent = "Popular Products";

        productsSubtitle.textContent =
          "Discover something you'll love.";
      }
    }

    async function loadProducts() {
      if (requestController) {
        requestController.abort();
      }

      requestController = new AbortController();

      const signal = requestController.signal;
      const thisRequest = ++requestNumber;

      updatePageLayout();

      renderSkeletons(8);

      productCount.textContent = "";
      loadMoreButton.hidden = true;

      const params = new URLSearchParams();

      if (currentSearch) {
        params.set("search", currentSearch);
      }

      if (currentCategory) {
        params.set("category", currentCategory);
      }

      try {
        const response = await fetch(
          `/api/products?${params.toString()}`,
          {
            method: "GET",

            headers: {
              Accept: "application/json"
            },

            credentials: "same-origin",
            cache: "no-store",
            signal
          }
        );

        const contentType =
          response.headers.get("content-type") || "";

        if (!contentType.includes("application/json")) {
          throw new Error(
            `Products API response invalid hai (HTTP ${response.status}).`
          );
        }

        const data = await response.json();

        if (
          signal.aborted ||
          thisRequest !== requestNumber
        ) {
          return;
        }

        if (
          !response.ok ||
          data.success !== true ||
          !Array.isArray(data.products)
        ) {
          throw new Error(
            data.message ||
            `Products load nahi hue (HTTP ${response.status}).`
          );
        }

        if (!currentSearch && !currentCategory) {
          renderCategories(data.products);
        }

        renderProducts(data.products);

      } catch (error) {
        if (
          error.name === "AbortError" ||
          thisRequest !== requestNumber
        ) {
          return;
        }

        console.error("Products loading error:", error);

        showError(
          error.message ||
          "Products load nahi ho paaye. Dobara try karein."
        );
      }
    }

    productGrid.addEventListener("click", event => {
      if (event.target.closest(".add-button")) {
        return;
      }

      const card = event.target.closest(
        ".product-card[data-product-id]"
      );

      if (!card) return;

      const id = normalizeProductId(
        card.dataset.productId
      );

      if (id) {
        window.location.href =
          `/product.html?id=${encodeURIComponent(id)}`;
      }
    });

    productGrid.addEventListener("keydown", event => {
      if (
        event.key !== "Enter" &&
        event.key !== " "
      ) {
        return;
      }

      if (event.target.closest("button")) {
        return;
      }

      const card = event.target.closest(
        ".product-card[data-product-id]"
      );

      if (!card) return;

      event.preventDefault();

      const id = normalizeProductId(
        card.dataset.productId
      );

      if (id) {
        window.location.href =
          `/product.html?id=${encodeURIComponent(id)}`;
      }
    });

    loadMoreButton.addEventListener("click", () => {
      if (displayedCount >= allProducts.length) {
        loadMoreButton.hidden = true;
        return;
      }

      loadMoreButton.disabled = true;
      loadMoreButton.textContent = "Loading...";

      requestAnimationFrame(renderNextBatch);
    });

    searchForm.addEventListener("submit", event => {
      event.preventDefault();

      currentSearch = searchInput.value.trim();
      currentCategory = "";

      loadProducts();
    });

    function clearSearchIfEmpty() {
      if (
        !searchInput.value.trim() &&
        (currentSearch || currentCategory)
      ) {
        currentSearch = "";
        currentCategory = "";

        loadProducts();
      }
    }

    searchInput.addEventListener(
      "search",
      clearSearchIfEmpty
    );

    searchInput.addEventListener(
      "input",
      clearSearchIfEmpty
    );

    document
      .getElementById("shopNow")
      .addEventListener("click", () => {
        document
          .getElementById("productsSection")
          .scrollIntoView({
            behavior: "smooth"
          });
      });

    document.addEventListener(
      "visibilitychange",
      () => {
        if (!document.hidden) {
          loadCart();
        }
      }
    );

    window.addEventListener("pageshow", () => {
      loadCart();
    });

    async function initializeHomePage() {
      await loadCart();
      await loadProducts();
    }

    initializeHomePage();
  </script>

</body>
</html>
