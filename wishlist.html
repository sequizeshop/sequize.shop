
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>My Wishlist — Shoppy</title>
  <meta name="description" content="View and manage your favorite products on Shoppy.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://shopingweb-zeta.vercel.app/wishlist.html">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Shoppy">
  <meta property="og:title" content="My Wishlist — Shoppy">
  <meta property="og:description" content="Your favorite products, all in one place.">
  <meta property="og:url" content="https://shopingweb-zeta.vercel.app/wishlist.html">
  <meta property="og:image" content="https://i.ibb.co/93kQCKxT/20261019-120246.png">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="My Wishlist — Shoppy">
  <meta name="twitter:description" content="Your favorite products, all in one place.">
  <meta name="twitter:image" content="https://i.ibb.co/93kQCKxT/20261019-120246.png">

  <link rel="icon" type="image/png" href="https://i.ibb.co/93kQCKxT/20261019-120246.png">
  <link rel="apple-touch-icon" href="https://i.ibb.co/93kQCKxT/20261019-120246.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --black: #111;
      --gray: #737373;
      --border: #e9e9e9;
      --light: #f7f7f7;
      --danger: #c62828;
      --radius: 16px;
      --skeleton: #ededed;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", sans-serif;
      color: var(--black);
      background: #fff;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid #555;
      outline-offset: 3px;
    }

    /* NAVBAR */

    .navbar {
      min-height: 76px;
      padding: 0 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 10;
    }

    .brand img {
      width: 46px;
      height: 46px;
      object-fit: contain;
      display: block;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .nav-icon {
      width: 32px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
    }

    .nav-icon:hover {
      opacity: .6;
    }

    /* MAIN */

    .container {
      width: 86%;
      max-width: 1200px;
      margin: 45px auto 70px;
    }

    .page-heading {
      margin-bottom: 30px;
    }

    .page-heading h1 {
      font-size: clamp(28px, 4vw, 38px);
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .page-heading p {
      margin-top: 9px;
      color: var(--gray);
      font-size: 13px;
      line-height: 1.7;
    }

    .wishlist-count {
      color: var(--gray);
      font-weight: 500;
      letter-spacing: 0;
      font-size: 13px;
      margin-left: 8px;
      white-space: nowrap;
    }

    .wishlist-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
      gap: 25px;
    }

    /* WISHLIST ITEMS */

    .wishlist-items {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .wishlist-item {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
    }

    .item-image {
      width: 115px;
      height: 115px;
      flex-shrink: 0;
      border-radius: 12px;
      background: var(--light);
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .item-info {
      min-width: 0;
      flex: 1;
    }

    .item-title {
      font-size: 14px;
      line-height: 1.6;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .item-description {
      margin-top: 6px;
      color: var(--gray);
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .item-unit-price {
      margin-top: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .item-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 15px;
    }

    .item-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 9px;
      padding: 10px 13px;
      font-size: 11px;
      font-weight: 700;
      transition: background .15s, opacity .15s;
    }

    .item-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .add-cart-button {
      background: var(--black);
      color: #fff;
      border: 1px solid var(--black);
    }

    .add-cart-button:hover {
      background: #333;
    }

    .view-button {
      background: #fff;
      color: var(--black);
      border: 1px solid var(--border);
    }

    .view-button:hover {
      background: var(--light);
    }

    .remove-button {
      border: 0;
      background: transparent;
      color: var(--danger);
      font-size: 11px;
      font-weight: 700;
    }

    .remove-button:hover {
      text-decoration: underline;
    }

    .item-stock {
      margin-top: 8px;
      color: var(--gray);
      font-size: 11px;
    }

    .item-stock.in-stock {
      color: #287a43;
    }

    .item-stock.out-stock {
      color: var(--danger);
    }

    /* STATUS */

    .status {
      padding: 55px 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-align: center;
      color: var(--gray);
      font-size: 13px;
      line-height: 1.8;
    }

    .status i {
      display: block;
      font-size: 46px;
      color: #999;
      margin-bottom: 14px;
    }

    .status h2 {
      font-size: 19px;
      color: var(--black);
      margin-bottom: 8px;
    }

    .status a,
    .status button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      padding: 12px 18px;
      border: 0;
      border-radius: 9px;
      background: var(--black);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    /* SKELETON LOADING */

    .skeleton {
      position: relative;
      overflow: hidden;
      background: var(--skeleton);
      border-radius: 7px;
    }

    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.8), transparent);
      animation: skeleton-shimmer 1.35s infinite;
    }

    @keyframes skeleton-shimmer {
      100% {
        transform: translateX(100%);
      }
    }

    .skeleton-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
    }

    .skeleton-image {
      width: 115px;
      height: 115px;
      flex-shrink: 0;
      border-radius: 12px;
    }

    .skeleton-info {
      flex: 1;
      min-width: 0;
    }

    .skeleton-line {
      height: 12px;
      margin-bottom: 12px;
    }

    .skeleton-line.title {
      height: 15px;
      width: 85%;
    }

    .skeleton-line.price {
      width: 42%;
    }

    .skeleton-line.controls {
      width: 62%;
      height: 30px;
      margin-bottom: 0;
      margin-top: 15px;
    }

    /* TOAST */

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translate(-50%, 15px);
      padding: 13px 18px;
      border-radius: 10px;
      background: #111;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      z-index: 100;
      text-align: center;
      max-width: calc(100% - 30px);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* FOOTER */

    .footer {
      border-top: 1px solid var(--border);
      padding: 25px 7%;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      color: #888;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      .navbar {
        min-height: 66px;
        padding: 0 5%;
      }

      .brand img {
        width: 40px;
        height: 40px;
      }

      .nav-actions {
        gap: 12px;
      }

      .container {
        width: 90%;
        margin-top: 30px;
      }

      .wishlist-item,
      .skeleton-card {
        gap: 11px;
        padding: 11px;
        flex-wrap: wrap;
      }

      .item-image,
      .skeleton-image {
        width: 85px;
        height: 95px;
        padding: 7px;
      }

      .item-info {
        flex: 1;
        width: calc(100% - 100px);
      }

      .item-title {
        font-size: 12px;
      }

      .item-description {
        font-size: 11px;
      }

      .item-unit-price {
        font-size: 12px;
      }

      .item-controls {
        gap: 9px;
        margin-top: 10px;
      }

      .item-button {
        padding: 9px 10px;
      }

      .footer {
        padding: 22px 5%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .skeleton::after {
        animation: none;
      }

      .toast {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <header class="navbar">
    <a href="/home.html" class="brand" aria-label="Shoppy home">
      <img
        src="https://i.ibb.co/93kQCKxT/20261019-120246.png"
        alt="Shoppy logo"
      >
    </a>

    <nav class="nav-actions" aria-label="Main navigation">
      <a class="nav-icon" href="/home.html" aria-label="Home" title="Home">
        <i class="ph ph-house" aria-hidden="true"></i>
      </a>

      <a class="nav-icon" href="/cart.html" aria-label="Cart" title="Cart">
        <i class="ph ph-shopping-cart" aria-hidden="true"></i>
      </a>

      <a class="nav-icon" href="/wishlist.html" aria-label="My wishlist" title="My wishlist">
        <i class="ph ph-heart" aria-hidden="true"></i>
      </a>

      <a class="nav-icon" href="/profile.html" aria-label="My profile" title="My profile">
        <i class="ph ph-user-circle" aria-hidden="true"></i>
      </a>
    </nav>
  </header>

  <main class="container">
    <div class="page-heading">
      <h1>
        My Wishlist
        <span id="wishlistCount" class="wishlist-count"></span>
      </h1>
      <p>Your favorite products, all in one place.</p>
    </div>

    <div class="wishlist-layout">
      <section
        id="wishlistItems"
        class="wishlist-items"
        aria-live="polite"
        aria-busy="true"
      ></section>
    </div>
  </main>

  <footer class="footer">
    <span>© <span id="year"></span> Shoppy</span>
    <span>Your shopping, all in one place.</span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    const wishlistItemsEl = document.getElementById("wishlistItems");
    const wishlistCountEl = document.getElementById("wishlistCount");
    const toast = document.getElementById("toast");

    const USD_TO_INR = 85;
    const PRODUCT_ID_PATTERN = /^[A-Za-z0-9]{40}$/;
    const DEFAULT_IMAGE =
      "https://i.ibb.co/93kQCKxT/20261019-120246.png";

    let wishlist = [];
    let busyIds = new Set();
    let toastTimer = null;

    document.getElementById("year").textContent =
      new Date().getFullYear();

    /* HELPERS */

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function formatPrice(price) {
      const value = Number(price) || 0;

      return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(value * USD_TO_INR);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    function normalizeProduct(item) {
      if (!item || !PRODUCT_ID_PATTERN.test(String(item.id || ""))) {
        return null;
      }

      const price = Number(item.originalPriceUSD ?? item.price);

      if (!Number.isFinite(price) || price < 0) {
        return null;
      }

      return {
        id: String(item.id),
        title: String(item.title || "Product"),
        description: String(item.description || ""),
        price,
        thumbnail: String(item.thumbnail || ""),
        category: String(item.category || ""),
        rating: Number(item.rating) || 0,
        stock: Number(item.stock) || 0
      };
    }

    /* API */

    async function apiRequest(method, body) {
      const options = {
        method,
        headers: {
          Accept: "application/json"
        },
        credentials: "same-origin",
        cache: "no-store"
      };

      if (body !== undefined) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(body);
      }

      const response = await fetch("/api/wishlist", options);
      const text = await response.text();

      let data;

      try {
        data = JSON.parse(text);
      } catch {
        throw new Error(
          `Wishlist API valid JSON nahi de rahi (HTTP ${response.status}).`
        );
      }

      if (response.status === 401) {
        window.location.href = "/login.html";
        throw new Error("Login required.");
      }

      if (!response.ok || data.success !== true) {
        throw new Error(data.message || "Wishlist request fail ho gayi.");
      }

      return data;
    }

    async function cartRequest(method, body) {
      const options = {
        method,
        headers: {
          Accept: "application/json"
        },
        credentials: "same-origin",
        cache: "no-store"
      };

      if (body !== undefined) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(body);
      }

      const response = await fetch("/api/cart", options);
      const text = await response.text();

      let data;

      try {
        data = JSON.parse(text);
      } catch {
        throw new Error("Cart API se valid response nahi mila.");
      }

      if (response.status === 401) {
        window.location.href = "/login.html";
        throw new Error("Login required.");
      }

      if (!response.ok || data.success !== true) {
        throw new Error(data.message || "Cart request fail ho gayi.");
      }

      return data;
    }

    /* SKELETON */

    function renderSkeleton() {
      wishlistItemsEl.setAttribute("aria-busy", "true");
      wishlistCountEl.textContent = "—";

      wishlistItemsEl.innerHTML = Array.from({ length: 3 }, () => `
        <div class="skeleton-card" aria-hidden="true">
          <div class="skeleton skeleton-image"></div>

          <div class="skeleton-info">
            <div class="skeleton skeleton-line title"></div>
            <div class="skeleton skeleton-line price"></div>
            <div class="skeleton skeleton-line controls"></div>
          </div>
        </div>
      `).join("");
    }

    /* LOAD WISHLIST */

    async function loadWishlist() {
      renderSkeleton();

      try {
        const data = await apiRequest("GET");

        wishlist = Array.isArray(data.items)
          ? data.items.map(normalizeProduct).filter(Boolean)
          : [];

        renderWishlist();

      } catch (error) {
        console.error("Wishlist loading error:", error);

        if (error.message === "Login required.") return;

        wishlistCountEl.textContent = "";

        wishlistItemsEl.innerHTML = `
          <div class="status">
            <i class="ph ph-warning-circle"></i>
            <h2>Unable to load wishlist</h2>
            <p>${escapeHTML(error.message)}</p>
            <button type="button" id="retryWishlist">Try Again</button>
          </div>
        `;

        document
          .getElementById("retryWishlist")
          .addEventListener("click", loadWishlist);

      } finally {
        wishlistItemsEl.setAttribute("aria-busy", "false");
      }
    }

    /* RENDER WISHLIST */

    function renderWishlist() {
      wishlistCountEl.textContent =
        `(${wishlist.length} ${wishlist.length === 1 ? "item" : "items"})`;

      if (!wishlist.length) {
        wishlistItemsEl.innerHTML = `
          <div class="status">
            <i class="ph ph-heart"></i>
            <h2>Your wishlist is empty</h2>
            <p>Save your favorite products here to find them easily later.</p>
            <a href="/home.html">
              Explore Products
              <i class="ph ph-arrow-right"></i>
            </a>
          </div>
        `;
        return;
      }

      wishlistItemsEl.innerHTML = wishlist.map(item => {
        const id = escapeHTML(item.id);
        const title = escapeHTML(item.title);
        const description = escapeHTML(item.description);
        const image = escapeHTML(item.thumbnail || DEFAULT_IMAGE);
        const disabled = busyIds.has(item.id);

        const stockText = item.stock > 0
          ? `<p class="item-stock in-stock">In stock</p>`
          : `<p class="item-stock out-stock">Stock information unavailable</p>`;

        return `
          <article class="wishlist-item" data-id="${id}">
            <a
              class="item-image"
              href="/product.html?id=${encodeURIComponent(item.id)}"
              aria-label="View ${title}"
            >
              <img
                src="${image}"
                alt="${title}"
                loading="lazy"
                onerror="this.onerror=null;this.src='${DEFAULT_IMAGE}';"
              >
            </a>

            <div class="item-info">
              <h3 class="item-title">${title}</h3>

              ${description
                ? `<p class="item-description">${description}</p>`
                : ""
              }

              <p class="item-unit-price">${formatPrice(item.price)}</p>

              ${stockText}

              <div class="item-controls">
                <button
                  class="item-button add-cart-button"
                  type="button"
                  data-action="add-cart"
                  data-id="${id}"
                  ${disabled ? "disabled" : ""}
                >
                  <i class="ph ph-shopping-cart" aria-hidden="true"></i>
                  Add to Cart
                </button>

                <a
                  class="item-button view-button"
                  href="/product.html?id=${encodeURIComponent(item.id)}"
                >
                  <i class="ph ph-eye" aria-hidden="true"></i>
                  View Product
                </a>

                <button
                  class="remove-button"
                  type="button"
                  data-action="remove"
                  data-id="${id}"
                  ${disabled ? "disabled" : ""}
                >
                  Remove
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("");

      wishlistItemsEl.querySelectorAll("[data-action]").forEach(button => {
        button.addEventListener("click", () => {
          handleWishlistAction(
            button.dataset.action,
            button.dataset.id
          );
        });
      });
    }

    /* WISHLIST ACTIONS */

    async function handleWishlistAction(action, id) {
      if (busyIds.has(id)) return;

      const product = wishlist.find(item => item.id === id);

      if (!product) return;

      busyIds.add(id);
      renderWishlist();

      try {
        if (action === "remove") {
          const data = await apiRequest("DELETE", { id });

          wishlist = Array.isArray(data.items)
            ? data.items.map(normalizeProduct).filter(Boolean)
            : [];

          showToast("Removed from wishlist");

        } else if (action === "add-cart") {
          await cartRequest("POST", {
            id: product.id,
            title: product.title,
            price: product.price,
            thumbnail: product.thumbnail,
            quantity: 1
          });

          showToast("Product added to cart");

        }

      } catch (error) {
        console.error("Wishlist action error:", error);

        if (error.message !== "Login required.") {
          showToast(error.message || "Action complete nahi hui");
        }

      } finally {
        busyIds.delete(id);
        renderWishlist();
      }
    }

    /* INITIAL LOAD */

    loadWishlist();
  </script>
</body>
</html>
