<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sequize Shop - Email Sender</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 15px;
  background: #f5f6f8;
  color: #222;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 560px;
  margin: auto;
  background: #fff;
  padding: 28px;
  border-radius: 8px;
}

.logo {
  display: block;
  width: 115px;
  max-height: 65px;
  object-fit: contain;
  margin: 0 auto 20px;
}

h2 {
  text-align: center;
  font-size: 23px;
  margin: 0 0 25px;
}

label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  margin: 17px 0 7px;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #d9dce2;
  border-radius: 5px;
  outline: none;
  font-family: Arial, sans-serif;
  font-size: 14px;
  background: #fff;
}

input:focus,
select:focus,
textarea:focus {
  border-color: #2962ff;
}

textarea {
  min-height: 85px;
  resize: vertical;
}

button {
  border: none;
  border-radius: 5px;
  padding: 12px 17px;
  background: #2962ff;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.secondary {
  background: #333;
}

.remove {
  background: #d93025;
  padding: 8px 12px;
}

.product {
  border-bottom: 1px solid #eee;
  padding: 12px 0;
  margin-bottom: 8px;
}

.product-title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 10px;
}

.product-grid {
  display: grid;
  grid-template-columns: 1fr 90px;
  gap: 9px;
}

.product-grid input {
  margin-bottom: 8px;
}

#sendBtn {
  width: 100%;
  margin-top: 25px;
  padding: 14px;
  font-weight: bold;
}

.status {
  margin-top: 15px;
  font-size: 14px;
  text-align: center;
  line-height: 1.5;
}

.note {
  color: #777;
  font-size: 12px;
  line-height: 1.5;
  margin-top: 6px;
}

.section-title {
  margin-top: 25px;
  padding-bottom: 9px;
  border-bottom: 1px solid #eee;
  font-size: 16px;
  font-weight: bold;
}

#productSection {
  display: none;
}

@media(max-width: 480px) {
  .container {
    padding: 20px 16px;
  }
}
</style>
</head>

<body>

<div class="container">

  <img
    class="logo"
    src="https://i.ibb.co/93kQCKxT/20261019-120246.png"
    alt="Sequize Shop"
  >

  <h2>Email Sender</h2>

  <!-- API KEY -->
  <label>Email API Key</label>
  <input
    type="password"
    id="apiKey"
    placeholder="Enter API Key"
    autocomplete="off"
  >

  <!-- RECIPIENT -->
  <label>Recipient Email</label>
  <input
    type="email"
    id="recipient"
    placeholder="Enter recipient email"
  >

  <!-- CATEGORY -->
  <label>Email Category</label>
  <select id="category">
    <option value="otp">OTP Verification</option>
    <option value="welcome">Welcome Email</option>
    <option value="order">Order Confirmation</option>
    <option value="payment">Payment Confirmation</option>
    <option value="shipped">Order Shipped</option>
    <option value="out">Out for Delivery</option>
    <option value="delivered">Order Delivered</option>
    <option value="cancelled">Order Cancelled</option>
    <option value="refund">Refund Confirmation</option>
    <option value="return">Return Confirmation</option>
    <option value="account">Account Update</option>
    <option value="custom">Custom Email</option>
  </select>

  <!-- SUBJECT -->
  <label>Email Subject</label>
  <input
    type="text"
    id="subject"
    placeholder="Email subject"
  >

  <!-- DYNAMIC FIELDS -->
  <div class="section-title">Email Details</div>
  <div id="dynamicFields"></div>

  <!-- PRODUCTS -->
  <div id="productSection">

    <div class="section-title">Product Details</div>

    <div id="products"></div>

    <button
      type="button"
      class="secondary"
      onclick="addProduct()"
    >
      Add Product
    </button>

  </div>

  <button id="sendBtn" onclick="sendEmail()">
    Send Email
  </button>

  <div class="status" id="status"></div>

</div>

<script>
"use strict";

/* =====================================
   API CONFIGURATION
===================================== */

const API_ENDPOINT = "/api/auth/otp";

/* =====================================
   EMAIL CATEGORY CONFIGURATION
===================================== */

const categories = {

  otp: {
    subject: "Your Sequize Shop Verification Code",
    fields: [
      ["name", "Customer Name"],
      ["otp", "Verification Code"],
      ["expiry", "OTP Validity", "10 minutes"]
    ]
  },

  welcome: {
    subject: "Welcome to Sequize Shop",
    fields: [
      ["name", "Customer Name"],
      ["message", "Welcome Message",
        "Thank you for joining Sequize Shop. We are happy to have you with us."]
    ]
  },

  order: {
    subject: "Your Order Has Been Confirmed",
    products: true,
    fields: [
      ["name", "Customer Name"],
      ["orderId", "Order ID"],
      ["date", "Order Date"],
      ["payment", "Payment Method"],
      ["total", "Order Total"]
    ]
  },

  payment: {
    subject: "Payment Confirmation - Sequize Shop",
    fields: [
      ["name", "Customer Name"],
      ["orderId", "Order ID"],
      ["amount", "Payment Amount"],
      ["paymentId", "Payment ID"],
      ["date", "Payment Date"]
    ]
  },

  shipped: {
    subject: "Your Order Has Been Shipped",
    products: true,
    fields: [
      ["name", "Customer Name"],
      ["orderId", "Order ID"],
      ["courier", "Courier Name"],
      ["tracking", "Tracking ID"],
      ["eta", "Expected Delivery"]
    ]
  },

  out: {
    subject: "Your Order Is Out for Delivery",
    fields: [
      ["name", "Customer Name"],
      ["orderId", "Order ID"],
      ["eta", "Expected Delivery Time"]
    ]
  },

  delivered: {
    subject: "Your Order Has Been Delivered",
    fields: [
      ["name", "Customer Name"],
      ["orderId", "Order ID"],
      ["date", "Delivery Date"]
    ]
  },

  cancelled: {
    subject: "Your Order Has Been Cancelled",
    fields: [
      ["name", "Customer Name"],
      ["orderId", "Order ID"],
      ["reason", "Cancellation Reason"],
      ["refund", "Refund Information"]
    ]
  },

  refund: {
    subject: "Your Refund Has Been Processed",
    fields: [
      ["name", "Customer Name"],
      ["orderId", "Order ID"],
      ["amount", "Refund Amount"],
      ["refundId", "Refund Reference ID"],
      ["date", "Refund Date"]
    ]
  },

  return: {
    subject: "Return Request Update",
    fields: [
      ["name", "Customer Name"],
      ["orderId", "Order ID"],
      ["reason", "Return Reason"],
      ["pickup", "Pickup Date"],
      ["returnStatus", "Return Status"]
    ]
  },

  account: {
    subject: "Your Account Update",
    fields: [
      ["name", "Customer Name"],
      ["update", "Account Update Details"]
    ]
  },

  custom: {
    subject: "",
    fields: [
      ["name", "Recipient Name"],
      ["heading", "Email Heading"],
      ["message", "Description"]
    ]
  }

};

/* =====================================
   DYNAMIC FIELD GENERATOR
===================================== */

const category = document.getElementById("category");
const dynamicFields = document.getElementById("dynamicFields");
const subject = document.getElementById("subject");
const productSection = document.getElementById("productSection");

category.addEventListener("change", loadCategory);

function loadCategory() {

  const config = categories[category.value];

  dynamicFields.innerHTML = "";
  subject.value = config.subject;

  config.fields.forEach(field => {

    const [id, label, placeholder] = field;

    const wrapper = document.createElement("div");

    const title = document.createElement("label");
    title.textContent = label;

    let input;

    if (
      id === "message" ||
      id === "reason" ||
      id === "update" ||
      id === "refund"
    ) {

      input = document.createElement("textarea");

    } else {

      input = document.createElement("input");
      input.type = "text";

    }

    input.id = "field_" + id;
    input.placeholder = placeholder || "Enter " + label;

    wrapper.appendChild(title);
    wrapper.appendChild(input);

    dynamicFields.appendChild(wrapper);

  });

  productSection.style.display =
    config.products ? "block" : "none";

  document.getElementById("products").innerHTML = "";

  if (config.products) {
    addProduct();
  }
}

/* =====================================
   MULTIPLE PRODUCTS
===================================== */

let productCount = 0;

function addProduct() {

  productCount++;

  const wrapper = document.createElement("div");

  wrapper.className = "product";

  wrapper.innerHTML = `
    <div class="product-title">
      Product ${productCount}
    </div>

    <div class="product-grid">
      <input
        type="text"
        class="productName"
        placeholder="Product Name"
      >

      <input
        type="number"
        class="productQty"
        placeholder="Qty"
        min="1"
        value="1"
      >
    </div>

    <input
      type="text"
      class="productPrice"
      placeholder="Product Price"
    >

    <button
      type="button"
      class="remove"
      onclick="this.parentElement.remove()"
    >
      Remove
    </button>
  `;

  document.getElementById("products").appendChild(wrapper);
}

/* =====================================
   HTML ESCAPING
===================================== */

function escapeHTML(value) {

  return String(value || "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);

}

/* =====================================
   GET FIELD VALUE
===================================== */

function getField(id) {

  const input = document.getElementById("field_" + id);

  return input ? input.value.trim() : "";

}

/* =====================================
   BUILD EMAIL TEMPLATE
===================================== */

function buildEmail() {

  const selected = categories[category.value];

  const name = getField("name") || "Customer";

  const heading =
    getField("heading") ||
    getHeading(category.value);

  let description = "";

  const lines = [];

  selected.fields.forEach(field => {

    const id = field[0];

    if (
      id === "name" ||
      id === "heading" ||
      id === "message"
    ) return;

    const value = getField(id);

    if (value) {
      lines.push(`
        <tr>
          <td style="padding:10px 0;border-bottom:1px solid #eeeeee;color:#666;font-size:14px;">
            ${escapeHTML(field[1])}
          </td>
          <td style="padding:10px 0;border-bottom:1px solid #eeeeee;text-align:right;font-weight:bold;font-size:14px;">
            ${escapeHTML(value)}
          </td>
        </tr>
      `);
    }

  });

  /* PRODUCT DETAILS */

  const productText = [];

  if (selected.products) {

    const products = document.querySelectorAll(".product");

    products.forEach((item, index) => {

      const productName =
        item.querySelector(".productName").value.trim();

      const qty =
        item.querySelector(".productQty").value.trim();

      const price =
        item.querySelector(".productPrice").value.trim();

      if (!productName) return;

      productText.push(
        `${productName} | Quantity: ${qty || 1} | Price: ${price || "-"}`
      );

      lines.push(`
        <tr>
          <td style="padding:10px 0;border-bottom:1px solid #eeeeee;color:#333;font-size:14px;">
            ${escapeHTML(productName)}
          </td>
          <td style="padding:10px 0;border-bottom:1px solid #eeeeee;text-align:right;font-size:14px;">
            Qty: ${escapeHTML(qty || "1")}<br>
            ${escapeHTML(price)}
          </td>
        </tr>
      `);

    });

  }

  /* MESSAGE */

  let message = getField("message");

  if (!message) {
    message = getDefaultMessage(category.value);
  }

  const safeMessage = escapeHTML(message)
    .replace(/\n/g, "<br>");

  const detailsHTML = lines.length
    ? `<table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin-top:15px;">${lines.join("")}</table>`
    : "";

  const html = `
  <div style="
    max-width:460px;
    margin:0 auto;
    padding:25px 20px;
    background:#ffffff;
    color:#222222;
    font-family:Arial,Helvetica,sans-serif;
  ">

    <div style="text-align:center;margin-bottom:25px;">
      <img
        src="https://i.ibb.co/93kQCKxT/20261019-120246.png"
        alt="Sequize Shop"
        width="115"
        style="max-width:115px;height:auto;"
      >
    </div>

    <h1 style="
      font-size:25px;
      line-height:1.3;
      margin:0 0 20px;
      font-weight:700;
      color:#111111;
    ">
      ${escapeHTML(heading)}
    </h1>

    <p style="
      font-size:19px;
      font-weight:700;
      margin:0 0 12px;
      color:#222222;
    ">
      Hello ${escapeHTML(name)},
    </p>

    <p style="
      font-size:14px;
      line-height:1.8;
      color:#444444;
      margin:0 0 15px;
    ">
      ${safeMessage}
    </p>

    ${detailsHTML}

    <p style="
      font-size:14px;
      line-height:1.7;
      color:#444444;
      margin-top:25px;
    ">
      Thank you for choosing Sequize Shop.
    </p>

    <p style="
      font-size:14px;
      font-weight:bold;
      margin-top:20px;
    ">
      Regards,<br>
      Sequize Shop Team
    </p>

    <div style="
      border-top:1px solid #eeeeee;
      margin-top:25px;
      padding-top:15px;
      font-size:11px;
      color:#888888;
      text-align:center;
    ">
      This is an automated email from Sequize Shop.
    </div>

  </div>
  `;

  const text = [
    heading,
    "",
    "Hello " + name + ",",
    "",
    message,
    "",
    ...selected.fields
      .filter(field => field[0] !== "name" && field[0] !== "heading" && field[0] !== "message")
      .map(field => {
        const value = getField(field[0]);
        return value ? field[1] + ": " + value : "";
      })
      .filter(Boolean),
    ...productText,
    "",
    "Thank you for choosing Sequize Shop.",
    "",
    "Regards,",
    "Sequize Shop Team"
  ].join("\n");

  return { html, text };

}

/* =====================================
   DEFAULT HEADINGS
===================================== */

function getHeading(type) {

  const headings = {
    otp: "Email Verification",
    welcome: "Welcome to Sequize Shop",
    order: "Order Confirmed!",
    payment: "Payment Successful",
    shipped: "Your Order Is Shipped",
    out: "Out for Delivery",
    delivered: "Order Delivered",
    cancelled: "Order Cancelled",
    refund: "Refund Processed",
    return: "Return Request Update",
    account: "Account Update",
    custom: "Important Message"
  };

  return headings[type] || "Sequize Shop";
}

/* =====================================
   DEFAULT MESSAGES
===================================== */

function getDefaultMessage(type) {

  const messages = {

    otp:
      "Please use the verification code provided below to verify your email address. Do not share your code with anyone.",

    welcome:
      "Thank you for joining Sequize Shop. We are happy to have you as part of our shopping community.",

    order:
      "Thank you for shopping with us. Your order has been successfully placed.",

    payment:
      "We have successfully received your payment. Here are your payment details.",

    shipped:
      "Good news! Your order has been shipped and is on its way to you.",

    out:
      "Your order is out for delivery. Please keep your phone available.",

    delivered:
      "Your order has been successfully delivered. We hope you enjoy your purchase.",

    cancelled:
      "Your order has been cancelled. Please check the details below.",

    refund:
      "Your refund has been processed. Please find the refund details below.",

    return:
      "We have received an update regarding your return request.",

    account:
      "There has been an update to your Sequize Shop account.",

    custom:
      "We are contacting you with an important update."
  };

  return messages[type] || "";
}

/* =====================================
   SEND EMAIL
===================================== */

async function sendEmail() {

  const apiKey =
    document.getElementById("apiKey").value.trim();

  const to =
    document.getElementById("recipient").value.trim();

  const emailSubject = subject.value.trim();

  const status = document.getElementById("status");
  const sendBtn = document.getElementById("sendBtn");

  status.textContent = "";

  if (!apiKey) {
    status.textContent = "Please enter Email API Key.";
    return;
  }

  if (!to || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) {
    status.textContent = "Please enter a valid recipient email.";
    return;
  }

  if (!emailSubject) {
    status.textContent = "Please enter email subject.";
    return;
  }

  const content = buildEmail();

  sendBtn.disabled = true;
  sendBtn.textContent = "Sending...";

  try {

    const response = await fetch(API_ENDPOINT, {

      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "x-email-api-key": apiKey
      },

      body: JSON.stringify({
        action: "send-email",
        to,
        subject: emailSubject,
        html: content.html,
        text: content.text
      })

    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || "Email sending failed.");
    }

    status.style.color = "green";
    status.textContent =
      "Email sent successfully to " + result.recipient;

  } catch (error) {

    status.style.color = "#d93025";
    status.textContent = error.message;

  } finally {

    sendBtn.disabled = false;
    sendBtn.textContent = "Send Email";

  }

}

/* INITIAL LOAD */

loadCategory();

</script>

</body>
</html>
