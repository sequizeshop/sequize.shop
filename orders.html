<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>My Orders — Shoppy</title>

  <link rel="icon" type="image/png"
    href="https://i.ibb.co/93kQCKxT/20261019-120246.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet"
    href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">

  <link rel="stylesheet" href="/global.css">

  <style>
    :root {
      /* Shoppy design tokens */
      --primary: #2962FF;
      --primary-hover: #0059D7;
      --primary-soft: #EDF2FF;
      --primary-selected: #F8FAFF;
      --background: #FFFFFF;
      --surface: #FFFFFF;
      --surface-secondary: #F5F5F2;
      --text-primary: #1E1F1C;
      --text-secondary: #666960;
      --text-muted: #969991;
      --border: #E5E7EB;
      --divider: #E5E7EB;
      --success: #15803D;
      --success-bg: #ECFDF3;
      --error: #DC2626;
      --error-bg: #FEF2F2;
      --disabled-bg: #E5E7EB;
      --disabled-text: #969991;

      --font-body: "DM Sans", sans-serif;
      --font-heading: "Manrope", sans-serif;

      --radius-sm: 5px;
      --radius-md: 9px;
      --radius-lg: 12px;

      --header-h: 64px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.7;
      background: var(--background);
      color: var(--text-primary);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    /* HEADER */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      height: var(--header-h);
      min-height: var(--header-h);
      margin: 0;
      padding: 0 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--background);
      border-bottom: 1px solid var(--border);
      box-shadow: none;
    }

    .bag-link {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      margin: 0;
      border: none;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text-primary);
      font-size: 24px;
      line-height: 1;
      text-decoration: none;
    }

    .bag-link:hover {
      background: var(--surface-secondary);
    }

    .brand {
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 800;
      line-height: 1.4;
      letter-spacing: -0.7px;
      color: var(--primary);
      background: transparent;
      padding: 0;
      margin: 0;
      text-decoration: none;
    }

    /* PAGE */

    main {
      width: min(1050px, 90%);
      max-width: 1050px;
      margin: 34px auto 65px;
      min-height: 55vh;
    }

    .page-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin: 0 0 28px;
    }

    .page-heading h1 {
      font-family: var(--font-heading);
      font-size: clamp(27px, 4vw, 36px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -1.2px;
      margin: 0 0 8px;
    }

    .page-heading p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.7;
    }

    /* BUTTONS (text only) */

    .refresh-btn,
    .action-btn,
    .primary-btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: var(--radius-lg);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: background .2s, border-color .2s, color .2s;
    }

    .refresh-btn,
    .action-btn {
      border: 1px solid var(--primary-soft);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .refresh-btn:hover:not(:disabled),
    .action-btn:hover:not(:disabled) {
      border-color: var(--primary);
    }

    .refresh-btn:disabled {
      background: var(--disabled-bg);
      border-color: var(--disabled-bg);
      color: var(--disabled-text);
      cursor: wait;
    }

    .primary-btn {
      border: 1px solid var(--primary);
      background: var(--primary);
      color: #ffffff;
    }

    .primary-btn:hover {
      border-color: var(--primary-hover);
      background: var(--primary-hover);
    }

    /* PAGE MESSAGE */

    #message {
      padding: 0;
      margin: 0 0 18px;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.7;
    }

    #message:empty {
      display: none;
    }

    .notice {
      padding: 12px 15px;
      margin-bottom: 24px;
      border-radius: var(--radius-lg);
      background: var(--primary-soft);
      color: var(--text-primary);
      font-size: 13px;
      line-height: 1.7;
    }

    .notice i {
      color: var(--primary);
      vertical-align: -2px;
    }

    /* ORDERS (divider separated, no outer cards) */

    .order-card {
      margin: 0;
      padding: 27px 0;
      border-bottom: 1px solid var(--divider);
      background: transparent;
    }

    .order-card:first-child {
      padding-top: 0;
    }

    .order-card:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .order-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 18px;
      padding: 0 0 15px;
      border-bottom: 1px solid var(--divider);
    }

    .order-meta {
      flex: 1;
      min-width: 130px;
    }

    .meta-label {
      display: block;
      margin-bottom: 2px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .meta-value {
      font-size: 14px;
      font-weight: 600;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    /* STATUS */

    .status-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface-secondary);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 700;
    }

    .status i {
      font-size: 14px;
    }

    .status.paid {
      background: var(--success-bg);
      color: var(--success);
    }

    .status.failed {
      background: var(--error-bg);
      color: var(--error);
    }

    /* ORDER PRODUCTS (with images) */

    .order-body {
      padding: 0;
    }

    .product-row {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid var(--divider);
      line-height: 1.6;
    }

    .product-row:last-child {
      border-bottom: 0;
    }

    .product-image {
      width: 76px;
      height: 76px;
      flex-shrink: 0;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-md);
      background: var(--surface-secondary);
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .product-details {
      flex: 1;
      min-width: 0;
    }

    .product-name {
      color: var(--text-primary);
      font-family: var(--font-heading);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .product-info {
      margin-top: 2px;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .product-price {
      flex-shrink: 0;
      padding-left: 5px;
      color: var(--text-primary);
      font-family: var(--font-heading);
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* ORDER TOTAL */

    .order-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 3px;
      padding: 18px 0 0;
      border-top: 1px solid var(--divider);
    }

    .order-total {
      min-width: 0;
    }

    .total-label {
      margin-bottom: 0;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .total {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -.7px;
      overflow-wrap: anywhere;
    }

    .order-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* EMPTY STATE */

    .empty-state {
      padding: 40px 0;
      background: transparent;
      text-align: center;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 29px;
    }

    .empty-state h2 {
      margin: 0 0 8px;
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.7px;
    }

    .empty-state p {
      max-width: 380px;
      margin: 0 auto 24px;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.7;
    }

    /* FOOTER */

    footer {
      padding: 24px 5%;
      border-top: 1px solid var(--divider);
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
    }

    /* RESPONSIVE */

    @media (max-width: 760px) {
      main {
        width: 90%;
        margin-top: 25px;
      }

      .page-heading h1 {
        font-size: 29px;
      }

      .order-top {
        gap: 15px;
      }

      .order-meta {
        min-width: calc(50% - 10px);
      }

      .status-group {
        width: 100%;
      }

      .order-bottom {
        align-items: stretch;
      }

      .order-actions {
        width: 100%;
      }

      .order-actions button,
      .order-actions a {
        flex: 1;
      }
    }

    @media (max-width: 380px) {
      .refresh-btn {
        width: 100%;
      }

      .product-image {
        width: 60px;
        height: 74px;
        padding: 4px;
      }

      .product-name {
        font-size: 12px;
      }

      .product-price {
        font-size: 12px;
        padding-left: 0;
      }

      .total {
        font-size: 22px;
      }

      .order-actions {
        flex-direction: column;
      }

      .order-actions button,
      .order-actions a {
        width: 100%;
        flex: none;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="topbar">

    <a href="/"
       class="bag-link"
       aria-label="Continue shopping"
       title="Continue shopping">

      <i class="ph ph-bag-simple"></i>

    </a>

    <a href="/" class="brand">Shoppy.</a>

  </header>

  <main>

    <!-- PAGE HEADING -->

    <div class="page-heading">

      <div>
        <h1>My Orders</h1>

        <p>
          View your orders and payment status.
        </p>
      </div>

      <button class="refresh-btn"
              id="refreshBtn"
              type="button">Refresh orders</button>

    </div>

    <!-- PAYMENT INFORMATION -->

    <div class="notice">
      <i class="ph ph-info"></i>
      Payment status is shown according to the order records available on
      Shoppy. A pending payment is not a confirmed payment.
    </div>

    <!-- LOADING / ERROR MESSAGE -->

    <div id="message"
         role="status"
         aria-live="polite">

      Loading your orders...

    </div>

    <!-- ORDERS LIST -->

    <section id="ordersList"
             aria-label="Your orders">

    </section>

  </main>

  <footer>
    © <span id="year"></span> Shoppy. All rights reserved.
  </footer>

  <script>
    "use strict";

    const ordersList = document.getElementById("ordersList");
    const message = document.getElementById("message");
    const refreshBtn = document.getElementById("refreshBtn");

    const PLACEHOLDER_IMAGE =
      "https://placehold.co/300x300/f5f5f2/969991?text=Product";

    document.getElementById("year").textContent =
      new Date().getFullYear();

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, function (char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char];
      });
    }

    function formatINR(value) {
      const amount = Number(value);

      if (!Number.isFinite(amount)) {
        return "—";
      }

      return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 2
      }).format(amount);
    }

    function formatDate(value) {
      if (value === undefined || value === null || value === "") {
        return "Date unavailable";
      }

      let date;

      if (
        typeof value === "number" ||
        /^\d+$/.test(String(value))
      ) {
        date = new Date(Number(value));
      } else {
        date = new Date(value);
      }

      if (Number.isNaN(date.getTime())) {
        return "Date unavailable";
      }

      return date.toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function readableStatus(value) {
      return String(value || "UNKNOWN")
        .replace(/_/g, " ")
        .toLowerCase()
        .replace(/\b\w/g, letter => letter.toUpperCase());
    }

    function paymentClass(status) {
      const value = String(status || "").toUpperCase();

      if (
        value === "PAID" ||
        value === "SUCCESS" ||
        value === "SUCCESSFUL" ||
        value === "COMPLETED"
      ) {
        return "paid";
      }

      if (
        value === "FAILED" ||
        value === "CANCELLED" ||
        value === "EXPIRED"
      ) {
        return "failed";
      }

      return "";
    }

    /*
      Product image for an order item.
      Uses the same field names as the cart API (thumbnail),
      with a few common fallbacks. Only https or same-origin
      URLs are used; anything else falls back to a placeholder.
    */
    function getItemImage(item) {
      const candidate =
        item.thumbnail ||
        item.image ||
        item.imageUrl ||
        (Array.isArray(item.images) ? item.images[0] : "") ||
        "";

      if (!candidate) {
        return PLACEHOLDER_IMAGE;
      }

      try {
        const parsed = new URL(candidate, window.location.origin);

        if (
          parsed.protocol !== "https:" &&
          parsed.origin !== window.location.origin
        ) {
          return PLACEHOLDER_IMAGE;
        }

        return parsed.href;
      } catch {
        return PLACEHOLDER_IMAGE;
      }
    }

    function renderOrder(order) {
      const orderId = String(order.orderId || "");

      const paymentStatus =
        String(order.paymentStatus || "PENDING");

      const orderStatus =
        String(order.orderStatus || "PENDING");

      const items = Array.isArray(order.items)
        ? order.items
        : [];

      const productsHTML = items.length
        ? items.map(item => {

            const title = escapeHTML(
              item.title || "Product"
            );

            const quantity = Math.max(
              0,
              Number(item.quantity) || 0
            );

            const unitPriceUSD =
              Number(item.unitPriceUSD);

            const lineTotalUSD =
              Number(item.lineTotalUSD);

            const image = escapeHTML(getItemImage(item));

            let priceText = "";

            if (Number.isFinite(lineTotalUSD)) {

              priceText = formatINR(
                lineTotalUSD *
                (Number(order.exchangeRate) || 85)
              );

            } else if (Number.isFinite(unitPriceUSD)) {

              priceText = formatINR(
                unitPriceUSD *
                quantity *
                (Number(order.exchangeRate) || 85)
              );

            }

            return `
              <div class="product-row">

                <div class="product-image">
                  <img
                    src="${image}"
                    alt="${title}"
                    loading="lazy"
                    onerror="this.onerror=null;this.src='${PLACEHOLDER_IMAGE}';"
                  >
                </div>

                <div class="product-details">

                  <div class="product-name">
                    ${title}
                  </div>

                  <div class="product-info">
                    Quantity: ${quantity}
                  </div>

                </div>

                <div class="product-price">
                  ${priceText || "—"}
                </div>

              </div>
            `;

          }).join("")
        : `
            <div class="empty-state"
                 style="padding:20px 0">

              <p style="margin:0">
                No item details available for this order.
              </p>

            </div>
          `;

      const encodedOrderId =
        encodeURIComponent(orderId);

      const upperPaymentStatus =
        paymentStatus.toUpperCase();

      const canContinuePayment =
        upperPaymentStatus === "PENDING" &&
        orderStatus.toUpperCase() !== "CANCELLED" &&
        orderStatus.toUpperCase() !== "FAILED" &&
        orderStatus.toUpperCase() !== "COMPLETED" &&
        orderStatus.toUpperCase() !== "DELIVERED";

      const paymentIcon =
        paymentClass(paymentStatus) === "paid"
          ? "ph-check-circle"
          : paymentClass(paymentStatus) === "failed"
            ? "ph-x-circle"
            : "ph-clock";

      return `
        <article class="order-card">

          <!-- ORDER HEADER -->

          <div class="order-top">

            <div class="order-meta">

              <span class="meta-label">
                Order ID
              </span>

              <div class="meta-value">
                ${escapeHTML(orderId || "Unavailable")}
              </div>

            </div>

            <div class="order-meta">

              <span class="meta-label">
                Order date
              </span>

              <div class="meta-value">
                ${escapeHTML(formatDate(order.createdAt))}
              </div>

            </div>

            <div class="status-group">

              <span class="status ${paymentClass(paymentStatus)}">

                <i class="ph ${paymentIcon}"></i>

                Payment:
                ${escapeHTML(readableStatus(paymentStatus))}

              </span>

              <span class="status">

                ${escapeHTML(readableStatus(orderStatus))}

              </span>

            </div>

          </div>

          <!-- PRODUCTS -->

          <div class="order-body">

            ${productsHTML}

          </div>

          <!-- ORDER TOTAL AND ACTIONS -->

          <div class="order-bottom total-row">

            <div class="order-total">

              <div class="total-label">
                Order total
              </div>

              <div class="total">
                ${formatINR(order.totalINR)}
              </div>

            </div>

            <div class="order-actions">

              <button
                class="action-btn"
                type="button"
                data-copy-order="${escapeHTML(orderId)}">Copy order ID</button>

              ${
                canContinuePayment
                  ? `
                    <a
                      class="primary-btn"
                      href="/payment.html?orderId=${encodedOrderId}">Continue to payment</a>
                  `
                  : ""
              }

            </div>

          </div>

        </article>
      `;
    }

    async function loadOrders() {
      refreshBtn.disabled = true;

      refreshBtn.textContent = "Loading...";

      ordersList.replaceChildren();

      message.textContent = "Loading your orders...";

      try {

        const response = await fetch("/api/orders", {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store",
          headers: {
            "Accept": "application/json"
          }
        });

        const data = await response.json().catch(() => ({}));

        if (response.status === 401) {

          message.textContent =
            "Please log in to view your orders.";

          ordersList.innerHTML = `
            <div class="empty-state">

              <div class="empty-icon">
                <i class="ph ph-user-circle"></i>
              </div>

              <h2>Login required</h2>

              <p>
                Log in to your Shoppy account to see your orders.
              </p>

              <a class="primary-btn" href="/login.html">Log in</a>

            </div>
          `;

          return;
        }

        if (!response.ok || data.success !== true) {

          throw new Error(
            data.message || "Unable to load orders."
          );

        }

        const orders = Array.isArray(data.orders)
          ? data.orders
          : [];

        if (orders.length === 0) {

          message.textContent = "";

          ordersList.innerHTML = `
            <div class="empty-state">

              <div class="empty-icon">
                <i class="ph ph-shopping-bag-open"></i>
              </div>

              <h2>No orders yet</h2>

              <p>
                Your orders will appear here after you place an order.
              </p>

              <a class="primary-btn" href="/shop.html">Start shopping</a>

            </div>
          `;

          return;
        }

        message.textContent =
          `${orders.length} order${orders.length === 1 ? "" : "s"} found.`;

        ordersList.innerHTML =
          orders.map(renderOrder).join("");

      } catch (error) {

        console.error("Load orders error:", error);

        message.textContent =
          "We couldn't load your orders. Please try again.";

      } finally {

        refreshBtn.disabled = false;

        refreshBtn.textContent = "Refresh orders";

      }
    }

    refreshBtn.addEventListener("click", loadOrders);

    ordersList.addEventListener("click", async function (event) {

      const copyButton =
        event.target.closest("[data-copy-order]");

      if (copyButton) {

        try {

          await navigator.clipboard.writeText(
            copyButton.dataset.copyOrder
          );

          copyButton.textContent = "Copied";

          setTimeout(() => {

            if (copyButton.isConnected) {
              copyButton.textContent = "Copy order ID";
            }

          }, 1500);

        } catch (error) {

          console.error("Copy order ID error:", error);

          message.textContent =
            "Copy failed. Please select and copy the order ID manually.";

        }
      }

    });

    loadOrders();
  </script>

</body>
</html>
