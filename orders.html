<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>My Orders — Sequize</title>

  <link rel="icon" type="image/png"
    href="https://i.ibb.co/93kQCKxT/20261019-120246.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet"
    href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">

  <link rel="stylesheet" href="/global.css">

  <style>
    :root {
      --primary: #2962FF;
      --primary-hover: #0059D7;
      --primary-soft: #EDF2FF;
      --background: #FFFFFF;
      --surface-secondary: #F5F5F2;
      --text-primary: #1E1F1C;
      --text-secondary: #666960;
      --text-muted: #969991;
      --border: #E5E7EB;
      --divider: #E5E7EB;
      --success: #15803D;
      --success-bg: #ECFDF3;
      --warn: #B45309;
      --warn-bg: #FFF4E0;
      --error: #DC2626;
      --error-bg: #FEF2F2;

      /* Tracker */
      --track: #E8EAEE;
      --track-dot: #D3D6DC;
      --green-1: #4ADE80;
      --green-2: #16A34A;
      --dot-size: 20px;
      --seg-h: 10px;
      --head-pad: 2px;
      --seg-gap: 6px;

      --font-body: "DM Sans", sans-serif;
      --font-heading: "Manrope", sans-serif;

      --radius-md: 9px;
      --radius-lg: 12px;

      --header-h: 64px;
    }

    * { box-sizing: border-box; }

    body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.7;
      background: var(--background);
      color: var(--text-primary);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a { text-decoration: none; color: inherit; }
    button { font: inherit; cursor: pointer; }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    /* HEADER */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      height: var(--header-h);
      padding: 0 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--background);
      border-bottom: 1px solid var(--border);
    }

    .nav-link {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 24px;
      line-height: 1;
    }

    .nav-link:hover { background: var(--surface-secondary); }

    .brand {
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 800;
      line-height: 1.4;
      letter-spacing: -0.7px;
      color: var(--primary);
    }

    /* PAGE */

    main {
      width: min(1050px, 90%);
      margin: 34px auto 65px;
      min-height: 55vh;
    }

    .page-heading { margin: 0 0 28px; }

    .page-heading h1 {
      font-family: var(--font-heading);
      font-size: clamp(27px, 4vw, 36px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -1.2px;
      margin: 0 0 8px;
    }

    .page-heading p {
      margin: 0;
      color: var(--text-secondary);
    }

    .primary-btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border: 1px solid var(--primary);
      border-radius: var(--radius-lg);
      background: var(--primary);
      color: #fff;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 700;
      transition: background .2s, border-color .2s;
    }

    .primary-btn:hover {
      border-color: var(--primary-hover);
      background: var(--primary-hover);
    }

    /* MESSAGE */

    #message {
      margin: 0 0 18px;
      color: var(--text-secondary);
    }

    #message:empty { display: none; }

    .notice {
      padding: 12px 15px;
      margin-bottom: 24px;
      border-radius: var(--radius-lg);
      background: var(--primary-soft);
      font-size: 13px;
    }

    .notice i {
      color: var(--primary);
      vertical-align: -2px;
    }

    /* ORDER */

    .order-card {
      padding: 27px 0;
      border-bottom: 1px solid var(--divider);
    }

    .order-card:first-child { padding-top: 0; }

    .order-card:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    /* PRODUCTS: dividers only between products */

    .product-row {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 0;
    }

    .product-row:first-child { padding-top: 0; }
    .product-row:last-child { padding-bottom: 0; }

    .product-row + .product-row {
      border-top: 1px solid var(--divider);
    }

    .product-image {
      width: 76px;
      height: 76px;
      flex-shrink: 0;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-md);
      background: var(--surface-secondary);
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .product-details {
      flex: 1;
      min-width: 0;
    }

    .product-name {
      font-family: var(--font-heading);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .product-info {
      margin-top: 2px;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.6;
    }

    .product-date {
      color: var(--text-muted);
      font-size: 12px;
    }

    /* TOTAL (left) + STATUS & BUTTONS (right) — always ONE line */

    .order-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: nowrap;
      gap: 10px;
      margin-top: 18px;
    }

    .order-total { flex-shrink: 0; }

    .total-label {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .total {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -.7px;
      line-height: 1.3;
      white-space: nowrap;
    }

    .order-right {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: nowrap;
      gap: 6px;
    }

    /* Small pill: used by the status tag and the buttons */

    .pill {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border: 0;
      border-radius: 999px;
      background: var(--surface-secondary);
      color: var(--text-secondary);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.7;
      white-space: nowrap;
    }

    .pill i { font-size: 14px; }

    .pill.paid { background: var(--success-bg); color: var(--success); }
    .pill.warn { background: var(--warn-bg); color: var(--warn); }
    .pill.failed { background: var(--error-bg); color: var(--error); }

    button.pill,
    a.pill { transition: background .2s, color .2s; }

    button.pill.copy {
      background: var(--primary-soft);
      color: var(--primary);
    }

    button.pill.copy:hover { background: #dbe6ff; }

    a.pill.pay {
      background: var(--primary);
      color: #fff;
    }

    a.pill.pay:hover { background: var(--primary-hover); }

    /* Short / full button text */
    .copy .t-short,
    .copy .t-copied,
    .copy .cico,
    .pay .t-short { display: none; }

    .copy.copied .t-full,
    .copy.copied .t-short { display: none; }

    .copy.copied .t-copied { display: inline; }

    /* DELIVERY TRACKER
       Row 1: step names. Row 2: dot - line - dot - line - dot - line - dot.
       Each step is 3 tracks: [half] [dot] [half]. A name spans its 3 tracks,
       so the dot sits exactly under the middle of the name. A line spans
       from one dot to the next, with the same small gap on both sides. */

    .tracker {
      margin-top: 28px;
    }

    .track-grid {
      display: grid;
      align-items: center;
      row-gap: 12px;
    }

    .step-label {
      justify-self: center;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      transition: color .3s;
    }

    .step-label.done { color: var(--text-primary); }

    .dot {
      position: relative;
      justify-self: center;
      width: var(--dot-size);
      height: var(--dot-size);
      display: grid;
      place-items: center;
      border: 2px solid var(--track-dot);
      border-radius: 50%;
      background: #F3F4F6;
      transition: background .35s, border-color .35s, box-shadow .35s;
    }

    /* waiting dot: small grey centre */
    .dot::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--track-dot);
    }

    .dot svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 20%;
      fill: none;
      stroke: #fff;
      stroke-width: 3.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .18));
    }

    .dot.done {
      border-color: #fff;
      background: linear-gradient(145deg, var(--green-1), var(--green-2));
      box-shadow:
        0 0 0 2px rgba(22, 163, 74, .22),
        0 4px 10px rgba(21, 128, 61, .3);
    }

    .dot.done::before { display: none; }

    .dot.done svg {
      stroke-dashoffset: 0;
      transition: stroke-dashoffset .45s ease .12s;
    }

    /* Rounded line pieces between dots */

    .seg {
      position: relative;
      align-self: center;
      min-width: 0;
      height: var(--seg-h);
      margin: 0 var(--seg-gap);
      border-radius: 999px;
      background: var(--track);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, .06);
    }

    .fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: calc(var(--f, 0) * 100%);
      border-radius: 999px;
      background: linear-gradient(90deg, var(--green-1), var(--green-2));
      box-shadow: 0 1px 4px rgba(22, 163, 74, .35);
      transition: width 1s linear;
    }

    .seg.live .fill { min-width: var(--seg-h); }

    /* light sweeping along the live line */
    .shine {
      display: none;
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: linear-gradient(100deg,
        transparent 0%, rgba(255, 255, 255, .6) 50%, transparent 100%);
      background-size: 60% 100%;
      background-repeat: no-repeat;
      animation: sweep 1.8s linear infinite;
    }

    .seg.live .shine { display: block; }

    /* glowing head at the moving end of the live line */
    .seg.live .fill::after {
      content: "";
      position: absolute;
      right: var(--head-pad);
      top: var(--head-pad);
      width: calc(var(--seg-h) - 2 * var(--head-pad));
      height: calc(var(--seg-h) - 2 * var(--head-pad));
      border-radius: 50%;
      background: #fff;
      animation: ripple 1.6s ease-out infinite;
    }

    @keyframes sweep {
      from { background-position: -150% 0; }
      to { background-position: 250% 0; }
    }

    @keyframes ripple {
      0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, .65); }
      70% { box-shadow: 0 0 0 7px rgba(22, 163, 74, 0); }
      100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, .5); }
      70% { box-shadow: 0 0 0 9px rgba(22, 163, 74, 0); }
      100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
    }

    /* Delivery date (left) + live countdown (right) */

    .eta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 14px;
      margin-top: 18px;
    }

    .eta {
      margin: 0;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      text-align: left;
    }

    .eta.delivered { color: var(--success); }

    .live {
      display: none;
      align-items: center;
      gap: 7px;
      color: var(--success);
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .live.on { display: inline-flex; }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green-2);
      animation: pulse 1.6s ease-out infinite;
    }

    /* EMPTY STATE */

    .empty-state {
      padding: 40px 0;
      text-align: center;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 29px;
    }

    .empty-state h2 {
      margin: 0 0 8px;
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.7px;
    }

    .empty-state p {
      max-width: 380px;
      margin: 0 auto 24px;
      color: var(--text-secondary);
    }

    /* FOOTER */

    footer {
      padding: 24px 5%;
      border-top: 1px solid var(--divider);
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
    }

    /* RESPONSIVE — everything stays on one line */

    @media (max-width: 600px) {
      main { margin-top: 25px; }

      :root {
        --dot-size: 18px;
        --seg-h: 8px;
        --seg-gap: 5px;
      }

      .total { font-size: 20px; }

      .order-bottom { gap: 8px; }
      .order-right { gap: 5px; }

      .pill {
        padding: 3px 8px;
        font-size: 11px;
        gap: 4px;
      }

      .pill .ico { display: none; }

      .copy .t-full,
      .pay .t-full { display: none; }

      .copy .t-short,
      .pay .t-short { display: inline; }

      .copy.copied .t-short { display: none; }

      .step-label { font-size: 11px; }
    }

    @media (max-width: 380px) {
      .product-image {
        width: 60px;
        height: 60px;
        padding: 4px;
      }

      .product-name { font-size: 12px; }
      .total { font-size: 18px; }
      .step-label { font-size: 10.5px; }
    }

    /* very narrow phones: copy button becomes icon only */
    @media (max-width: 340px) {
      .copy .t-short { display: none; }
      .copy .cico { display: inline; }
      .copy.copied .t-copied { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fill,
      .dot,
      .dot svg,
      .step-label { transition: none; }

      .shine,
      .seg.live .fill::after,
      .live-dot { animation: none; }
    }
  </style>
</head>

<body>

  <header class="topbar">

    <a href="/"
       class="nav-link"
       aria-label="Back to shop"
       title="Back to shop">
      <i class="ph ph-arrow-left"></i>
    </a>

    <a href="/" class="brand">Sequize.</a>

  </header>

  <main>

    <div class="page-heading">
      <h1>My Orders</h1>
      <p>View your orders and payment status.</p>
    </div>

    <div class="notice">
      <i class="ph ph-info"></i>
      Payment status is shown according to the order records available on
      Sequize. A pending payment is not a confirmed payment.
    </div>

    <div id="message" role="status" aria-live="polite">
      Loading your orders...
    </div>

    <section id="ordersList" aria-label="Your orders"></section>

  </main>

  <footer>
    © <span id="year"></span> Sequize. All rights reserved.
  </footer>

  <script>
    "use strict";

    const ordersList = document.getElementById("ordersList");
    const message = document.getElementById("message");

    // Tracker steps, left to right. Change the order/names here if needed.
    const STEPS = ["Confirmed", "Order placed", "Shipped", "Delivered"];

    // Server time minus device time, so progress follows the server clock
    let serverDrift = 0;

    const CHECK_SVG =
      '<svg viewBox="0 0 24 24" aria-hidden="true">' +
      '<path d="M6 12.5l4.2 4.2L18 8" pathLength="1"/></svg>';

    // Inline placeholder: no external request, so it can never fail to load
    const PLACEHOLDER_IMAGE =
      "data:image/svg+xml;utf8," +
      encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
        '<rect width="100" height="100" fill="#F5F5F2"/>' +
        '<path d="M30 40h40l-4 30H34z" fill="none" stroke="#969991" stroke-width="3" stroke-linejoin="round"/>' +
        '<path d="M42 40v-5a8 8 0 0 1 16 0v5" fill="none" stroke="#969991" stroke-width="3"/>' +
        '</svg>'
      );

    document.getElementById("year").textContent = new Date().getFullYear();

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, function (char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char];
      });
    }

    function formatINR(value) {
      const amount = Number(value);
      if (!Number.isFinite(amount)) return "—";

      return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 2
      }).format(amount);
    }

    function formatDate(value) {
      if (value === undefined || value === null || value === "") {
        return "Date unavailable";
      }

      const date = (typeof value === "number" || /^\d+$/.test(String(value)))
        ? new Date(Number(value))
        : new Date(value);

      if (Number.isNaN(date.getTime())) return "Date unavailable";

      return date.toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function formatDay(ms) {
      return new Date(ms).toLocaleDateString("en-IN", {
        weekday: "short",
        day: "2-digit",
        month: "short",
        year: "numeric"
      });
    }

    function formatLeft(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const d = Math.floor(total / 86400);
      const h = Math.floor((total % 86400) / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      const pad = n => String(n).padStart(2, "0");

      return (d > 0 ? d + "d " : "") + pad(h) + "h " + pad(m) + "m " + pad(s) + "s left";
    }

    function statusIcon(tone) {
      if (tone === "paid") return "ph-check-circle";
      if (tone === "warn") return "ph-warning-circle";
      if (tone === "failed") return "ph-x-circle";
      return "ph-clock";
    }

    /* ---------- Product images ----------
       The orders API sends an image for each item. Only if some are
       still missing do we also use the products API as a backup. */

    let productImages = { byId: {}, byTitle: {} };

    async function loadProductImages() {
      try {
        const response = await fetch("/api/products", {
          headers: { "Accept": "application/json" }
        });
        const data = await response.json();
        const byId = {};
        const byTitle = {};

        (Array.isArray(data.products) ? data.products : []).forEach(p => {
          const img = p.thumbnail || (Array.isArray(p.images) ? p.images[0] : "");
          if (!img) return;
          byId[String(p.id)] = img;
          byTitle[String(p.title || "").trim().toLowerCase()] = img;
        });

        productImages = { byId, byTitle };
      } catch (error) {
        console.error("Product images error:", error);
      }
    }

    function getItemImage(item) {
      const candidate =
        item.thumbnail ||
        item.image ||
        item.imageUrl ||
        (Array.isArray(item.images) ? item.images[0] : "") ||
        productImages.byId[String(item.productId ?? item.id ?? item.product_id ?? "")] ||
        productImages.byTitle[String(item.title || "").trim().toLowerCase()] ||
        "";

      if (!candidate) return PLACEHOLDER_IMAGE;

      try {
        const parsed = new URL(candidate, window.location.origin);

        if (
          parsed.protocol !== "https:" &&
          parsed.origin !== window.location.origin
        ) {
          return PLACEHOLDER_IMAGE;
        }

        return parsed.href;
      } catch {
        return PLACEHOLDER_IMAGE;
      }
    }

    /* ---------- Delivery tracker ----------
       The orders API decides everything (active, start, end).
       The page only draws it and keeps it moving every second. */

    function renderTracker(order) {
      const t = order.tracking;
      if (!t || typeof t !== "object") return "";

      const n = STEPS.length;

      // every step = [half] [dot] [half]; 1fr of free space between steps
      const columns = STEPS
        .map(() => "auto var(--dot-size) auto")
        .join(" 1fr ");

      let cells = "";

      STEPS.forEach((name, i) => {
        cells += `<div class="step-label" style="grid-column:${4 * i + 1} / span 3;grid-row:1">${escapeHTML(name)}</div>`;
      });

      STEPS.forEach((_, i) => {
        cells += `<span class="dot" style="grid-column:${4 * i + 2};grid-row:2">${CHECK_SVG}</span>`;

        if (i < n - 1) {
          // line runs from this dot's edge to the next dot's edge
          cells += `<span class="seg" style="grid-column:${4 * i + 3} / span 3;grid-row:2">` +
                   `<span class="fill"><span class="shine"></span></span></span>`;
        }
      });

      return `
        <div class="tracker"
             role="progressbar"
             aria-label="Delivery progress"
             aria-valuemin="0"
             aria-valuemax="100"
             aria-valuenow="0"
             data-start="${Number(t.startAt) || 0}"
             data-end="${Number(t.endAt) || 0}"
             data-active="${t.active ? "1" : "0"}"
             data-forced="${t.forceDelivered ? "1" : "0"}"
             data-note="${escapeHTML(t.note || "")}">

          <div class="track-grid" style="grid-template-columns:${columns}">
            ${cells}
          </div>

          <div class="eta-row">
            <p class="eta"></p>
            <span class="live"><i class="live-dot"></i><span class="left"></span></span>
          </div>

        </div>
      `;
    }

    function updateTrackers() {
      const now = Date.now() + serverDrift;

      document.querySelectorAll(".tracker").forEach(el => {
        const start = Number(el.dataset.start);
        const end = Number(el.dataset.end);
        const active = el.dataset.active === "1";
        const forced = el.dataset.forced === "1";

        let p = 0;

        if (active) {
          p = forced || end <= start
            ? 1
            : Math.min(1, Math.max(0, (now - start) / (end - start)));
        }

        const segs = el.querySelectorAll(".seg");
        const dots = el.querySelectorAll(".dot");
        const labels = el.querySelectorAll(".step-label");
        const m = segs.length;

        // the line that is moving right now
        const liveIndex = active && p < 1 ? Math.min(m - 1, Math.floor(p * m)) : -1;

        segs.forEach((seg, i) => {
          const f = Math.min(1, Math.max(0, p * m - i));
          seg.style.setProperty("--f", f.toFixed(5));
          seg.classList.toggle("live", i === liveIndex);
        });

        dots.forEach((dot, i) => {
          const done = active && p >= i / m - 1e-9;
          dot.classList.toggle("done", done);
          labels[i].classList.toggle("done", done);
        });

        el.setAttribute("aria-valuenow", String(Math.round(p * 100)));

        const eta = el.querySelector(".eta");
        const live = el.querySelector(".live");
        const delivered = active && p >= 1;

        eta.classList.toggle("delivered", delivered);

        if (!active) {
          eta.textContent = el.dataset.note;
        } else if (delivered) {
          eta.textContent = "Delivered on " + formatDay(end);
        } else {
          eta.textContent = "Delivery by " + formatDay(end);
        }

        const showLive = active && !delivered;
        live.classList.toggle("on", showLive);

        if (showLive) {
          live.querySelector(".left").textContent = formatLeft(end - now);
        }
      });
    }

    /* ---------- Order card ---------- */

    function renderOrder(order) {
      const orderId = String(order.orderId || "");
      const items = Array.isArray(order.items) ? order.items : [];
      const dateText = escapeHTML(formatDate(order.createdAt));

      const productsHTML = items.length
        ? items.map(item => {
            const title = escapeHTML(item.title || "Product");
            const quantity = Math.max(0, Number(item.quantity) || 0);
            const image = escapeHTML(getItemImage(item));

            return `
              <div class="product-row">

                <div class="product-image">
                  <img src="${image}" alt="${title}" loading="lazy">
                </div>

                <div class="product-details">
                  <div class="product-name">${title}</div>
                  <div class="product-info">Quantity: ${quantity}</div>
                  <div class="product-date">${dateText}</div>
                </div>

              </div>
            `;
          }).join("")
        : `
            <div class="product-row">
              <div class="product-details product-info">
                No item details available for this order.
              </div>
            </div>
          `;

      const tone = ["paid", "warn", "failed"].includes(order.statusTone)
        ? order.statusTone
        : "";

      const label = order.statusLabel || "Not paid";

      return `
        <article class="order-card">

          <div class="order-body">
            ${productsHTML}
          </div>

          <div class="order-bottom">

            <div class="order-total">
              <div class="total-label">Order total</div>
              <div class="total">${formatINR(order.totalINR)}</div>
            </div>

            <div class="order-right">

              <span class="pill ${tone}">
                <i class="ph ${statusIcon(tone)} ico"></i>${escapeHTML(label)}
              </span>

              <button class="pill copy"
                      type="button"
                      aria-label="Copy order ID"
                      data-copy-order="${escapeHTML(orderId)}"><i class="ph ph-copy cico"></i><span class="t-full">Copy order ID</span><span class="t-short">Copy ID</span><span class="t-copied">Copied</span></button>

              ${order.canContinuePayment
                ? `<a class="pill pay"
                      href="/payment.html?orderId=${encodeURIComponent(orderId)}"><span class="t-full">Continue to payment</span><span class="t-short">Pay now</span></a>`
                : ""}

            </div>

          </div>

          ${renderTracker(order)}

        </article>
      `;
    }

    async function loadOrders() {
      ordersList.replaceChildren();
      message.textContent = "Loading your orders...";

      try {
        const response = await fetch("/api/orders", {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store",
          headers: { "Accept": "application/json" }
        });

        const data = await response.json().catch(() => ({}));

        if (response.status === 401) {
          message.textContent = "Please log in to view your orders.";

          ordersList.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon"><i class="ph ph-user-circle"></i></div>
              <h2>Login required</h2>
              <p>Log in to your Sequize account to see your orders.</p>
              <a class="primary-btn" href="/login.html">Log in</a>
            </div>
          `;
          return;
        }

        if (!response.ok || data.success !== true) {
          throw new Error(data.message || "Unable to load orders.");
        }

        const orders = Array.isArray(data.orders) ? data.orders : [];

        if (orders.length === 0) {
          message.textContent = "";

          ordersList.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon"><i class="ph ph-shopping-bag-open"></i></div>
              <h2>No orders yet</h2>
              <p>Your orders will appear here after you place an order.</p>
              <a class="primary-btn" href="/shop.html">Start shopping</a>
            </div>
          `;
          return;
        }

        serverDrift = (Number(data.serverTime) || Date.now()) - Date.now();

        const missingImage = orders.some(o =>
          (Array.isArray(o.items) ? o.items : []).some(i => !i.thumbnail && !i.image)
        );
        if (missingImage) await loadProductImages();

        message.textContent =
          `${orders.length} order${orders.length === 1 ? "" : "s"} found.`;

        ordersList.innerHTML = orders.map(renderOrder).join("");

        updateTrackers();

      } catch (error) {
        console.error("Load orders error:", error);
        message.textContent =
          "We couldn't load your orders. Please reload the page to try again.";
      }
    }

    // If an image fails to load, swap in the placeholder
    ordersList.addEventListener("error", function (event) {
      const img = event.target;
      if (img.tagName === "IMG" && img.src !== PLACEHOLDER_IMAGE) {
        img.src = PLACEHOLDER_IMAGE;
      }
    }, true);

    ordersList.addEventListener("click", async function (event) {
      const copyButton = event.target.closest("[data-copy-order]");
      if (!copyButton) return;

      try {
        await navigator.clipboard.writeText(copyButton.dataset.copyOrder);
        copyButton.classList.add("copied");

        setTimeout(() => {
          if (copyButton.isConnected) {
            copyButton.classList.remove("copied");
          }
        }, 1500);
      } catch (error) {
        console.error("Copy order ID error:", error);
        message.textContent =
          "Copy failed. Please select and copy the order ID manually.";
      }
    });

    // Live: every order's line and countdown move every second
    setInterval(function () {
      if (!document.hidden) updateTrackers();
    }, 1000);

    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) updateTrackers();
    });

    loadOrders();
  </script>

</body>
</html>
