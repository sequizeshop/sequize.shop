<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>My Orders — Sequize</title>

  <link rel="icon" type="image/png"
    href="https://i.ibb.co/93kQCKxT/20261019-120246.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet"
    href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">

  <link rel="stylesheet" href="/global.css">

  <style>
    :root {
      --primary: #2962FF;
      --primary-hover: #0059D7;
      --primary-soft: #EDF2FF;
      --background: #FFFFFF;
      --surface-secondary: #F5F5F2;
      --text-primary: #1E1F1C;
      --text-secondary: #666960;
      --text-muted: #969991;
      --border: #E5E7EB;
      --divider: #E5E7EB;
      --success: #15803D;
      --success-bg: #ECFDF3;
      --error: #DC2626;
      --error-bg: #FEF2F2;

      --font-body: "DM Sans", sans-serif;
      --font-heading: "Manrope", sans-serif;

      --radius-md: 9px;
      --radius-lg: 12px;

      --header-h: 64px;
    }

    * { box-sizing: border-box; }

    body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.7;
      background: var(--background);
      color: var(--text-primary);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a { text-decoration: none; color: inherit; }
    button { font: inherit; cursor: pointer; }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    /* HEADER */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      height: var(--header-h);
      padding: 0 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--background);
      border-bottom: 1px solid var(--border);
    }

    .nav-link {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 24px;
      line-height: 1;
    }

    .nav-link:hover { background: var(--surface-secondary); }

    .brand {
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 800;
      line-height: 1.4;
      letter-spacing: -0.7px;
      color: var(--primary);
    }

    /* PAGE */

    main {
      width: min(1050px, 90%);
      margin: 34px auto 65px;
      min-height: 55vh;
    }

    .page-heading { margin: 0 0 28px; }

    .page-heading h1 {
      font-family: var(--font-heading);
      font-size: clamp(27px, 4vw, 36px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -1.2px;
      margin: 0 0 8px;
    }

    .page-heading p {
      margin: 0;
      color: var(--text-secondary);
    }

    .primary-btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border: 1px solid var(--primary);
      border-radius: var(--radius-lg);
      background: var(--primary);
      color: #fff;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 700;
      transition: background .2s, border-color .2s;
    }

    .primary-btn:hover {
      border-color: var(--primary-hover);
      background: var(--primary-hover);
    }

    /* MESSAGE */

    #message {
      margin: 0 0 18px;
      color: var(--text-secondary);
    }

    #message:empty { display: none; }

    .notice {
      padding: 12px 15px;
      margin-bottom: 24px;
      border-radius: var(--radius-lg);
      background: var(--primary-soft);
      font-size: 13px;
    }

    .notice i {
      color: var(--primary);
      vertical-align: -2px;
    }

    /* ORDER */

    .order-card {
      padding: 27px 0;
      border-bottom: 1px solid var(--divider);
    }

    .order-card:first-child { padding-top: 0; }

    .order-card:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    /* PRODUCTS: dividers only between products */

    .product-row {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 0;
    }

    .product-row:first-child { padding-top: 0; }
    .product-row:last-child { padding-bottom: 0; }

    .product-row + .product-row {
      border-top: 1px solid var(--divider);
    }

    .product-image {
      width: 76px;
      height: 76px;
      flex-shrink: 0;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-md);
      background: var(--surface-secondary);
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .product-details {
      flex: 1;
      min-width: 0;
    }

    .product-name {
      font-family: var(--font-heading);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .product-info {
      margin-top: 2px;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.6;
    }

    .product-date {
      color: var(--text-muted);
      font-size: 12px;
    }

    /* TOTAL + STATUS + ACTIONS */

    .order-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px 18px;
      margin-top: 18px;
    }

    .total-label {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .total {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -.7px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .order-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Small pill: used by status tags and buttons alike */

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border: 0;
      border-radius: 999px;
      background: var(--surface-secondary);
      color: var(--text-secondary);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.7;
      white-space: nowrap;
    }

    .pill i { font-size: 14px; }

    .pill.paid {
      background: var(--success-bg);
      color: var(--success);
    }

    .pill.failed {
      background: var(--error-bg);
      color: var(--error);
    }

    button.pill,
    a.pill { transition: background .2s, color .2s; }

    button.pill.copy {
      background: var(--primary-soft);
      color: var(--primary);
    }

    button.pill.copy:hover { background: #dbe6ff; }

    a.pill.pay {
      background: var(--primary);
      color: #fff;
    }

    a.pill.pay:hover { background: var(--primary-hover); }

    /* EMPTY STATE */

    .empty-state {
      padding: 40px 0;
      text-align: center;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 29px;
    }

    .empty-state h2 {
      margin: 0 0 8px;
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.7px;
    }

    .empty-state p {
      max-width: 380px;
      margin: 0 auto 24px;
      color: var(--text-secondary);
    }

    /* FOOTER */

    footer {
      padding: 24px 5%;
      border-top: 1px solid var(--divider);
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
    }

    /* RESPONSIVE */

    @media (max-width: 760px) {
      main { margin-top: 25px; }

      .order-bottom {
        flex-direction: column;
        align-items: flex-start;
      }

      .order-right { justify-content: flex-start; }
    }

    @media (max-width: 380px) {
      .product-image {
        width: 60px;
        height: 60px;
        padding: 4px;
      }

      .product-name { font-size: 12px; }
      .total { font-size: 22px; }
    }
  </style>
</head>

<body>

  <header class="topbar">

    <a href="/"
       class="nav-link"
       aria-label="Back to shop"
       title="Back to shop">
      <i class="ph ph-arrow-left"></i>
    </a>

    <a href="/" class="brand">Sequize.</a>

  </header>

  <main>

    <div class="page-heading">
      <h1>My Orders</h1>
      <p>View your orders and payment status.</p>
    </div>

    <div class="notice">
      <i class="ph ph-info"></i>
      Payment status is shown according to the order records available on
      Sequize. A pending payment is not a confirmed payment.
    </div>

    <div id="message" role="status" aria-live="polite">
      Loading your orders...
    </div>

    <section id="ordersList" aria-label="Your orders"></section>

  </main>

  <footer>
    © <span id="year"></span> Sequize. All rights reserved.
  </footer>

  <script>
    "use strict";

    const ordersList = document.getElementById("ordersList");
    const message = document.getElementById("message");

    // Inline placeholder: no external request, so it can never fail to load
    const PLACEHOLDER_IMAGE =
      "data:image/svg+xml;utf8," +
      encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
        '<rect width="100" height="100" fill="#F5F5F2"/>' +
        '<path d="M30 40h40l-4 30H34z" fill="none" stroke="#969991" stroke-width="3" stroke-linejoin="round"/>' +
        '<path d="M42 40v-5a8 8 0 0 1 16 0v5" fill="none" stroke="#969991" stroke-width="3"/>' +
        '</svg>'
      );

    document.getElementById("year").textContent = new Date().getFullYear();

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, function (char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char];
      });
    }

    function formatINR(value) {
      const amount = Number(value);
      if (!Number.isFinite(amount)) return "—";

      return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 2
      }).format(amount);
    }

    function formatDate(value) {
      if (value === undefined || value === null || value === "") {
        return "Date unavailable";
      }

      const date = (typeof value === "number" || /^\d+$/.test(String(value)))
        ? new Date(Number(value))
        : new Date(value);

      if (Number.isNaN(date.getTime())) return "Date unavailable";

      return date.toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function readableStatus(value) {
      return String(value || "UNKNOWN")
        .replace(/_/g, " ")
        .toLowerCase()
        .replace(/\b\w/g, letter => letter.toUpperCase());
    }

    /* Green for every "good" state, red for every "bad" state, gray otherwise */
    const GOOD = [
      "PAID", "SUCCESS", "SUCCESSFUL", "COMPLETED", "CONFIRMED",
      "CAPTURED", "AUTHORIZED", "DELIVERED", "SHIPPED", "PROCESSING"
    ];
    const BAD = ["FAILED", "CANCELLED", "CANCELED", "EXPIRED", "REFUNDED"];

    function statusClass(status) {
      const value = String(status || "").toUpperCase().replace(/\s+/g, "_");
      if (GOOD.includes(value)) return "paid";
      if (BAD.includes(value)) return "failed";
      return "";
    }

    function statusIcon(cls) {
      if (cls === "paid") return "ph-check-circle";
      if (cls === "failed") return "ph-x-circle";
      return "ph-clock";
    }

    /* ---------- Product images ----------
       The orders API may not send an image for each item.
       So we also load the products API (same one the home page uses)
       and match each order item to its product by id (or title). */

    let productImages = { byId: {}, byTitle: {} };

    async function loadProductImages() {
      try {
        const response = await fetch("/api/products", {
          headers: { "Accept": "application/json" }
        });
        const data = await response.json();
        const byId = {};
        const byTitle = {};

        (Array.isArray(data.products) ? data.products : []).forEach(p => {
          const img = p.thumbnail || (Array.isArray(p.images) ? p.images[0] : "");
          if (!img) return;
          byId[String(p.id)] = img;
          byTitle[String(p.title || "").trim().toLowerCase()] = img;
        });

        productImages = { byId, byTitle };
      } catch (error) {
        console.error("Product images error:", error);
      }
    }

    function getItemImage(item) {
      const candidate =
        item.thumbnail ||
        item.image ||
        item.imageUrl ||
        (Array.isArray(item.images) ? item.images[0] : "") ||
        productImages.byId[String(item.productId ?? item.id ?? item.product_id ?? "")] ||
        productImages.byTitle[String(item.title || "").trim().toLowerCase()] ||
        "";

      if (!candidate) return PLACEHOLDER_IMAGE;

      try {
        const parsed = new URL(candidate, window.location.origin);

        if (
          parsed.protocol !== "https:" &&
          parsed.origin !== window.location.origin
        ) {
          return PLACEHOLDER_IMAGE;
        }

        return parsed.href;
      } catch {
        return PLACEHOLDER_IMAGE;
      }
    }

    /* ---------- Render ---------- */

    function renderOrder(order) {
      const orderId = String(order.orderId || "");
      const paymentStatus = String(order.paymentStatus || "PENDING");
      const orderStatus = String(order.orderStatus || "PENDING");
      const items = Array.isArray(order.items) ? order.items : [];
      const dateText = escapeHTML(formatDate(order.createdAt));

      const productsHTML = items.length
        ? items.map(item => {
            const title = escapeHTML(item.title || "Product");
            const quantity = Math.max(0, Number(item.quantity) || 0);
            const image = escapeHTML(getItemImage(item));

            return `
              <div class="product-row">

                <div class="product-image">
                  <img src="${image}" alt="${title}" loading="lazy">
                </div>

                <div class="product-details">
                  <div class="product-name">${title}</div>
                  <div class="product-info">Quantity: ${quantity}</div>
                  <div class="product-date">${dateText}</div>
                </div>

              </div>
            `;
          }).join("")
        : `
            <div class="product-row">
              <div class="product-details product-info">
                No item details available for this order.
              </div>
            </div>
          `;

      const upperPayment = paymentStatus.toUpperCase();
      const upperOrder = orderStatus.toUpperCase();

      const canContinuePayment =
        upperPayment === "PENDING" &&
        !["CANCELLED", "FAILED", "COMPLETED", "DELIVERED"].includes(upperOrder);

      const payClass = statusClass(paymentStatus);
      const orderClass = statusClass(orderStatus);

      return `
        <article class="order-card">

          <div class="order-body">
            ${productsHTML}
          </div>

          <div class="order-bottom">

            <div class="order-total">
              <div class="total-label">Order total</div>
              <div class="total">${formatINR(order.totalINR)}</div>
            </div>

            <div class="order-right">

              <span class="pill ${payClass}">
                <i class="ph ${statusIcon(payClass)}"></i>
                Payment: ${escapeHTML(readableStatus(paymentStatus))}
              </span>

              <span class="pill ${orderClass}">
                ${escapeHTML(readableStatus(orderStatus))}
              </span>

              <button class="pill copy"
                      type="button"
                      data-copy-order="${escapeHTML(orderId)}">Copy order ID</button>

              ${canContinuePayment
                ? `<a class="pill pay"
                      href="/payment.html?orderId=${encodeURIComponent(orderId)}">Continue to payment</a>`
                : ""}

            </div>

          </div>

        </article>
      `;
    }

    async function loadOrders() {
      ordersList.replaceChildren();
      message.textContent = "Loading your orders...";

      try {
        const response = await fetch("/api/orders", {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store",
          headers: { "Accept": "application/json" }
        });

        const data = await response.json().catch(() => ({}));

        if (response.status === 401) {
          message.textContent = "Please log in to view your orders.";

          ordersList.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon"><i class="ph ph-user-circle"></i></div>
              <h2>Login required</h2>
              <p>Log in to your Sequize account to see your orders.</p>
              <a class="primary-btn" href="/login.html">Log in</a>
            </div>
          `;
          return;
        }

        if (!response.ok || data.success !== true) {
          throw new Error(data.message || "Unable to load orders.");
        }

        const orders = Array.isArray(data.orders) ? data.orders : [];

        if (orders.length === 0) {
          message.textContent = "";

          ordersList.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon"><i class="ph ph-shopping-bag-open"></i></div>
              <h2>No orders yet</h2>
              <p>Your orders will appear here after you place an order.</p>
              <a class="primary-btn" href="/shop.html">Start shopping</a>
            </div>
          `;
          return;
        }

        // The orders API already sends item images. Only if some are
        // still missing, fall back to the products API.
        const missingImage = orders.some(o =>
          (Array.isArray(o.items) ? o.items : []).some(i => !i.thumbnail && !i.image)
        );
        if (missingImage) await loadProductImages();

        message.textContent =
          `${orders.length} order${orders.length === 1 ? "" : "s"} found.`;

        ordersList.innerHTML = orders.map(renderOrder).join("");

      } catch (error) {
        console.error("Load orders error:", error);
        message.textContent =
          "We couldn't load your orders. Please reload the page to try again.";
      }
    }

    // If an image fails to load, swap in the placeholder
    ordersList.addEventListener("error", function (event) {
      const img = event.target;
      if (img.tagName === "IMG" && img.src !== PLACEHOLDER_IMAGE) {
        img.src = PLACEHOLDER_IMAGE;
      }
    }, true);

    ordersList.addEventListener("click", async function (event) {
      const copyButton = event.target.closest("[data-copy-order]");
      if (!copyButton) return;

      try {
        await navigator.clipboard.writeText(copyButton.dataset.copyOrder);
        copyButton.textContent = "Copied";

        setTimeout(() => {
          if (copyButton.isConnected) {
            copyButton.textContent = "Copy order ID";
          }
        }, 1500);
      } catch (error) {
        console.error("Copy order ID error:", error);
        message.textContent =
          "Copy failed. Please select and copy the order ID manually.";
      }
    });

    loadOrders();
  </script>

</body>
</html>
