<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>My Cart — Shoppy</title>

  <link rel="icon" type="image/png" href="https://i.ibb.co/93kQCKxT/20261019-120246.png">
  <link rel="stylesheet" href="/global.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      /* Shoppy design tokens */
      --primary: #2962FF;
      --primary-hover: #0059D7;
      --primary-soft: #EDF2FF;
      --primary-selected: #F8FAFF;
      --background: #FFFFFF;
      --surface: #FFFFFF;
      --surface-secondary: #F5F5F2;
      --text-primary: #1E1F1C;
      --text-secondary: #666960;
      --text-muted: #969991;
      --border: #E5E7EB;
      --divider: #E5E7EB;
      --success: #15803D;
      --success-bg: #ECFDF3;
      --error: #DC2626;
      --disabled-bg: #E5E7EB;
      --disabled-text: #969991;

      --font-body: "DM Sans", sans-serif;
      --font-heading: "Manrope", sans-serif;

      --radius-sm: 5px;
      --radius-md: 9px;
      --radius-lg: 12px;

      --header-h: 64px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      margin: 0 !important;
      padding: 0 !important;
      scroll-padding-top: 0;
    }

    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100%;
      min-height: 100vh;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.7;
      background: var(--background);
      color: var(--text-primary);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    [hidden] {
      display: none !important;
    }

    /* HEADER */

    .topbar {
      position: sticky;
      top: 0 !important;
      margin-top: 0 !important;
      transform: none;
      z-index: 100;
      width: 100%;
      height: var(--header-h);
      min-height: var(--header-h);
      padding: 0 max(2%, calc((100% - 1440px) / 2));
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--background);
      border-bottom: 1px solid var(--border);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: var(--radius-md);
      font-size: 24px;
      line-height: 1;
      color: var(--text-primary);
    }

    .nav-icon:hover {
      background: var(--surface-secondary);
    }

    .brand {
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 800;
      line-height: 1.4;
      letter-spacing: -0.7px;
      color: var(--primary);
    }

    /* PAGE */

    .container {
      width: min(1440px, 96%);
      max-width: 1440px;
      margin: 34px auto 65px;
      background: transparent;
    }

    .page-heading {
      margin: 0 0 28px;
    }

    .page-heading h1 {
      font-family: var(--font-heading);
      font-size: clamp(27px, 4vw, 36px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -1.2px;
      margin-bottom: 8px;
    }

    .page-heading p {
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.7;
    }

    .cart-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(300px, 0.8fr);
      column-gap: 58px;
      row-gap: 0;
      align-items: start;
      width: 100%;
      min-width: 0;
    }

    /* CART ITEMS (divider rows, no outer cards) */

    .cart-items {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: transparent;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr) 112px;
      align-items: center;
      column-gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid var(--divider);
      background: transparent;
      min-width: 0;
    }

    .cart-item:first-child {
      padding-top: 0;
    }

    .cart-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .item-image {
      width: 96px;
      aspect-ratio: 1 / 1;
      height: auto;
      min-width: 0;
      border-radius: var(--radius-md);
      background: var(--surface-secondary);
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .item-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .item-info {
      min-width: 0;
      flex: 1;
    }

    .item-title {
      font-family: var(--font-heading);
      font-size: 14px;
      line-height: 1.5;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .item-unit-price {
      margin-top: 2px;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .item-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 7px;
    }

    .quantity-control {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .quantity-control button {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: var(--surface-secondary);
      color: var(--text-primary);
      border-radius: var(--radius-md);
      font-size: 17px;
    }

    .quantity-control button:hover:not(:disabled) {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .quantity-control button:disabled {
      background: var(--disabled-bg);
      color: var(--disabled-text);
      cursor: not-allowed;
    }

    .quantity-value {
      min-width: 18px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
    }

    .remove-button {
      border: 0;
      background: transparent;
      color: var(--error);
      font-size: 13px;
      font-weight: 600;
      padding: 0;
    }

    .remove-button:hover:not(:disabled) {
      text-decoration: underline;
    }

    .remove-button:disabled {
      color: var(--disabled-text);
      cursor: not-allowed;
    }

    .item-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 0;
      width: 100%;
    }

    .item-total {
      min-width: 0;
      width: 100%;
      text-align: center;
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* SUMMARY (no card) */

    .summary {
      min-width: 0;
      width: 100%;
      position: sticky;
      top: calc(var(--header-h) + 25px);
      align-self: start;
      background: transparent;
    }

    .summary h2 {
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.7px;
      margin-bottom: 18px;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 12px 0;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .summary-line strong {
      color: var(--text-primary);
      font-weight: 600;
      text-align: right;
    }

    .summary-divider {
      display: none;
    }

    .summary-line .discount-value {
      color: var(--success);
    }

    .tax-total-line {
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }

    .tax-total-line strong {
      color: var(--text-primary);
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--divider);
      font-family: var(--font-heading);
      font-size: 17px;
      font-weight: 800;
    }

    /* BUTTONS (text only) */

    .checkout-button,
    .clear-cart-button {
      width: 100%;
      min-height: 48px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 700;
      transition: background .2s, border-color .2s, color .2s;
    }

    .checkout-button {
      margin-top: 24px;
      border: 1px solid var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .checkout-button:hover:not(:disabled) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .checkout-button:disabled {
      background: var(--disabled-bg);
      border-color: var(--disabled-bg);
      color: var(--disabled-text);
      cursor: not-allowed;
    }

    .clear-cart-button {
      margin-top: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--error);
    }

    .clear-cart-button:hover:not(:disabled) {
      border-color: var(--error);
    }

    .clear-cart-button:disabled {
      color: var(--disabled-text);
      cursor: not-allowed;
    }

    /* STATUS */

    .status {
      padding: 50px 0;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.7;
      background: transparent;
    }

    .status > i {
      display: block;
      font-size: 45px;
      margin-bottom: 15px;
      color: var(--text-muted);
    }

    .status h2 {
      font-family: var(--font-heading);
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .status-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
      padding: 12px 24px;
      min-height: 48px;
      border: 0;
      border-radius: var(--radius-lg);
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    .status-button:hover {
      background: var(--primary-hover);
    }

    /* SKELETON */

    .skeleton-card {
      display: flex;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid var(--divider);
    }

    .skeleton-card:first-child {
      padding-top: 0;
    }

    .skeleton-card:last-child {
      border-bottom: none;
    }

    .skeleton-box {
      background: var(--surface-secondary);
      border-radius: var(--radius-sm);
    }

    /* TOAST */

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translate(-50%, 15px);
      padding: 12px 18px;
      border-radius: var(--radius-lg);
      background: var(--text-primary);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      z-index: 100;
      text-align: center;
      max-width: calc(100% - 30px);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* FOOTER */

    .footer {
      border-top: 1px solid var(--divider);
      padding: 24px 5%;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      color: var(--text-muted);
      font-size: 12px;
      background: var(--background);
    }

    /* RESPONSIVE */

    @media (max-width: 760px) {
      .topbar {
        padding-left: 3%;
        padding-right: 3%;
      }

      .container {
        width: 90%;
        margin-top: 25px;
      }

      .page-heading h1 {
        font-size: 29px;
      }

      .cart-layout {
        grid-template-columns: minmax(0, 1fr);
        column-gap: 0;
        row-gap: 30px;
      }

      .summary {
        order: -1;
        position: static;
      }

      .summary h2 {
        font-size: 21px;
      }

      .cart-item {
        grid-template-columns: 76px minmax(0, 1fr) 92px;
        column-gap: 10px;
        align-items: center;
      }

      .item-image {
        width: 76px;
        aspect-ratio: 1 / 1;
        height: auto;
        padding: 6px;
      }

      .item-controls {
        margin-top: 6px;
      }

      .quantity-control {
        gap: 8px;
      }

      .quantity-control button {
        width: 25px;
        height: 25px;
      }

      .item-side {
        gap: 7px;
      }

      .item-total {
        font-size: 13px;
      }
    }

    @media (max-width: 380px) {
      .cart-item {
        grid-template-columns: 62px minmax(0, 1fr) 82px;
        column-gap: 8px;
      }

      .item-image {
        width: 62px;
        aspect-ratio: 1 / 1;
        height: auto;
        padding: 5px;
      }

      .item-title {
        font-size: 12px;
      }

      .item-unit-price,
      .item-total {
        font-size: 12px;
      }

      .quantity-control {
        gap: 5px;
      }

      .quantity-control button {
        width: 23px;
        height: 23px;
        font-size: 15px;
      }

      .quantity-value {
        min-width: 14px;
        font-size: 12px;
      }

      .remove-button {
        font-size: 12px;
      }
    }
    </style>
</head>

<body>

  <header class="topbar">
    <nav class="nav-actions" aria-label="Main navigation">
      <a class="nav-icon" href="javascript:history.back()" aria-label="Back to previous page" title="Back">
        <i class="ph ph-arrow-left" aria-hidden="true"></i>
      </a>
    </nav>

    <a href="/home.html" class="brand" aria-label="Shoppy home">Shoppy.</a>
  </header>

  <main class="container">

    <div class="page-heading">
      <h1>My Shopping Cart</h1>
      <p>Your selected products, all in one place.</p>
    </div>

    <div class="cart-layout">

      <section id="cartItems" class="cart-items" aria-live="polite" aria-busy="true"></section>

      <aside class="summary">

        <h2>Order Summary</h2>

        <div class="summary-line">
          <span>Items</span>
          <strong id="summaryQuantity">0</strong>
        </div>

        <div class="summary-line">
          <span>Subtotal</span>
          <strong id="summarySubtotal">₹0.00</strong>
        </div>

        <div id="summaryAdjustments" aria-live="polite"></div>

        <div class="summary-total total-row">
          <span>Total</span>
          <strong id="summaryTotal">₹0.00</strong>
        </div>

        <button id="checkoutButton" class="checkout-button" type="button" disabled>
          Continue to Checkout
        </button>

        <button id="clearCartButton" class="clear-cart-button" type="button" hidden>
          Clear Cart
        </button>

      </aside>

    </div>
  </main>

  <footer class="footer">
    <span>© <span id="year"></span> Shoppy</span>
    <span>Your shopping, all in one place.</span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    const cartItemsEl = document.getElementById("cartItems");
    const summaryQuantity = document.getElementById("summaryQuantity");
    const summarySubtotal = document.getElementById("summarySubtotal");
    const summaryTotal = document.getElementById("summaryTotal");
    const summaryAdjustments = document.getElementById("summaryAdjustments");
    const checkoutButton = document.getElementById("checkoutButton");
    const clearCartButton = document.getElementById("clearCartButton");
    const toast = document.getElementById("toast");

    const USD_TO_INR = 85;
    let cart = [];
    let toastTimer = null;
    let busy = false;
    let taxSettings = [{ title: "GST", percent: 18 }];
    let eligibleDiscounts = [];

    document.getElementById("year").textContent = new Date().getFullYear();

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    function formatPrice(price) {
      const usdPrice = Number(price) || 0;
      const inrPrice = usdPrice * USD_TO_INR;
      return new Intl.NumberFormat("en-IN", {
        style: "currency", currency: "INR", minimumFractionDigits: 2, maximumFractionDigits: 2
      }).format(inrPrice);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.classList.remove("show"); }, 2200);
    }

    function trimPercent(value) {
      return Number(value).toFixed(2).replace(/\\.?0+$/, "");
    }

    async function loadTaxSettings() {
      try {
        const response = await fetch("https://apisequizeshoplite.vercel.app/api/admin/taxes", {
          method: "GET", headers: { Accept: "application/json" }, cache: "no-store"
        });
        const data = await response.json().catch(() => ({}));
        if (response.ok && data.success && Array.isArray(data.taxes)) {
          taxSettings = data.taxes.filter(t => t && String(t.title || "").trim() &&
            Number.isFinite(Number(t.percent)) && Number(t.percent) >= 0 && Number(t.percent) <= 100);
        }
      } catch (error) {
        console.warn("Could not load tax settings; using GST default.", error);
      }
    }

    async function loadDiscountSettings() {
      try {
        let email = "";
        try {
          const cached = JSON.parse(localStorage.getItem("shoppy_profile_cache_v1") || "null");
          if (cached && cached.user && cached.user.email && Number(cached.expiresAt) > Date.now()) {
            email = String(cached.user.email).trim().toLowerCase();
          }
        } catch (_) {}
        if (!email) {
          try {
            const response = await fetch("/api/profile", {
              method: "GET", credentials: "same-origin",
              headers: { Accept: "application/json" }, cache: "no-store"
            });
            const data = await response.json().catch(() => ({}));
            if (response.ok && data.success && data.user && data.user.email) {
              email = String(data.user.email).trim().toLowerCase();
            }
          } catch (_) {}
        }
        const endpoint = "https://apisequizeshoplite.vercel.app/api/admin/discounts" +
          (email ? "?email=" + encodeURIComponent(email) : "");
        const response = await fetch(endpoint, {
          method: "GET", headers: { Accept: "application/json" }, cache: "no-store"
        });
        const data = await response.json().catch(() => ({}));
        if (response.ok && data.success && Array.isArray(data.discounts)) {
          eligibleDiscounts = data.discounts.filter(d => d && Number(d.percent) > 0 && Number(d.percent) <= 100);
        }
      } catch (error) {
        console.warn("Could not load discount settings.", error);
      }
    }

    function renderSkeleton() {
      cartItemsEl.setAttribute("aria-busy", "true");
      cartItemsEl.innerHTML = Array.from({ length: 3 }, () => `
        <div class="skeleton-card" aria-hidden="true">
          <div class="skeleton-box" style="width:96px; aspect-ratio:1 / 1; height:auto; border-radius:9px;"></div>
          <div style="flex:1;">
            <div class="skeleton-box" style="height:15px; width:80%; margin-bottom:10px;"></div>
            <div class="skeleton-box" style="height:12px; width:40%;"></div>
          </div>
        </div>
      `).join("");
      summaryQuantity.textContent = "—";
      summarySubtotal.textContent = "Loading…";
      summaryAdjustments.innerHTML = "";
      summaryTotal.textContent = "Loading…";
      checkoutButton.disabled = true;
      clearCartButton.hidden = true;
    }

    async function cartRequest(method, body) {
      const options = {
        method, headers: { Accept: "application/json" }, credentials: "same-origin", cache: "no-store"
      };
      if (body !== undefined) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(body);
      }
      const response = await fetch("/api/cart", options);
      const text = await response.text();
      let data;
      try { data = JSON.parse(text); } catch { throw new Error(`Cart API valid JSON nahi de rahi (HTTP ${response.status}).`); }
      if (response.status === 401) { window.location.href = "/login.html"; throw new Error("Login required."); }
      if (!response.ok || data.success !== true) { throw new Error(data.message || "Cart request fail ho gayi."); }
      return data;
    }

    async function loadCart() {
      renderSkeleton();
      try {
        const data = await cartRequest("GET");
        cart = Array.isArray(data.items) ? data.items : [];
        try { localStorage.setItem("shoppy_cart", JSON.stringify(cart)); } catch (error) { console.warn("Could not update local cart cache:", error); }
        renderCart();
      } catch (error) {
        console.error("Cart loading error:", error);
        if (error.message === "Login required.") return;
        cartItemsEl.innerHTML = `
          <div class="status">
            <i class="ph ph-warning-circle"></i>
            <h2>Unable to load cart</h2>
            <p>${escapeHTML(error.message)}</p>
            <button type="button" id="retryCart" class="status-button">Try Again</button>
          </div>
        `;
        document.getElementById("retryCart").addEventListener("click", loadCart);
      } finally {
        cartItemsEl.setAttribute("aria-busy", "false");
      }
    }

    function renderCart() {
      const totalQuantity = cart.reduce((sum, item) => sum + (Number(item.quantity) || 1), 0);
      const subtotal = cart.reduce((sum, item) => sum + (Number(item.price) || 0) * (Number(item.quantity) || 1), 0);
      const discount = eligibleDiscounts.slice().sort((a, b) => Number(b.percent) - Number(a.percent))[0] || null;
      const discountAmount = discount ? subtotal * Number(discount.percent) / 100 : 0;
      const taxableAmount = Math.max(0, subtotal - discountAmount);
      const taxes = taxSettings.map(tax => ({
        ...tax,
        amount: taxableAmount * (Number(tax.percent) || 0) / 100
      }));
      const totalTax = taxes.reduce((sum, tax) => sum + tax.amount, 0);
      const total = taxableAmount + totalTax;

      summaryQuantity.textContent = String(totalQuantity);
      summarySubtotal.textContent = formatPrice(subtotal);
      summaryAdjustments.innerHTML =
        (discount ? `<div class="summary-line"><span>${escapeHTML(discount.title || "Discount")} (${trimPercent(Number(discount.percent))}% off)</span><strong class="discount-value">−${formatPrice(discountAmount)}</strong></div>` : "") +
        taxes.map(tax => `<div class="summary-line"><span>${escapeHTML(tax.title)} (${trimPercent(Number(tax.percent))}%)</span><strong>${formatPrice(tax.amount)}</strong></div>`).join("") +
        (taxes.length ? `<div class="summary-line tax-total-line"><span>Total taxes</span><strong>${formatPrice(totalTax)}</strong></div>` : "");
      summaryTotal.textContent = formatPrice(total);

      checkoutButton.disabled = cart.length === 0 || busy;
      clearCartButton.hidden = cart.length === 0;
      clearCartButton.disabled = busy;

      if (!cart.length) {
        cartItemsEl.innerHTML = `
          <div class="status">
            <i class="ph ph-shopping-cart"></i>
            <h2>Your cart is empty</h2>
            <p>Looks like you haven't added any products yet.</p>
            <a href="/home.html" class="status-button">Start Shopping</a>
          </div>
        `;
        return;
      }

      cartItemsEl.innerHTML = cart.map(item => {
        const image = escapeHTML(item.thumbnail || "");
        const title = escapeHTML(item.title || "Product");
        const id = escapeHTML(item.id);
        const quantity = Math.max(1, Number(item.quantity) || 1);
        const price = Math.max(0, Number(item.price) || 0);

        return `
          <article class="cart-item" data-id="${id}">
            <div class="item-image">
              <img src="${image}" alt="${title}" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/300x300/f5f5f2/969991?text=Product';">
            </div>

            <div class="item-info">
                <h3 class="item-title">${title}</h3>
                <p class="item-unit-price">${formatPrice(price)} each</p>
                <div class="item-controls">
                  <button class="remove-button" type="button" data-action="remove" data-id="${id}" ${busy ? "disabled" : ""}>Remove</button>
                </div>
              </div>

              <div class="item-side">
                <div class="quantity-control">
                  <button type="button" data-action="decrease" data-id="${id}" aria-label="Decrease quantity" ${quantity <= 1 || busy ? "disabled" : ""}>−</button>
                  <span class="quantity-value">${quantity}</span>
                  <button type="button" data-action="increase" data-id="${id}" aria-label="Increase quantity" ${quantity >= 99 || busy ? "disabled" : ""}>+</button>
                </div>
                <div class="item-total">${formatPrice(price * quantity)}</div>
              </div>
          </article>
        `;
      }).join("");

      cartItemsEl.querySelectorAll("[data-action]").forEach(button => {
        button.addEventListener("click", () => {
          handleCartAction(button.dataset.action, button.dataset.id);
        });
      });
    }

    async function handleCartAction(action, id) {
      if (busy) return;
      const item = cart.find(product => String(product.id) === String(id));
      if (!item) return;

      busy = true;
      renderCart();

      try {
        if (action === "increase" || action === "decrease") {
          let quantity = Number(item.quantity) || 1;
          quantity = action === "increase" ? Math.min(99, quantity + 1) : Math.max(1, quantity - 1);
          const data = await cartRequest("PATCH", { id, quantity });
          cart = Array.isArray(data.items) ? data.items : [];
          showToast("Quantity updated");
        } else if (action === "remove") {
          const data = await cartRequest("DELETE", { id });
          cart = Array.isArray(data.items) ? data.items : [];
          showToast("Product removed from cart");
        }
        try { localStorage.setItem("shoppy_cart", JSON.stringify(cart)); } catch (error) { console.warn("Could not update local cart cache:", error); }
      } catch (error) {
        console.error("Cart update error:", error);
        if (error.message !== "Login required.") { showToast(error.message || "Cart update nahi hua"); }
      } finally {
        busy = false;
        renderCart();
      }
    }

    clearCartButton.addEventListener("click", async () => {
      if (busy || cart.length === 0) return;
      if (!window.confirm("Kya aap apne cart ke saare products remove karna chahte hain?")) return;

      busy = true;
      renderCart();

      try {
        const data = await cartRequest("DELETE", { clear: true });
        cart = Array.isArray(data.items) ? data.items : [];
        try { localStorage.setItem("shoppy_cart", JSON.stringify(cart)); } catch (error) { console.warn("Could not clear local cart cache:", error); }
        showToast("Cart cleared");
      } catch (error) {
        console.error("Clear cart error:", error);
        if (error.message !== "Login required.") { showToast(error.message || "Cart clear nahi hua"); }
      } finally {
        busy = false;
        renderCart();
      }
    });

    checkoutButton.addEventListener("click", () => {
      if (cart.length === 0 || busy) return;
      window.location.href = "/addresses.html?mode=checkout";
    });

    loadCart();
    Promise.all([loadTaxSettings(), loadDiscountSettings()]).then(() => {
      if (cart.length) renderCart();
    });
  </script>
</body>
</html>
