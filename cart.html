<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">

  <title>My Cart — Sequize Shop</title>

  <link rel="icon" type="image/png" href="https://i.ibb.co/93kQCKxT/20261019-120246.png">
  <link rel="stylesheet" href="/global.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --primary: #2962FF;
      --primary-hover: #0059D7;
      --primary-soft: #EDF2FF;
      --background: #FFFFFF;
      --surface-secondary: #F5F5F2;
      --img-bg: #ECEEF1;
      --text-primary: #1E1F1C;
      --text-secondary: #666960;
      --text-muted: #969991;
      --border: #E5E7EB;
      --divider: #E5E7EB;
      --card-border: #E6E9EF;
      --success: #15803D;
      --error: #DC2626;

      --font-body: "DM Sans", sans-serif;
      --font-heading: "Manrope", sans-serif;

      --header-h: 64px;
      --cart-bar-h: 120px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { margin: 0 !important; padding: 0 !important; }

    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100%;
      min-height: 100vh;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.7;
      background: var(--background);
      color: var(--text-primary);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a { text-decoration: none; color: inherit; }
    button { font: inherit; cursor: pointer; }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    [hidden] { display: none !important; }

    /* HEADER: back button + page title inside ONE sticky header, no divider line */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      height: var(--header-h);
      padding: 0 19.5px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 2px;
      background: var(--background);
      border: 0;
      border-bottom: 0;
      box-shadow: none;
      -webkit-backface-visibility: hidden;
    }

    /* only ONE header on this page: back button + title live inside .topbar */
    body > header:not(.topbar) { display: none !important; }

    .topbar::before,
    .topbar::after { content: none !important; display: none !important; }

    .back-button {
      width: 36px;
      height: 36px;
      margin-left: -8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--text-primary);
      font-size: 24px;
      line-height: 1;
    }

    .back-button:active { background: var(--surface-secondary); }

    .topbar h1 {
      font-family: var(--font-heading);
      font-size: 20px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -.3px;
    }

    /* PAGE */

    .container {
      width: auto;
      margin: 16px 19.5px 0;
    }

    .cart-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }

    /* ITEMS: one soft grey rounded card on mobile */

    .cart-items {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--surface-secondary);
    }

    .cart-page:not(.has-items) .cart-items {
      padding: 0;
      background: transparent;
    }

    .ci {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 14px 0;
      min-width: 0;
    }

    .ci-img {
      flex: 0 0 77px;
      width: 77px;
      height: 77px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: var(--img-bg);
      overflow: hidden;
    }

    .ci-img img {
      width: 100%;
      height: 100%;
      padding: 6px;
      object-fit: contain;
      display: block;
      border-radius: 12px;
    }

    .ci-info {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .ci-copy {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
    }

    .ci-title {
      margin: 0;
      font-family: var(--font-body);
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-primary);
      overflow: hidden;
      overflow-wrap: anywhere;
    }

    .ci-price {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .ci-remove {
      margin: 2px 0 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--error);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.2;
    }

    .ci-remove:disabled { opacity: .5; cursor: default; }

    .ci-qty {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 36px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
    }

    .ci-qty button {
      flex: 0 0 26px;
      width: 26px;
      height: 26px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: var(--surface-secondary);
      color: var(--text-primary);
      font-size: 16px;
      line-height: 16px;
    }

    .ci-qty button:disabled { opacity: .4; cursor: default; }

    .ci-qty strong {
      min-width: 20px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;
    }

    /* SUMMARY */

    .summary { min-width: 0; width: 100%; }

    .summary-card-title,
    .summary-lines,
    .summary-note { display: none; }

    .cs-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 9px 0;
      font-size: 14px;
      line-height: 1.4;
      color: var(--text-secondary);
    }

    .cs-row strong {
      color: var(--text-primary);
      font-weight: 600;
      text-align: right;
      white-space: nowrap;
    }

    .cs-row.cs-disc strong { color: var(--success); }

    .cs-row.cs-total {
      margin: 14px 0 9px;
      padding-top: 14px;
      border-top: 1px solid var(--divider);
      font-size: 16px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .cs-row.cs-total strong { font-weight: 800; }

    .summary-note {
      margin: 12px 0 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: #F3F6FF;
      color: #1744B5;
      font-size: 12.5px;
      line-height: 1.45;
    }

    .summary-note:empty { display: none !important; }

    /* CHECKOUT BAR (mobile: fixed to the bottom) */

    .cart-checkout-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 60;
      padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px));
      background: #fff;
      border-top: 1px solid var(--divider);
    }

    .cart-page:not(.has-items) .cart-checkout-bar { display: none; }

    .cart-quick-summary {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-top: 9px;
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.35;
    }

    .cart-quick-summary-top {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .cart-summary-dot { color: var(--text-muted); }

    .cart-quick-summary-payable {
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
    }

    .cart-checkout-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .primary-button {
      flex: 1 1 0;
      min-width: 0;
      height: 42px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
      transition: background .2s;
    }

    .primary-button:hover:not(:disabled) { background: var(--primary-hover); }

    .primary-button:disabled {
      background: #E5E7EB;
      color: var(--text-muted);
      cursor: not-allowed;
    }

    .cart-page.has-items { padding-bottom: calc(var(--cart-bar-h) + 22px); }

    /* EMPTY / ERROR STATE */

    .state {
      min-height: 48vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 0;
      text-align: center;
      color: var(--text-secondary);
    }

    .state-icon {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 29px;
    }

    .state h2 {
      margin: 0 0 8px;
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.7px;
      color: var(--text-primary);
    }

    .state p { max-width: 380px; margin: 0 auto; }

    .state .primary-button {
      flex: none;
      width: 190px;
      max-width: 190px;
      height: 44px;
      margin-top: 22px;
    }

    /* SKELETON */

    .sk-row { display: flex; align-items: center; gap: 18px; padding: 14px 0; }

    .sk {
      background: linear-gradient(90deg, rgba(0,0,0,.06) 25%, rgba(0,0,0,.1) 37%, rgba(0,0,0,.06) 63%);
      background-size: 400% 100%;
      animation: sk 1.4s ease infinite;
      border-radius: 8px;
    }

    .sk-img { flex: 0 0 77px; width: 77px; height: 77px; border-radius: 12px; }
    .sk-copy { flex: 1; display: grid; gap: 9px; }
    .sk-line { height: 13px; }

    @keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

    /* ORDER SUMMARY SHEET (mobile, "View summary") */

    .sheet-overlay {
      position: fixed;
      inset: 0;
      z-index: 10020;
      display: flex;
      align-items: flex-end;
      background: rgba(0, 0, 0, .42);
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s ease, visibility .25s ease;
    }

    .sheet-overlay.open { opacity: 1; visibility: visible; }

    .sheet {
      width: 100%;
      max-height: 78vh;
      overflow: auto;
      padding: 20px 18px calc(24px + env(safe-area-inset-bottom, 0px));
      border-radius: 20px 20px 0 0;
      background: #fff;
      transform: translateY(24px);
      transition: transform .28s ease;
    }

    .sheet-overlay.open .sheet { transform: translateY(0); }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 17px;
    }

    .sheet-head button {
      width: 34px;
      height: 34px;
      border: 1px solid #D9DCE1;
      border-radius: 50%;
      background: #fff;
      color: #333;
      font-size: 22px;
      line-height: 1;
    }

    .sheet .cs-row { font-size: 12.5px; margin: 5px 0; }
    .sheet .cs-row.cs-total { font-size: 14px; margin-top: 9px; padding-top: 9px; }
    .sheet .summary-note { display: block; margin: 8px 0 0; font-size: 11.5px; }

    /* TOAST */

    .toast {
      position: fixed;
      bottom: calc(var(--cart-bar-h) + 16px);
      left: 50%;
      transform: translate(-50%, 15px);
      max-width: calc(100% - 30px);
      padding: 12px 18px;
      border-radius: 12px;
      background: var(--text-primary);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      z-index: 10030;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* DESKTOP */

    @media (min-width: 761px) {
      .topbar {
        height: 68px;
        padding: 0 24px;
      }

      .container {
        width: min(1240px, calc(100% - 48px));
        margin: 28px auto 48px;
      }

      .topbar h1 { font-size: 22px; }

      .cart-page.has-items { padding-bottom: 0; }

      .cart-page.has-items .cart-layout {
        grid-template-columns: minmax(0, 1fr) 380px;
        gap: 24px;
      }

      .cart-page.has-items .cart-items {
        padding: 8px 22px;
        border: 1px solid var(--card-border);
        border-radius: 20px;
        background: #fff;
      }

      .ci-title {
        font-size: 13px;
        white-space: nowrap;
      }

      .ci-price { font-size: 13px; }
      .ci-remove { font-size: 10px; }

      .summary {
        position: sticky;
        top: 24px;
        padding: 22px 22px 20px;
        border: 1px solid var(--card-border);
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(16, 24, 40, .06);
      }

      .cart-page:not(.has-items) .summary { display: none; }

      .summary-card-title {
        display: block;
        margin: 0 0 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--divider);
        font: 800 18px var(--font-heading);
        color: var(--text-primary);
      }

      .summary-lines { display: block; }
      .summary-note { display: block; }

      .cart-checkout-bar {
        position: static;
        margin-top: 16px;
        padding: 0;
        background: transparent;
        border-top: 0;
      }

      .cart-quick-summary,
      #viewSummaryButton { display: none; }

      .cart-checkout-actions { margin: 0; display: block; }

      #checkoutButton {
        width: 100%;
        height: 48px;
        font-size: 15px;
      }

      .toast { bottom: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sk { animation: none; }
      .sheet, .sheet-overlay, .toast { transition: none; }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <button type="button" class="back-button" id="backButton" aria-label="Back">
      <i class="ph-bold ph-caret-left" aria-hidden="true"></i>
    </button>
    <h1>My Cart</h1>
  </header>

  <main id="cartPage" class="container cart-page">

    <div class="cart-layout">

      <section id="cartItems" class="cart-items" aria-live="polite" aria-busy="true"></section>

      <aside class="summary" id="summary">
        <h2 class="summary-card-title">Order Summary</h2>
        <div class="summary-lines" id="summaryLines"></div>
        <p class="summary-note" id="summaryNote"></p>

        <div class="cart-checkout-bar" id="cartCheckoutBar">
          <div class="cart-quick-summary" id="cartQuickSummary" aria-live="polite"></div>
          <div class="cart-checkout-actions">
            <button id="checkoutButton" class="primary-button" type="button" disabled>Continue to pay</button>
            <button id="viewSummaryButton" class="primary-button" type="button">View summary</button>
          </div>
        </div>
      </aside>

    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Shared image proxy: every remote product image goes through one proxy -->
  <script id="shared-image-proxy">
  (function () {
    "use strict";
    var PREFIX = "https://images.weserv.nl/?url=";
    function proxied(value) {
      var raw = String(value || "").trim();
      if (raw.indexOf("//") === 0) raw = "https:" + raw;
      if (!raw || raw.startsWith("data:") || raw.startsWith("blob:") || raw.startsWith("/") || raw.startsWith("#")) return raw;
      if (raw.indexOf("images.weserv.nl/?url=") !== -1) return raw;
      if (!/^https?:\/\//i.test(raw)) return raw;
      return PREFIX + encodeURIComponent(raw.replace(/^https?:\/\//i, ""));
    }
    function apply(img) {
      if (!(img instanceof HTMLImageElement) || img.dataset.sharedProxyApplied === "1") return;
      var original = img.getAttribute("src");
      if (!original) return;
      var next = proxied(original);
      if (next !== original) {
        img.dataset.sharedProxyOriginal = original;
        img.dataset.sharedProxyApplied = "1";
        img.removeAttribute("srcset");
        img.referrerPolicy = "no-referrer";
        img.setAttribute("src", next);
      }
    }
    function scan(root) {
      if (!root) return;
      if (root instanceof HTMLImageElement) apply(root);
      if (root.querySelectorAll) root.querySelectorAll("img").forEach(apply);
    }
    /* If the proxy cannot load an image, try the original URL once before any placeholder runs. */
    document.addEventListener("error", function (e) {
      var img = e.target;
      if (!(img instanceof HTMLImageElement)) return;
      var o = img.dataset.sharedProxyOriginal;
      if (img.dataset.sharedProxyApplied === "1" && o && !img.dataset.sharedProxyRetried) {
        img.dataset.sharedProxyRetried = "1";
        e.stopImmediatePropagation();
        img.setAttribute("src", o);
      }
    }, true);
    scan(document);
    new MutationObserver(function (records) {
      records.forEach(function (record) {
        if (record.type === "childList") record.addedNodes.forEach(scan);
        else if (record.type === "attributes") apply(record.target);
      });
    }).observe(document.documentElement, { subtree: true, childList: true, attributes: true, attributeFilter: ["src"] });
  })();
  </script>

  <script>
    "use strict";

    const page = document.getElementById("cartPage");
    const cartItemsEl = document.getElementById("cartItems");
    const summaryLinesEl = document.getElementById("summaryLines");
    const summaryNoteEl = document.getElementById("summaryNote");
    const quickEl = document.getElementById("cartQuickSummary");
    const checkoutButton = document.getElementById("checkoutButton");
    const viewSummaryButton = document.getElementById("viewSummaryButton");
    const barEl = document.getElementById("cartCheckoutBar");
    const toast = document.getElementById("toast");

    const USD_TO_INR = 85;
    const PLACEHOLDER = "https://placehold.co/300x300/f5f5f2/969991?text=Product";

    let cart = [];
    let busy = false;
    let toastTimer = null;
    let taxSettings = [
      { title: "Shipping", percent: 2 },
      { title: "Packaging", percent: 3 },
      { title: "Platform fee", percent: 1 },
      { title: "Delivery charges", percent: 2 },
      { title: "GST", percent: 18 }
    ];
    let eligibleDiscounts = [];

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    /* prices: USD values from the API shown as INR, 2 decimals */
    function price(usd) {
      return new Intl.NumberFormat("en-IN", {
        style: "currency", currency: "INR", minimumFractionDigits: 2, maximumFractionDigits: 2
      }).format((Number(usd) || 0) * USD_TO_INR);
    }

    /* short INR: no decimals unless needed */
    function rs(inr) {
      const n = Number(inr) || 0;
      return "₹" + new Intl.NumberFormat("en-IN", {
        minimumFractionDigits: Math.abs(n % 1) > 0.004 ? 2 : 0, maximumFractionDigits: 2
      }).format(n);
    }

    function niceTitle(raw) {
      return String(raw || "Product").trim()
        .replace(/([a-z])([0-9])/gi, "$1$2").replace(/([0-9])([a-z])/gi, "$1 $2")
        .split(/\s+/).filter(Boolean)
        .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(" ");
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    /* keep the page clear of the fixed bottom bar (mobile) */
    function syncBarHeight() {
      document.documentElement.style.setProperty("--cart-bar-h", Math.ceil(barEl.getBoundingClientRect().height || 120) + "px");
    }
    if (window.ResizeObserver) new ResizeObserver(syncBarHeight).observe(barEl);
    window.addEventListener("resize", syncBarHeight, { passive: true });

    document.getElementById("backButton").addEventListener("click", () => {
      if (history.length > 1) history.back();
      else window.location.href = "/home.html";
    });

    async function loadTaxSettings() {
      try {
        const response = await fetch("https://apisequizeshoplite.vercel.app/api/admin/taxes", {
          method: "GET", headers: { Accept: "application/json" }, cache: "no-store"
        });
        const data = await response.json().catch(() => ({}));
        if (response.ok && data.success && Array.isArray(data.taxes)) {
          taxSettings = data.taxes.filter(t => t && String(t.title || "").trim() &&
            Number.isFinite(Number(t.percent)) && Number(t.percent) >= 0 && Number(t.percent) <= 100);
        }
      } catch (error) {
        console.warn("Cart charge settings unavailable; using defaults.", error);
      }
    }

    async function loadDiscountSettings() {
      try {
        let email = "";
        try {
          const cached = JSON.parse(localStorage.getItem("shoppy_profile_cache_v1") || "null");
          if (cached && cached.user && cached.user.email && Number(cached.expiresAt) > Date.now()) {
            email = String(cached.user.email).trim().toLowerCase();
          }
        } catch (_) {}
        if (!email) {
          try {
            const pr = await fetch("/api/profile", {
              method: "GET", credentials: "same-origin",
              headers: { Accept: "application/json" }, cache: "no-store"
            });
            const pd = await pr.json().catch(() => ({}));
            if (pr.ok && pd.success && pd.user && pd.user.email) email = String(pd.user.email).trim().toLowerCase();
          } catch (_) {}
        }
        const url = "https://apisequizeshoplite.vercel.app/api/admin/productData?resource=discounts" +
          (email ? "&email=" + encodeURIComponent(email) : "");
        const response = await fetch(url, { method: "GET", headers: { Accept: "application/json" }, cache: "no-store" });
        const data = await response.json().catch(() => ({}));
        if (response.ok && data.success && Array.isArray(data.discounts)) {
          eligibleDiscounts = data.discounts.filter(d => d && Number(d.percent) > 0 && Number(d.percent) <= 100);
        }
      } catch (error) {
        console.warn("Customer discounts unavailable.", error);
      }
    }

    function stateHTML(icon, title, text, action) {
      return `<div class="state"><span class="state-icon"><i class="ph ${icon}" aria-hidden="true"></i></span>` +
        `<h2>${title}</h2><p>${text}</p>${action || ""}</div>`;
    }

    function renderSkeleton() {
      cartItemsEl.setAttribute("aria-busy", "true");
      page.classList.add("has-items");
      cartItemsEl.innerHTML = Array.from({ length: 3 }, () =>
        `<div class="sk-row" aria-hidden="true"><div class="sk sk-img"></div>` +
        `<div class="sk-copy"><div class="sk sk-line" style="width:80%"></div><div class="sk sk-line" style="width:50%"></div><div class="sk sk-line" style="width:25%"></div></div></div>`
      ).join("");
      summaryLinesEl.innerHTML = "";
      summaryNoteEl.textContent = "";
      quickEl.innerHTML = "";
      checkoutButton.disabled = true;
    }

    async function cartRequest(method, body) {
      const options = { method, headers: { Accept: "application/json" }, credentials: "same-origin", cache: "no-store" };
      if (body !== undefined) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(body);
      }
      const response = await fetch("/api/cart", options);
      const text = await response.text();
      let data;
      try { data = JSON.parse(text); } catch { throw new Error(`Cart API response invalid (HTTP ${response.status}).`); }
      if (response.status === 401) { window.location.href = "/login.html"; throw new Error("Login required."); }
      if (!response.ok || data.success !== true) throw new Error(data.message || "Cart request failed.");
      return data;
    }

    async function loadCart() {
      renderSkeleton();
      try {
        const data = await cartRequest("GET");
        cart = Array.isArray(data.items) ? data.items : [];
        try { localStorage.setItem("shoppy_cart", JSON.stringify(cart)); } catch (_) {}
        renderCart();
      } catch (error) {
        console.error("Cart loading error:", error);
        if (error.message === "Login required.") return;
        page.classList.remove("has-items");
        cartItemsEl.innerHTML = stateHTML("ph-warning-circle", "Unable to load cart",
          esc(error.message), '<button type="button" id="retryCart" class="primary-button">Try Again</button>');
        document.getElementById("retryCart").addEventListener("click", loadCart);
      } finally {
        cartItemsEl.setAttribute("aria-busy", "false");
      }
    }

    function renderCart() {
      const count = cart.reduce((n, x) => n + (Number(x.quantity) || 1), 0);
      const subtotal = cart.reduce((n, x) => n + (Number(x.price) || 0) * (Number(x.quantity) || 1), 0);
      const totalPct = Math.min(100, eligibleDiscounts.reduce((n, d) => n + (Number(d.percent) || 0), 0));
      const discountAmount = subtotal * totalPct / 100;
      const chargeBase = Math.max(0, subtotal - discountAmount);
      const charges = taxSettings.map(t => ({ ...t, amount: chargeBase * (Number(t.percent) || 0) / 100 }));
      const total = chargeBase + charges.reduce((n, t) => n + t.amount, 0);
      const totalINR = Math.max(0, total * USD_TO_INR);
      const advanceINR = Math.min(600, totalINR);
      const codINR = Math.max(0, totalINR - advanceINR);

      page.classList.toggle("has-items", cart.length > 0);
      checkoutButton.disabled = !cart.length || busy;
      checkoutButton.textContent = cart.length ? "Pay " + rs(advanceINR) : "Continue to pay";

      if (!cart.length) {
        summaryLinesEl.innerHTML = "";
        summaryNoteEl.textContent = "";
        quickEl.innerHTML = "";
        cartItemsEl.innerHTML = stateHTML("ph-shopping-cart", "Your cart is empty",
          "Looks like you haven't added any products yet.",
          '<a href="/home.html" class="primary-button">Start Shopping</a>');
        return;
      }

      quickEl.innerHTML =
        `<div class="cart-quick-summary-top"><span>${rs(subtotal * USD_TO_INR)} Total</span><span class="cart-summary-dot">•</span><span>− ${rs(discountAmount * USD_TO_INR)} Discount</span></div>` +
        `<strong class="cart-quick-summary-payable">${rs(totalINR)} Payable Amount</strong>`;

      let h = `<div class="cs-row"><span>Subtotal (${count} ${count === 1 ? "item" : "items"})</span><strong>${price(subtotal)}</strong></div>`;
      if (totalPct > 0) {
        eligibleDiscounts.forEach(d => {
          const pc = Number(d.percent) || 0;
          if (pc > 0) h += `<div class="cs-row cs-disc"><span>${esc(d.title || d.name || d.label || "Discount")} (${Number(pc.toFixed(2))}%)</span><strong>-${price(subtotal * pc / 100)}</strong></div>`;
        });
      }
      charges.forEach(t => {
        h += `<div class="cs-row"><span>${esc(t.title)} (${Number(Number(t.percent).toFixed(2))}%)</span><strong>${price(t.amount)}</strong></div>`;
      });
      h += `<div class="cs-row cs-total"><span>Total amount</span><strong>${price(total)}</strong></div>`;
      summaryLinesEl.innerHTML = h;

      summaryNoteEl.textContent =
        `Pay ${rs(advanceINR)} online now. ${codINR > 0 ? rs(codINR) + " is collected at delivery." : "Nothing is due at delivery."}`;

      cartItemsEl.innerHTML = cart.map(item => {
        const id = esc(item.id);
        const title = esc(niceTitle(item.title));
        const q = Math.max(1, Number(item.quantity) || 1);
        const p = Math.max(0, Number(item.price) || 0);
        const img = esc(item.thumbnail || "");

        return `<article class="ci">
          <div class="ci-img"><img src="${img}" alt="" loading="lazy" onerror="this.onerror=null;this.src='${PLACEHOLDER}'"></div>
          <div class="ci-info">
            <div class="ci-copy">
              <h3 class="ci-title">${title}</h3>
              <p class="ci-price">${price(p)} × ${q}</p>
              <button class="ci-remove" type="button" data-action="remove" data-id="${id}" ${busy ? "disabled" : ""}>Remove</button>
            </div>
            <div class="ci-qty">
              <button type="button" aria-label="Decrease quantity" data-action="decrease" data-id="${id}" ${q <= 1 || busy ? "disabled" : ""}>−</button>
              <strong>${q}</strong>
              <button type="button" aria-label="Increase quantity" data-action="increase" data-id="${id}" ${q >= 99 || busy ? "disabled" : ""}>+</button>
            </div>
          </div>
        </article>`;
      }).join("");

      cartItemsEl.querySelectorAll("[data-action]").forEach(b => {
        b.addEventListener("click", () => handleCartAction(b.dataset.action, b.dataset.id));
      });

      syncBarHeight();
    }

    async function handleCartAction(action, id) {
      if (busy) return;
      const item = cart.find(p => String(p.id) === String(id));
      if (!item) return;

      busy = true;
      renderCart();

      try {
        let data;
        if (action === "increase" || action === "decrease") {
          let q = Number(item.quantity) || 1;
          q = action === "increase" ? Math.min(99, q + 1) : Math.max(1, q - 1);
          data = await cartRequest("PATCH", { id, quantity: q });
          showToast("Quantity updated");
        } else {
          data = await cartRequest("DELETE", { id });
          showToast("Product removed from cart");
        }
        cart = Array.isArray(data.items) ? data.items : [];
        try { localStorage.setItem("shoppy_cart", JSON.stringify(cart)); } catch (_) {}
      } catch (error) {
        console.error("Cart update error:", error);
        if (error.message !== "Login required.") showToast(error.message || "Cart update failed");
      } finally {
        busy = false;
        renderCart();
      }
    }

    /* View summary (mobile): bottom sheet with the full breakdown */
    viewSummaryButton.addEventListener("click", () => {
      let overlay = document.getElementById("cartSummarySheet");
      if (!overlay) {
        overlay = document.createElement("div");
        overlay.id = "cartSummarySheet";
        overlay.className = "sheet-overlay";
        overlay.innerHTML =
          '<section class="sheet" role="dialog" aria-modal="true" aria-label="Order summary">' +
          '<div class="sheet-head"><strong>Order Summary</strong><button type="button" id="cartSummaryClose" aria-label="Close summary">×</button></div>' +
          '<div id="cartSummarySheetContent"></div></section>';
        document.body.appendChild(overlay);
        overlay.addEventListener("click", e => {
          if (e.target === overlay || e.target.id === "cartSummaryClose") overlay.classList.remove("open");
        });
      }
      document.getElementById("cartSummarySheetContent").innerHTML =
        summaryLinesEl.innerHTML + `<p class="summary-note">${esc(summaryNoteEl.textContent)}</p>`;
      overlay.classList.add("open");
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        const o = document.getElementById("cartSummarySheet");
        if (o) o.classList.remove("open");
      }
    });

    checkoutButton.addEventListener("click", () => {
      if (!cart.length || busy) return;
      window.location.href = "/addresses.html?mode=checkout";
    });

    syncBarHeight();
    loadCart();
    Promise.all([loadTaxSettings(), loadDiscountSettings()]).then(() => {
      if (cart.length) renderCart();
    });
  </script>
</body>
</html>
