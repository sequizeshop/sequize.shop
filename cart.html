<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>My Cart — Shoppy</title>

  <link rel="icon" type="image/png" href="https://i.ibb.co/93kQCKxT/20261019-120246.png">
  <link rel="stylesheet" href="/global.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Manrope:wght@800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    body { background: var(--paper); color: var(--ink); }
    .navbar { min-height: 76px; padding: 0 7%; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--paper); z-index: 10; }
    .brand img { width: 46px; height: 46px; object-fit: contain; display: block; }
    .nav-actions { display: flex; align-items: center; gap: 22px; }
    .nav-icon { width: 32px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 23px; color: var(--ink); }
    .container { width: 86%; max-width: 1200px; margin: 45px auto 70px; background: var(--paper); }
    .page-heading { margin-bottom: 30px; }
    .page-heading h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 800; letter-spacing: -1.5px; }
    .page-heading p { margin-top: 9px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .cart-layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; align-items: start; gap: 25px; }
    .cart-items { display: flex; flex-direction: column; gap: 14px; background: var(--paper); }
    .cart-item { display: flex; align-items: center; gap: 18px; padding: 17px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
    .item-image { width: 115px; height: 115px; flex-shrink: 0; border-radius: 12px; background: #f7f7f7; padding: 10px; display: flex; align-items: center; justify-content: center; }
    .item-image img { width: 100%; height: 100%; object-fit: contain; }
    .item-info { min-width: 0; flex: 1; }
    .item-title { font-size: 14px; line-height: 1.6; font-weight: 700; overflow-wrap: anywhere; }
    .item-unit-price { margin-top: 7px; color: var(--muted); font-size: 12px; }
    .item-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 15px; }
    .quantity-control { display: inline-flex; align-items: center; gap: 13px; padding: 5px; border: 1px solid var(--line); border-radius: 10px; }
    .quantity-control button { width: 27px; height: 27px; display: flex; align-items: center; justify-content: center; border: 0; background: #f7f7f7; border-radius: 6px; font-size: 17px; cursor: pointer; }
    .quantity-value { min-width: 16px; text-align: center; font-size: 12px; font-weight: 700; }
    .remove-button { border: 0; background: transparent; color: var(--red); font-size: 11px; font-weight: 700; cursor: pointer; }
    .item-total { min-width: 95px; text-align: right; font-size: 15px; font-weight: 800; white-space: nowrap; }
    .summary { padding: 23px; border: 1px solid var(--line); border-radius: 12px; position: sticky; top: 100px; background: var(--paper); }
    .summary h2 { font-size: 18px; font-weight: 800; margin-bottom: 23px; }
    .summary-line { display: flex; justify-content: space-between; gap: 12px; margin: 15px 0; font-size: 12px; color: var(--muted); }
    .summary-line strong { color: var(--ink); font-weight: 700; text-align: right; }
    .summary-divider { height: 1px; background: var(--line); margin: 20px 0; }
    .summary-total { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; font-weight: 800; }
    .checkout-button, .continue-button, .clear-cart-button { width: 100%; display: flex; justify-content: center; align-items: center; gap: 9px; border-radius: 10px; padding: 14px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .checkout-button { margin-top: 23px; border: 0; background: var(--ink); color: #fff; }
    .continue-button { margin-top: 10px; background: var(--paper); border: 1px solid var(--line); color: var(--ink); }
    .clear-cart-button { margin-top: 12px; background: var(--paper); border: 0; color: var(--red); }
    .status { padding: 55px 20px; border: 1px solid var(--line); border-radius: 12px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.8; background: var(--paper); }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 15px); padding: 13px 18px; border-radius: 10px; background: #111; color: #fff; font-size: 12px; font-weight: 600; opacity: 0; pointer-events: none; transition: .2s; z-index: 100; text-align: center; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .footer { border-top: 1px solid var(--line); padding: 25px 7%; display: flex; justify-content: space-between; gap: 15px; color: var(--muted); font-size: 11px; background: var(--paper); }
  </style>
</head>

<body>

  <header class="navbar">
    <a href="/home.html" class="brand" aria-label="Shoppy home">
      <img src="https://i.ibb.co/93kQCKxT/20261019-120246.png" alt="Shoppy logo">
    </a>

    <nav class="nav-actions" aria-label="Main navigation">
      <a class="nav-icon" href="/home.html" aria-label="Home" title="Home">
        <i class="ph ph-house" aria-hidden="true"></i>
      </a>

      <a class="nav-icon" href="/cart.html" aria-label="Cart" title="Cart">
        <i class="ph ph-shopping-cart" aria-hidden="true"></i>
      </a>

      <a class="nav-icon" href="/profile.html" aria-label="My profile" title="My profile">
        <i class="ph ph-user-circle" aria-hidden="true"></i>
      </a>
    </nav>
  </header>

  <main class="container">

    <div class="page-heading">
      <h1>My Shopping Cart</h1>
      <p>Your selected products, all in one place.</p>
    </div>

    <div class="cart-layout">

      <section id="cartItems" class="cart-items" aria-live="polite" aria-busy="true"></section>

      <aside class="summary">

        <h2>Order Summary</h2>

        <div class="summary-line">
          <span>Items</span>
          <strong id="summaryQuantity">0</strong>
        </div>

        <div class="summary-line">
          <span>Subtotal</span>
          <strong id="summarySubtotal">₹0.00</strong>
        </div>

        <div class="summary-line">
          <span>Shipping</span>
          <strong>Calculated at checkout</strong>
        </div>

        <div class="summary-divider"></div>

        <div class="summary-total">
          <span>Total</span>
          <strong id="summaryTotal">₹0.00</strong>
        </div>

        <button id="checkoutButton" class="checkout-button" type="button" disabled>
          Continue to Checkout
          <i class="ph ph-arrow-right" aria-hidden="true"></i>
        </button>

        <a href="/home.html" class="continue-button">
          <i class="ph ph-arrow-left" aria-hidden="true"></i>
          Continue Shopping
        </a>

        <button id="clearCartButton" class="clear-cart-button" type="button" hidden>
          <i class="ph ph-trash" aria-hidden="true"></i>
          Clear Cart
        </button>

      </aside>

    </div>
  </main>

  <footer class="footer">
    <span>© <span id="year"></span> Shoppy</span>
    <span>Your shopping, all in one place.</span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    const cartItemsEl = document.getElementById("cartItems");
    const summaryQuantity = document.getElementById("summaryQuantity");
    const summarySubtotal = document.getElementById("summarySubtotal");
    const summaryTotal = document.getElementById("summaryTotal");
    const checkoutButton = document.getElementById("checkoutButton");
    const clearCartButton = document.getElementById("clearCartButton");
    const toast = document.getElementById("toast");

    const USD_TO_INR = 85;
    let cart = [];
    let toastTimer = null;
    let busy = false;

    document.getElementById("year").textContent = new Date().getFullYear();

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    function formatPrice(price) {
      const usdPrice = Number(price) || 0;
      const inrPrice = usdPrice * USD_TO_INR;
      return new Intl.NumberFormat("en-IN", {
        style: "currency", currency: "INR", minimumFractionDigits: 2, maximumFractionDigits: 2
      }).format(inrPrice);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.classList.remove("show"); }, 2200);
    }

    function renderSkeleton() {
      cartItemsEl.setAttribute("aria-busy", "true");
      cartItemsEl.innerHTML = Array.from({ length: 3 }, () => `
        <div class="skeleton-card" aria-hidden="true" style="padding:17px; border:1px solid var(--line); border-radius:12px; background:var(--paper); display:flex; gap:18px;">
          <div style="width:115px; height:115px; background:#f7f7f7; border-radius:10px;"></div>
          <div style="flex:1;">
            <div style="height:15px; width:80%; background:#f7f7f7; margin-bottom:10px; border-radius:4px;"></div>
            <div style="height:12px; width:40%; background:#f7f7f7; border-radius:4px;"></div>
          </div>
        </div>
      `).join("");
      summaryQuantity.textContent = "—";
      summarySubtotal.textContent = "Loading…";
      summaryTotal.textContent = "Loading…";
      checkoutButton.disabled = true;
      clearCartButton.hidden = true;
    }

    async function cartRequest(method, body) {
      const options = {
        method, headers: { Accept: "application/json" }, credentials: "same-origin", cache: "no-store"
      };
      if (body !== undefined) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(body);
      }
      const response = await fetch("/api/cart", options);
      const text = await response.text();
      let data;
      try { data = JSON.parse(text); } catch { throw new Error(`Cart API valid JSON nahi de rahi (HTTP ${response.status}).`); }
      if (response.status === 401) { window.location.href = "/login.html"; throw new Error("Login required."); }
      if (!response.ok || data.success !== true) { throw new Error(data.message || "Cart request fail ho gayi."); }
      return data;
    }

    async function loadCart() {
      renderSkeleton();
      try {
        const data = await cartRequest("GET");
        cart = Array.isArray(data.items) ? data.items : [];
        try { localStorage.setItem("shoppy_cart", JSON.stringify(cart)); } catch (error) { console.warn("Could not update local cart cache:", error); }
        renderCart();
      } catch (error) {
        console.error("Cart loading error:", error);
        if (error.message === "Login required.") return;
        cartItemsEl.innerHTML = `
          <div class="status">
            <i class="ph ph-warning-circle" style="font-size:46px; margin-bottom:14px;"></i>
            <h2>Unable to load cart</h2>
            <p>${escapeHTML(error.message)}</p>
            <button type="button" id="retryCart" style="margin-top:14px; padding:10px 16px; border:0; background:var(--ink); color:#fff; border-radius:8px;">Try Again</button>
          </div>
        `;
        document.getElementById("retryCart").addEventListener("click", loadCart);
      } finally {
        cartItemsEl.setAttribute("aria-busy", "false");
      }
    }

    function renderCart() {
      const totalQuantity = cart.reduce((sum, item) => sum + (Number(item.quantity) || 1), 0);
      const subtotal = cart.reduce((sum, item) => sum + (Number(item.price) || 0) * (Number(item.quantity) || 1), 0);

      summaryQuantity.textContent = String(totalQuantity);
      summarySubtotal.textContent = formatPrice(subtotal);
      summaryTotal.textContent = formatPrice(subtotal);

      checkoutButton.disabled = cart.length === 0 || busy;
      clearCartButton.hidden = cart.length === 0;
      clearCartButton.disabled = busy;

      if (!cart.length) {
        cartItemsEl.innerHTML = `
          <div class="status">
            <i class="ph ph-shopping-cart" style="font-size:46px; margin-bottom:14px;"></i>
            <h2>Your cart is empty</h2>
            <p>Looks like you haven't added any products yet.</p>
            <a href="/home.html" style="margin-top:14px; display:inline-flex; align-items:center; gap:8px; padding:12px 18px; background:var(--ink); color:#fff; border-radius:9px;">
              Start Shopping <i class="ph ph-arrow-right"></i>
            </a>
          </div>
        `;
        return;
      }

      cartItemsEl.innerHTML = cart.map(item => {
        const image = escapeHTML(item.thumbnail || "");
        const title = escapeHTML(item.title || "Product");
        const id = escapeHTML(item.id);
        const quantity = Math.max(1, Number(item.quantity) || 1);
        const price = Math.max(0, Number(item.price) || 0);

        return `
          <article class="cart-item" data-id="${id}">
            <div class="item-image">
              <img src="${image}" alt="${title}" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/300x300/f6f6f6/777?text=Product';">
            </div>

            <div class="item-info">
              <h3 class="item-title">${title}</h3>
              <p class="item-unit-price">${formatPrice(price)} each</p>

              <div class="item-controls">
                <div class="quantity-control">
                  <button type="button" data-action="decrease" data-id="${id}" aria-label="Decrease quantity" ${quantity <= 1 || busy ? "disabled" : ""}>−</button>
                  <span class="quantity-value">${quantity}</span>
                  <button type="button" data-action="increase" data-id="${id}" aria-label="Increase quantity" ${quantity >= 99 || busy ? "disabled" : ""}>+</button>
                </div>
                <button class="remove-button" type="button" data-action="remove" data-id="${id}" ${busy ? "disabled" : ""}>Remove</button>
              </div>
            </div>

            <div class="item-total">${formatPrice(price * quantity)}</div>
          </article>
        `;
      }).join("");

      cartItemsEl.querySelectorAll("[data-action]").forEach(button => {
        button.addEventListener("click", () => {
          handleCartAction(button.dataset.action, button.dataset.id);
        });
      });
    }

    async function handleCartAction(action, id) {
      if (busy) return;
      const item = cart.find(product => String(product.id) === String(id));
      if (!item) return;

      busy = true;
      renderCart();

      try {
        if (action === "increase" || action === "decrease") {
          let quantity = Number(item.quantity) || 1;
          quantity = action === "increase" ? Math.min(99, quantity + 1) : Math.max(1, quantity - 1);
          const data = await cartRequest("PATCH", { id, quantity });
          cart = Array.isArray(data.items) ? data.items : [];
          showToast("Quantity updated");
        } else if (action === "remove") {
          const data = await cartRequest("DELETE", { id });
          cart = Array.isArray(data.items) ? data.items : [];
          showToast("Product removed from cart");
        }
        try { localStorage.setItem("shoppy_cart", JSON.stringify(cart)); } catch (error) { console.warn("Could not update local cart cache:", error); }
      } catch (error) {
        console.error("Cart update error:", error);
        if (error.message !== "Login required.") { showToast(error.message || "Cart update nahi hua"); }
      } finally {
        busy = false;
        renderCart();
      }
    }

    clearCartButton.addEventListener("click", async () => {
      if (busy || cart.length === 0) return;
      if (!window.confirm("Kya aap apne cart ke saare products remove karna chahte hain?")) return;

      busy = true;
      renderCart();

      try {
        const data = await cartRequest("DELETE", { clear: true });
        cart = Array.isArray(data.items) ? data.items : [];
        try { localStorage.setItem("shoppy_cart", JSON.stringify(cart)); } catch (error) { console.warn("Could not clear local cart cache:", error); }
        showToast("Cart cleared");
      } catch (error) {
        console.error("Clear cart error:", error);
        if (error.message !== "Login required.") { showToast(error.message || "Cart clear nahi hua"); }
      } finally {
        busy = false;
        renderCart();
      }
    });

    checkoutButton.addEventListener("click", () => {
      if (cart.length === 0 || busy) return;
      window.location.href = "/addresses.html?mode=checkout";
    });

    loadCart();
  </script>
</body>
</html>
